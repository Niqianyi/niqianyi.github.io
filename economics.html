      <p>· <b>为什么有人赌博:</b>风险喜好者 U(EQ)&amp;lt;EU,愿为&quot;搏一把&quot;付费。</p>
      <p>· <b>分散风险:</b>不把鸡蛋放一个篮子,降低结果方差,对风险厌恶者提升期望效用。</p>
      <div class=&quot;note&quot;><b>期望值 ≠ 期望效用。</b>决策依据是<b>期望效用</b>(对结果先取效用再加权),而非简单期望值——这正是圣彼得堡悖论的解。</div>
    </div>
  </div>
</div></section>

<footer><div class=&quot;wrap&quot;>交互推导工具 · 微观十大核心图之三 · 依《经济学原理（微观部分）》课程口径编制。</div></footer>

<script>
/* ===== 词典 ===== */
const GLOSS=[
 [&quot;不确定性&quot;,&quot;uncertainty&quot;,&quot;Uncertainty&quot;,&quot;结果事先不能确知的状态。&quot;,&quot;p-c&quot;],
 [&quot;风险&quot;,&quot;risk&quot;,&quot;Risk&quot;,&quot;结果不确定、但各结果的概率已知。&quot;,&quot;p-c&quot;],
 [&quot;E(Q)&quot;,&quot;期望值&quot;,&quot;Expected value&quot;,&quot;各结果按概率加权的均值,EQ=Σpᵢqᵢ。&quot;,&quot;p-c&quot;],
 [&quot;U(EQ)&quot;,&quot;期望值的效用&quot;,&quot;Utility of expected value&quot;,&quot;先算期望值,再取效用。图上是<b>曲线</b>在 EQ 处的高度。&quot;,&quot;p-m&quot;],
 [&quot;EU(Q)&quot;,&quot;期望效用&quot;,&quot;Expected utility&quot;,&quot;各结果效用按概率加权,EU=ΣpᵢU(qᵢ)。图上是<b>弦</b>在 EQ 处的高度。&quot;,&quot;p-m&quot;],
 [&quot;CE&quot;,&quot;确定性等值&quot;,&quot;Certainty equivalent&quot;,&quot;与赌局等效用的<b>确定</b>金额,U(CE)=EU。&quot;,&quot;p-a&quot;],
 [&quot;风险溢价&quot;,&quot;risk premium&quot;,&quot;Risk premium&quot;,&quot;EQ − CE。风险厌恶者愿为「确定」放弃的金额(=保费上限)。&quot;,&quot;p-t&quot;],
 [&quot;风险厌恶&quot;,&quot;risk averse&quot;,&quot;Risk averse&quot;,&quot;U(EQ) &amp;gt; EU,效用凹、MU 递减。多数人、买保险。&quot;,&quot;p-a&quot;],
 [&quot;风险中性&quot;,&quot;risk neutral&quot;,&quot;Risk neutral&quot;,&quot;U(EQ) = EU,效用线性,只看期望值。&quot;,&quot;p-a&quot;],
 [&quot;风险喜好&quot;,&quot;risk loving&quot;,&quot;Risk loving&quot;,&quot;U(EQ) &amp;lt; EU,效用凸、MU 递增。爱赌博。&quot;,&quot;p-a&quot;],
 [&quot;MU 递减&quot;,&quot;diminishing MU&quot;,&quot;Diminishing marginal utility&quot;,&quot;财富越多,每元带来的效用越小 ⇒ 效用曲线凹。&quot;,&quot;p-c&quot;],
 [&quot;期望效用理论&quot;,&quot;expected utility&quot;,&quot;Expected utility theory&quot;,&quot;理性人按<b>期望效用</b>最大化决策,而非期望值。&quot;,&quot;p-t&quot;],
];
(function(){const g=document.getElementById('glossGrid');
 GLOSS.forEach(([s,cn,en,d,p])=>{const e=document.createElement('div');e.className='card';
  const col=p==='p-c'?'var(--util)':p==='p-m'?'var(--chord)':p==='p-a'?'var(--ce)':'var(--violet)';
  e.innerHTML=`<span class=&quot;sym&quot; style=&quot;color:${col}&quot;>${s}</span><span class=&quot;cn&quot;>${cn}</span><div class=&quot;en&quot;>${en}</div><div class=&quot;desc&quot;>${d}</div><span class=&quot;pill ${p}&quot;>${p==='p-c'?'基础概念':p==='p-m'?'两个度量':p==='p-a'?'风险态度':'决策'}</span>`;
  g.appendChild(e);});})();

/* ===== 绘图基元 ===== */
function _css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function mx(v,P){return P.px+(v-P.xMin)/(P.xMax-P.xMin)*P.pw;}
function my(v,P){return P.py+P.ph-(v-P.yMin)/(P.yMax-P.yMin)*P.ph;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function L(x1,y1,x2,y2,c,w,ex=''){return `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; ${ex}/>`;}
function T(x,y,t,c,s=13,a='start',w=600,it=false){return `<text x=&quot;${x}&quot; y=&quot;${y}&quot; fill=&quot;${c}&quot; font-size=&quot;${s}&quot; text-anchor=&quot;${a}&quot; font-weight=&quot;${w}&quot; ${it?'font-style=&quot;italic&quot; font-family=&quot;Georgia,serif&quot;':'font-family=&quot;PingFang SC,sans-serif&quot;'}>${t}</text>`;}
function svgOpen(w,h,label){return `<svg class=&quot;fig&quot; viewBox=&quot;0 0 ${w} ${h}&quot; role=&quot;img&quot; aria-label=&quot;${label}&quot;><defs>
  <marker id=&quot;ar&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;#192233&quot;/></marker></defs>`;}
function axesG(P,xlab,ylab){
  const Ey=P.py+P.ph,Ex=P.px+P.pw;let g='';
  for(let i=1;i<=4;i++){const gx=P.px+P.pw*i/5,gy=P.py+P.ph*i/5;g+=L(gx,P.py,gx,Ey,'var(--grid)',1);g+=L(P.px,gy,Ex,gy,'var(--grid)',1);}
  g+=L(P.px,Ey,Ex+12,Ey,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=`<line x1=&quot;${P.px}&quot; y1=&quot;${Ey}&quot; x2=&quot;${P.px}&quot; y2=&quot;${P.py-12}&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/>`;
  g+=T(P.px-7,P.py-13,ylab,_css('--ink'),15,'end',800,true);
  g+=T(Ex+16,Ey+5,xlab,_css('--ink'),15,'start',800,true);
  g+=T(P.px-9,Ey+16,'O',_css('--ink'),13,'end',700);
  return g;
}
function riskCalc(a,q1,q2,p){
  const U=q=>10*Math.pow(q/100,a);
  const EQ=p*q2+(1-p)*q1;
  const EU=p*U(q2)+(1-p)*U(q1);
  const UEQ=U(EQ);
  const CE=100*Math.pow(EU/10,1/a);
  return {U,EQ,EU,UEQ,CE,prem:EQ-CE};
}
function drawRisk(host,a,q1,q2,p,level){
  const P={px:50,py:22,pw:378,ph:300,xMin:0,xMax:100,yMin:0,yMax:10};
  const R=riskCalc(a,q1,q2,p);
  let g=svgOpen(450,372,'风险效用');g+=axesG(P,'q 财富/收益','U');
  // utility curve
  let pts=[];for(let i=0;i<=100;i++){const q=i;pts.push([mx(q,P),my(R.U(q),P)]);}
  let d='M'+pts[0][0]+' '+pts[0][1];for(let i=1;i<pts.length;i++)d+=' L'+pts[i][0]+' '+pts[i][1];
  g+=`<path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--util')}&quot; stroke-width=&quot;3&quot;/>`;
  g+=T(mx(95,P),my(R.U(95),P)-6,'U(q)',_css('--util'),13,'end',800,true);
  if(level>=1){ // two outcomes + chord
    const Aq=[mx(q1,P),my(R.U(q1),P)],Bq=[mx(q2,P),my(R.U(q2),P)];
    g+=L(Aq[0],Aq[1],Bq[0],Bq[1],_css('--chord'),2.4,'stroke-dasharray=&quot;6 4&quot;');
    g+=`<circle cx=&quot;${Aq[0]}&quot; cy=&quot;${Aq[1]}&quot; r=&quot;5&quot; fill=&quot;${_css('--util')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
    g+=`<circle cx=&quot;${Bq[0]}&quot; cy=&quot;${Bq[1]}&quot; r=&quot;5&quot; fill=&quot;${_css('--util')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
    g+=T(Aq[0]-4,Aq[1]+14,'U(q₁)',_css('--util'),11,'middle',700);
    g+=T(Bq[0],Bq[1]-9,'U(q₂)',_css('--util'),11,'middle',700);
    g+=T(mx(q1,P),P.py+P.ph+15,'q₁',_css('--ink'),11,'middle',700,true);
    g+=T(mx(q2,P),P.py+P.ph+15,'q₂',_css('--ink'),11,'middle',700,true);
  }
  if(level>=2){ // EQ vertical, UEQ on curve, EU on chord
    const ex=mx(R.EQ,P);
    g+=L(ex,my(0,P),ex,my(Math.max(R.UEQ,R.EU),P),_css('--eq'),1.4,'stroke-dasharray=&quot;4 3&quot;');
    g+=`<circle cx=&quot;${ex}&quot; cy=&quot;${my(R.UEQ,P)}&quot; r=&quot;6&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
    g+=`<circle cx=&quot;${ex}&quot; cy=&quot;${my(R.EU,P)}&quot; r=&quot;6&quot; fill=&quot;${_css('--chord')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
    g+=L(P.px,my(R.UEQ,P),ex,my(R.UEQ,P),_css('--eq'),1,'stroke-dasharray=&quot;3 3&quot; opacity=&quot;0.7&quot;');
    g+=L(P.px,my(R.EU,P),ex,my(R.EU,P),_css('--chord'),1,'stroke-dasharray=&quot;3 3&quot; opacity=&quot;0.7&quot;');
    g+=T(ex+8,my(R.UEQ,P)+(R.UEQ>=R.EU?-4:14),'U(EQ)',_css('--eq')==='#E0A21A'?'#9a6e00':_css('--eq'),11,'start',800);
    g+=T(ex+8,my(R.EU,P)+(R.UEQ>=R.EU?14:-4),'EU',_css('--chord'),11,'start',800);
    g+=T(ex,P.py+P.ph+15,'EQ',_css('--eq')==='#E0A21A'?'#9a6e00':_css('--eq'),11,'middle',800,true);
  }
  if(level>=3){ // CE + risk premium
    const cx=mx(R.CE,P);
    g+=L(cx,my(0,P),cx,my(R.EU,P),_css('--ce'),1.4,'stroke-dasharray=&quot;4 3&quot;');
    g+=`<circle cx=&quot;${cx}&quot; cy=&quot;${my(R.EU,P)}&quot; r=&quot;5&quot; fill=&quot;${_css('--ce')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
    g+=T(cx,P.py+P.ph+15,'CE',_css('--ce'),11,'middle',800,true);
    // premium bracket between CE and EQ on x axis
    const yb=P.py+P.ph+24;
    g+=L(Math.min(cx,mx(R.EQ,P)),yb,Math.max(cx,mx(R.EQ,P)),yb,_css('--prem'),3);
    g+=T((cx+mx(R.EQ,P))/2,yb-4,'风险溢价',_css('--prem'),10.5,'middle',700);
  }
  g+='</svg>';document.getElementById(host).innerHTML=g;
  return R;
}

/* ===== 第二节：推导剧场 ===== */
const DV={step:0};
const DSTEPS=[
 {tag:&quot;前提 · 效用曲线&quot;,title:&quot;财富的效用：凹意味着 MU 递减&quot;,
  body:`横轴财富 q,纵轴效用 U。<span class=&quot;key&quot;>边际效用递减</span> ⇒ 曲线<b>凹</b>(向下弯):钱越多,每元带来的快乐越少。`,
  deriv:[[&quot;U(q) = √q　(U′&amp;gt;0, U″&amp;lt;0)&quot;,&quot;凹函数:斜率越来越平&quot;]],level:0},
 {tag:&quot;第 1 步 · 赌局&quot;,title:&quot;两个结果与期望效用(弦)&quot;,
  body:`赌局:概率 p 得 q₂、否则得 q₁。把两点 <span class=&quot;math&quot;>(q₁,U(q₁))、(q₂,U(q₂))</span> 连成<b style=&quot;color:var(--chord)&quot;>弦</b>,弦上点的高度就是<b>期望效用 EU</b>。`,
  deriv:[[&quot;EU = p·U(q₂) + (1−p)·U(q₁)&quot;,&quot;加权平均 ⇒ 落在弦上&quot;]],level:1},
 {tag:&quot;第 2 步 · 两个度量&quot;,title:&quot;U(EQ) 在曲线上，EU 在弦上&quot;,
  body:`期望值 <span class=&quot;math&quot;>EQ=p·q₂+(1−p)·q₁</span>。在 EQ 处:曲线高度=<b style=&quot;color:var(--eq)&quot;>U(EQ)</b>,弦高度=<b style=&quot;color:var(--chord)&quot;>EU</b>。凹曲线下,<span class=&quot;key&quot;>曲线在弦上方</span> ⇒ U(EQ) &amp;gt; EU。`,
  deriv:[[&quot;U(EQ) &amp;gt; EU(Q)　⇒ 风险厌恶&quot;,&quot;确定的 EQ 比赌局更值&quot;]],level:2},
 {tag:&quot;第 3 步 · 风险溢价&quot;,title:&quot;确定性等值与风险溢价&quot;,
  body:`找一笔<b>确定</b>金额 <span class=&quot;math&quot;>CE</span>,使 <span class=&quot;math&quot;>U(CE)=EU</span>。<b style=&quot;color:var(--prem)&quot;>风险溢价=EQ−CE</b>:为把赌局换成确定结果,愿意放弃的钱(=愿付的保费上限)。`,
  deriv:[[&quot;U(CE) = EU ⇒ CE = 40&quot;,&quot;风险溢价 = 50 − 40 = 10&quot;]],level:3},
];
function buildDerive(){
  const st=DSTEPS[DV.step];
  const R=drawRisk('dHost',0.5,10,90,0.5,st.level);
  document.getElementById('dTag').textContent=`${st.tag}（第 ${DV.step+1}/${DSTEPS.length} 步）`;
  document.getElementById('dTitle').textContent=st.title;
  document.getElementById('dBody').innerHTML=st.body;
  document.getElementById('dDeriv').innerHTML=st.deriv.map(([f,s])=>`<div class=&quot;deriv&quot;>${f}${s?`<small>${s}</small>`:''}</div>`).join('');
  document.getElementById('dPrev').disabled=DV.step===0;document.getElementById('dNext').disabled=DV.step===DSTEPS.length-1;
  document.getElementById('dDots').innerHTML=DSTEPS.map((_,i)=>`<i class=&quot;${i===DV.step?'on':''}&quot; data-i=&quot;${i}&quot;></i>`).join('');
  document.querySelectorAll('#dDots i').forEach(d=>d.onclick=()=>{DV.step=+d.dataset.i;buildDerive();});
}
document.getElementById('dNext').onclick=()=>{if(DV.step<DSTEPS.length-1){DV.step++;buildDerive();}};
document.getElementById('dPrev').onclick=()=>{if(DV.step>0){DV.step--;buildDerive();}};

/* ===== 第三节：实验室 ===== */
const LB={a:0.5,p:0.5,q1:10,q2:90};
function buildLab(){
  const R=drawRisk('labHost',LB.a,LB.q1,LB.q2,LB.p,3);
  document.getElementById('vA').textContent=' = '+LB.a.toFixed(2);
  document.getElementById('vP').textContent=' = '+LB.p.toFixed(2);
  document.getElementById('vQ1').textContent=' = '+LB.q1;
  document.getElementById('vQ2').textContent=' = '+LB.q2;
  document.getElementById('oEQ').textContent=R.EQ.toFixed(1);
  document.getElementById('oEU').textContent=R.EU.toFixed(2);
  document.getElementById('oUEQ').textContent=R.UEQ.toFixed(2);
  document.getElementById('oCE').textContent=R.CE.toFixed(1);
  document.getElementById('oPrem').textContent=(R.prem>=0?'+':'')+R.prem.toFixed(1);
  const bd=document.getElementById('labBadge'),it=document.getElementById('labInterp');
  const diff=R.UEQ-R.EU;
  if(Math.abs(LB.a-1)<0.04||Math.abs(diff)<0.03){bd.className='badge bdg-n';bd.textContent='风险中性 · U(EQ) = EU';it.innerHTML='效用线性,只看期望值,风险溢价为 0。';}
  else if(LB.a<1){bd.className='badge bdg-a';bd.textContent='风险厌恶 · U(EQ) > EU';it.innerHTML=`效用凹、MU 递减:确定的 ${R.EQ.toFixed(0)} 比赌局更值。愿付最多 <b>${R.prem.toFixed(1)}</b> 的风险溢价把不确定换成确定(=买保险)。`;}
  else{bd.className='badge bdg-l';bd.textContent='风险喜好 · U(EQ) < EU';it.innerHTML=`效用凸、MU 递增:赌局比确定结果更诱人。CE 高于 EQ,风险溢价为<b>负</b>(${R.prem.toFixed(1)}),愿为&quot;搏一把&quot;付费。`;}
}

/* ===== 事件 ===== */
document.getElementById('rA').addEventListener('input',e=>{LB.a=+e.target.value;buildLab();});
document.getElementById('rP').addEventListener('input',e=>{LB.p=+e.target.value;buildLab();});
document.getElementById('rQ1').addEventListener('input',e=>{LB.q1=+e.target.value;buildLab();});
document.getElementById('rQ2').addEventListener('input',e=>{LB.q2=+e.target.value;buildLab();});
document.getElementById('rA').value=LB.a;document.getElementById('rP').value=LB.p;document.getElementById('rQ1').value=LB.q1;document.getElementById('rQ2').value=LB.q2;
buildDerive();buildLab();
</script>

"></iframe></div><div class="panel" data-i="7"><iframe loading="lazy" title="④ 产出曲线" sandbox="allow-scripts" srcdoc="<!DOCTYPE html>

  <h1>推导 <em>产出曲线图</em><br>TP、AP、MP 与生产三阶段</h1>
  <p class=&quot;lead&quot;>固定其他要素,只增加劳动 <span class=&quot;math&quot;>L</span>:<b style=&quot;color:var(--tp)&quot;>总产量 TP</b> 先快后慢再下降,<b style=&quot;color:var(--mp)&quot;>边际产量 MP</b> 先升后降(边际报酬递减),<b style=&quot;color:var(--ap)&quot;>平均产量 AP</b> 也先升后降。三条线的几何关系把生产切成三阶段,中间那段 <span class=&quot;math&quot;>(L₁, L₂)</span> 才是<b>合理投入区间</b>。</p>

    <path d=&quot;M28 145 Q70 95 110 100 Q160 108 200 145&quot; fill=&quot;none&quot; stroke=&quot;#1F9E5A&quot; stroke-width=&quot;2.4&quot;/>

  <p class=&quot;sub&quot;>横轴是可变要素投入 <span class=&quot;math&quot;>L</span>(劳动),纵轴是产量。把 TP / AP / MP 三个量及其几何含义认全。</p>

  <p class=&quot;sub&quot;>点下一步。用经典生产函数 <span class=&quot;math&quot;>TP = 12L² − L³</span>(S 形)。关键几何:<b>MP = TP 切线斜率</b>,<b>AP = 原点到 TP 点连线的斜率</b>。</p>

<section id=&quot;lab&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>03</span><h2>三阶段实验室</h2></div>
  <p class=&quot;sub&quot;>拖动劳动投入 <span class=&quot;math&quot;>L</span>,看上图 TP 上的切线(MP)与原点连线(AP)如何变化,下图 MP、AP 随之移动,并实时判定落在<b>哪个生产阶段</b>。临界点:<span class=&quot;math&quot;>L₀=4</span>(MP 最大)、<span class=&quot;math&quot;>L₁=6</span>(AP 最大=MP)、<span class=&quot;math&quot;>L₂=8</span>(MP=0,TP 最大)。</p>
  <div class=&quot;legend&quot;>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--tp)&quot;></i>TP 总产量</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--mp)&quot;></i>MP 边际产量</span>

  </div>

        <div class=&quot;readout&quot;>
          <div class=&quot;ro tp&quot;><div class=&quot;k&quot;>TP=12L²−L³</div><div class=&quot;val&quot; id=&quot;oTP&quot;></div></div>
          <div class=&quot;ro mp&quot;><div class=&quot;k&quot;>MP=24L−3L²</div><div class=&quot;val&quot; id=&quot;oMP&quot;></div></div>
          <div class=&quot;ro ap&quot;><div class=&quot;k&quot;>AP=12L−L²</div><div class=&quot;val&quot; id=&quot;oAP&quot;></div></div>
        </div>

      <table class=&quot;tbl&quot;>
        <tr><th>阶段</th><th>范围</th><th>MP vs AP</th><th>判断</th></tr>
        <tr><td class=&quot;l&quot;>Ⅰ</td><td>0 ~ L₁</td><td>MP&amp;gt;AP, AP↑</td><td>投入不足</td></tr>
        <tr><td class=&quot;l&quot; style=&quot;color:var(--ap)&quot;>Ⅱ ✓</td><td>L₁ ~ L₂</td><td>MP&amp;lt;AP 但&amp;gt;0</td><td><b>合理区间</b></td></tr>
        <tr><td class=&quot;l&quot;>Ⅲ</td><td>L₂ 之后</td><td>MP&amp;lt;0, TP↓</td><td>投入过度</td></tr>

<!-- 4 MAP -->
<section id=&quot;map&quot; style=&quot;border-bottom:none&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>04</span><h2>关系全景 · 计算例（练习5）</h2></div>
  <div class=&quot;duo&quot;>
    <div class=&quot;panel&quot;>
      <h3>四条几何关系（必记）</h3>
      <p>· <b>MP = TP 的斜率</b>:TP 升 ⇒ MP&amp;gt;0;TP 峰 ⇒ MP=0;TP 降 ⇒ MP&amp;lt;0。</p>
      <p>· <b>AP = 原点连线斜率</b>:连线最陡(相切)处 AP 最大。</p>
      <p>· <b>MP 与 AP:</b> MP&amp;gt;AP 拉着 AP 上升;MP&amp;lt;AP 拖着 AP 下降;<b>MP=AP 时 AP 最大</b>。</p>
      <p>· <b>MP 先升后降</b>:拐点 L₀ 之后进入<b>边际报酬递减</b>。</p>
      <div class=&quot;note&quot;><b>合理投入区间＝阶段Ⅱ＝(L₁, L₂)</b>:从 AP 最大(=MP)到 MP=0。此区间 MP、AP 虽都在降,但 MP&amp;gt;0 仍能增产,且已过了 AP 上升的&quot;浪费&quot;区。</div>
    </div>
    <div class=&quot;panel&quot;>
      <h3>计算例：Q = 10L − L²</h3>
      <p><b>(1) 合理投入区间</b></p>
      <p class=&quot;deriv-eq&quot; style=&quot;font-size:14px&quot;>AP = Q/L = 10 − L；MP = dQ/dL = 10 − 2L</p>
      <p>边界:AP 最大(AP=MP)与 MP=0。MP=0 ⇒ <b>L=5</b>;此函数 AP 从 L=0 起就递减,故区间为 <b>(0, 5)</b>。</p>
      <p style=&quot;margin-top:10px&quot;><b>(2) 最优雇佣量</b>（P=5, W=10）</p>
      <p class=&quot;deriv-eq&quot; style=&quot;font-size:14px&quot;>VMP = MP·P = (10−2L)·5 = W = 10</p>
      <p>⇒ 50 − 10L = 10 ⇒ <b>L* = 4</b>(落在合理区间内 ✓)。</p>
      <div class=&quot;note&quot;>下一步把<b>价值边际产品 VMP=MP·P</b> 与工资 W 比较,就进入第⑨张<b>要素投入均衡图</b>——最优雇佣量由 VMP=W 决定。</div>
    </div>
  </div>
</div></section>

<script>
/* ===== 词典 ===== */
const GLOSS=[
 [&quot;TP&quot;,&quot;总产量&quot;,&quot;Total product&quot;,&quot;一定可变要素下的总产出。先以递增速度增、过拐点后递减速度增、达峰后下降。&quot;,&quot;p-q&quot;],
 [&quot;AP&quot;,&quot;平均产量&quot;,&quot;Average product&quot;,&quot;AP=TP/L=每单位劳动的平均产出。几何上＝原点到 TP 点连线的斜率。&quot;,&quot;p-a&quot;],
 [&quot;MP&quot;,&quot;边际产量&quot;,&quot;Marginal product&quot;,&quot;MP=dTP/dL=多 1 单位劳动增加的产出。几何上＝TP 切线的斜率。&quot;,&quot;p-m&quot;],
 [&quot;L&quot;,&quot;可变要素(劳动)&quot;,&quot;Variable input / Labor&quot;,&quot;短期内唯一可调的要素;其他要素(资本)固定。&quot;,&quot;p-q&quot;],
 [&quot;边际报酬递减&quot;,&quot;diminishing returns&quot;,&quot;Law of diminishing marginal returns&quot;,&quot;其他要素固定时,可变要素增加到一定程度后,MP 开始<b>递减</b>。&quot;,&quot;p-m&quot;],
 [&quot;L₀&quot;,&quot;MP 最大点&quot;,&quot;Inflection of TP&quot;,&quot;TP 拐点;此后边际报酬递减开始。&quot;,&quot;p-m&quot;],
 [&quot;L₁&quot;,&quot;AP 最大点&quot;,&quot;AP maximum&quot;,&quot;MP=AP 之处,AP 达最大;阶段Ⅰ与Ⅱ的分界。&quot;,&quot;p-a&quot;],
 [&quot;L₂&quot;,&quot;TP 最大点&quot;,&quot;TP maximum&quot;,&quot;MP=0 之处,TP 达最大;阶段Ⅱ与Ⅲ的分界。&quot;,&quot;p-q&quot;],
 [&quot;生产三阶段&quot;,&quot;three stages&quot;,&quot;Three stages of production&quot;,&quot;Ⅰ(投入不足)、Ⅱ(合理)、Ⅲ(投入过度)。&quot;,&quot;p-s&quot;],
 [&quot;合理投入区间&quot;,&quot;rational range&quot;,&quot;Rational input range&quot;,&quot;阶段Ⅱ=(L₁, L₂):从 AP 最大到 MP=0。&quot;,&quot;p-s&quot;],
 [&quot;生产函数&quot;,&quot;production function&quot;,&quot;Production function&quot;,&quot;Q=f(L,K),投入与最大产出的对应关系。&quot;,&quot;p-q&quot;],
];
(function(){const g=document.getElementById('glossGrid');
 GLOSS.forEach(([s,cn,en,d,p])=>{const e=document.createElement('div');e.className='card';
  const col=p==='p-q'?'var(--tp)':p==='p-m'?'var(--mp)':p==='p-a'?'var(--ap)':'var(--violet)';
  e.innerHTML=`<span class=&quot;sym&quot; style=&quot;color:${col}&quot;>${s}</span><span class=&quot;cn&quot;>${cn}</span><div class=&quot;en&quot;>${en}</div><div class=&quot;desc&quot;>${d}</div><span class=&quot;pill ${p}&quot;>${p==='p-q'?'产量/投入':p==='p-m'?'边际':p==='p-a'?'平均':'阶段划分'}</span>`;
  g.appendChild(e);});})();

/* ===== 生产函数 ===== */
function TP(L){return 12*L*L - L*L*L;}
function MP(L){return 24*L - 3*L*L;}
function AP(L){return L>0?(12*L - L*L):0;}
const L0=4,L1=6,L2=8;

/* ===== 绘图基元 ===== */
function _css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function mx(v,P){return P.px+(v-P.xMin)/(P.xMax-P.xMin)*P.pw;}
function my(v,P){return P.py+P.ph-(v-P.yMin)/(P.yMax-P.yMin)*P.ph;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function L_(x1,y1,x2,y2,c,w,ex=''){return `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; ${ex}/>`;}
function T(x,y,t,c,s=13,a='start',w=600,it=false){return `<text x=&quot;${x}&quot; y=&quot;${y}&quot; fill=&quot;${c}&quot; font-size=&quot;${s}&quot; text-anchor=&quot;${a}&quot; font-weight=&quot;${w}&quot; ${it?'font-style=&quot;italic&quot; font-family=&quot;Georgia,serif&quot;':'font-family=&quot;PingFang SC,sans-serif&quot;'}>${t}</text>`;}
function curve(fn,P,lo,hi,c,w,op=1){let pts=[];for(let i=0;i<=120;i++){const x=lo+(hi-lo)*i/120;const y=fn(x);if(y>=P.yMin&amp;&amp;y<=P.yMax)pts.push([mx(x,P),my(y,P)]);}if(pts.length<2)return '';let d='M'+pts[0][0]+' '+pts[0][1];for(let i=1;i<pts.length;i++)d+=' L'+pts[i][0]+' '+pts[i][1];return `<path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; opacity=&quot;${op}&quot;/>`;}

function drawProd(host,Lcur,opts){
  // top panel TP, bottom panel MP/AP, shared L axis
  const PT={px:54,py:18,pw:384,ph:188,xMin:0,xMax:10,yMin:0,yMax:280};
  const PB={px:54,py:250,pw:384,ph:170,xMin:0,xMax:10,yMin:-70,yMax:55};
  let g=`<svg class=&quot;fig&quot; viewBox=&quot;0 0 470 440&quot; role=&quot;img&quot; aria-label=&quot;产出曲线&quot;><defs>
    <marker id=&quot;ar&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;#192233&quot;/></marker></defs>`;
  // stage shading across both panels
  if(opts.stages){
    const bands=[[0,L1,'rgba(138,147,163,0.10)'],[L1,L2,'rgba(31,158,90,0.13)'],[L2,10,'rgba(179,18,58,0.08)']];
    bands.forEach(([x0,x1,col])=>{g+=`<rect x=&quot;${mx(x0,PT)}&quot; y=&quot;${PT.py}&quot; width=&quot;${mx(x1,PT)-mx(x0,PT)}&quot; height=&quot;${PT.py+PT.ph-PT.py+ (PB.py-PT.py-PT.ph) +PB.ph}&quot; fill=&quot;${col}&quot;/>`;});
    g+=T((mx(0,PT)+mx(L1,PT))/2,PT.py+12,'Ⅰ',_css('--ink-faint'),14,'middle',800);
    g+=T((mx(L1,PT)+mx(L2,PT))/2,PT.py+12,'Ⅱ',_css('--ap'),14,'middle',800);
    g+=T((mx(L2,PT)+mx(10,PT))/2,PT.py+12,'Ⅲ',_css('--mp'),14,'middle',800);
  }
  // ---- TOP panel axes ----
  for(let i=1;i<=3;i++){const gy=PT.py+PT.ph*i/4;g+=L_(PT.px,gy,PT.px+PT.pw,gy,'var(--grid)',1);}
  g+=L_(PT.px,PT.py+PT.ph,PT.px+PT.pw+10,PT.py+PT.ph,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=`<line x1=&quot;${PT.px}&quot; y1=&quot;${PT.py+PT.ph}&quot; x2=&quot;${PT.px}&quot; y2=&quot;${PT.py-10}&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/>`;
  g+=T(PT.px-6,PT.py-12,'产量',_css('--ink'),12,'end',700);
  // TP curve
  g+=curve(TP,PT,0,10,_css('--tp'),3);
  g+=T(mx(8.2,PT),my(TP(8.2),PT)-8,'TP',_css('--tp'),14,'middle',800,true);
  // tangent (MP) &amp; ray (AP) at Lcur on TP
  if(opts.tangent){
    const y0=TP(Lcur),s=MP(Lcur);
    const xa=Math.max(0,Lcur-2.4),xb=Math.min(10,Lcur+2.4);
    g+=L_(mx(xa,PT),my(y0+s*(xa-Lcur),PT),mx(xb,PT),my(clamp(y0+s*(xb-Lcur),PT.yMin,PT.yMax),PT),_css('--mp'),2,'stroke-dasharray=&quot;5 4&quot;');
  }
  if(opts.ray){
    const y0=TP(Lcur);
    const xe=Math.min(10,(PT.yMax/ (y0/Lcur)));
    g+=L_(mx(0,PT),my(0,PT),mx(Math.min(10,xe),PT),my(Math.min(PT.yMax,(y0/Lcur)*Math.min(10,xe)),PT),_css('--ap'),2,'stroke-dasharray=&quot;2 3&quot;');
  }
  // marker on TP
  if(opts.marker){
    const mxL=mx(Lcur,PT);
    g+=L_(mxL,PT.py,mxL,PB.py+PB.ph,_css('--marker'),1.5,'stroke-dasharray=&quot;4 3&quot;');
    g+=`<circle cx=&quot;${mxL}&quot; cy=&quot;${my(clamp(TP(Lcur),0,280),PT)}&quot; r=&quot;6&quot; fill=&quot;${_css('--marker')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
  }
  // ---- BOTTOM panel axes ----
  g+=L_(PB.px,PB.py+PB.ph,PB.px+PB.pw+10,PB.py+PB.ph,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=`<line x1=&quot;${PB.px}&quot; y1=&quot;${PB.py+PB.ph}&quot; x2=&quot;${PB.px}&quot; y2=&quot;${PB.py-10}&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/>`;
  // zero line (MP=0)
  g+=L_(PB.px,my(0,PB),PB.px+PB.pw,my(0,PB),'#192233',1.2,'stroke-dasharray=&quot;2 3&quot; opacity=&quot;0.6&quot;');
  g+=T(PB.px+PB.pw+14,PB.py+PB.ph+5,'L',_css('--ink'),14,'start',800,true);
  g+=T(PB.px-6,PB.py-12,'AP,MP',_css('--ink'),12,'end',700);
  g+=T(PB.px-9,PB.py+PB.ph+15,'O',_css('--ink'),12,'end',700);
  if(opts.mp){g+=curve(MP,PB,0,10,_css('--mp'),2.8);g+=T(mx(2,PB),my(MP(2),PB)-7,'MP',_css('--mp'),13,'middle',800,true);}
  if(opts.ap){g+=curve(AP,PB,0.1,10,_css('--ap'),2.8);g+=T(mx(3,PB),my(AP(3),PB)+13,'AP',_css('--ap'),13,'middle',800,true);}
  // critical lines
  if(opts.crit){
    [[L0,'L₀',_css('--mp')],[L1,'L₁',_css('--ap')],[L2,'L₂',_css('--tp')]].forEach(([x,lab,c])=>{
      g+=L_(mx(x,PB),PB.py,mx(x,PB),PB.py+PB.ph,c,1.2,'stroke-dasharray=&quot;4 3&quot; opacity=&quot;0.7&quot;');
      g+=T(mx(x,PB),PB.py+PB.ph+15,lab,c,11,'middle',800,true);});
  }
  // bottom marker
  if(opts.marker){const mxL=mx(Lcur,PB);
    if(opts.mp)g+=`<circle cx=&quot;${mxL}&quot; cy=&quot;${my(clamp(MP(Lcur),-70,55),PB)}&quot; r=&quot;5&quot; fill=&quot;${_css('--mp')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
    if(opts.ap)g+=`<circle cx=&quot;${mxL}&quot; cy=&quot;${my(clamp(AP(Lcur),-70,55),PB)}&quot; r=&quot;5&quot; fill=&quot;${_css('--ap')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
    g+=T(mxL,PB.py+PB.ph+15,'L',_css('--marker'),0,'middle',700);
  }
  g+='</svg>';document.getElementById(host).innerHTML=g;
}

/* ===== 第二节：推导剧场 ===== */
const DV={step:0};
const DSTEPS=[
 {tag:&quot;前提 · 总产量&quot;,title:&quot;TP 的 S 形曲线&quot;,
  body:`其他要素固定,只增劳动 L。TP 先以<b>递增</b>速度上升(分工协作),过拐点后以<b>递减</b>速度上升,达峰后<b>下降</b>(人浮于事)。`,
  deriv:[[&quot;TP = 12L² − L³&quot;,&quot;先快后慢再跌的 S 形&quot;]],opts:{}},
 {tag:&quot;第 1 步 · MP=切线斜率&quot;,title:&quot;边际产量＝TP 的斜率&quot;,
  body:`<span class=&quot;key&quot;>MP = TP 切线的斜率</span>。TP 越陡 MP 越大;拐点 L₀ 处最陡 ⇒ MP 最大,此后<b>边际报酬递减</b>;TP 达峰时切线水平 ⇒ MP=0。`,
  deriv:[[&quot;MP = dTP/dL = 24L − 3L²&quot;,&quot;L₀=4 时 MP 最大；L₂=8 时 MP=0&quot;]],opts:{tangent:1,mp:1}},
 {tag:&quot;第 2 步 · AP=连线斜率&quot;,title:&quot;平均产量＝原点连线斜率&quot;,
  body:`<span class=&quot;key&quot;>AP = 原点到 TP 点连线的斜率</span>。当这条连线恰好与 TP <b>相切</b>(L₁)时最陡 ⇒ AP 最大,此时连线与切线重合 ⇒ <b>MP=AP</b>。`,
  deriv:[[&quot;AP = TP/L = 12L − L²&quot;,&quot;L₁=6 时 AP 最大 = MP&quot;]],opts:{tangent:1,ray:1,mp:1,ap:1}},
 {tag:&quot;第 3 步 · 三阶段&quot;,title:&quot;切成三段，中间最合理&quot;,
  body:`Ⅰ:0~L₁,MP&amp;gt;AP、AP 升(投入不足);<b style=&quot;color:var(--ap)&quot;>Ⅱ:L₁~L₂,MP&amp;lt;AP 但 MP&amp;gt;0(合理区间)</b>;Ⅲ:L₂ 后,MP&amp;lt;0、TP 降(投入过度)。`,
  deriv:[[&quot;合理投入区间 = (L₁, L₂) = (6, 8)&quot;,&quot;从 AP 最大到 MP=0&quot;]],opts:{tangent:1,ray:1,mp:1,ap:1,crit:1,stages:1}},
];
function buildDerive(){
  const st=DSTEPS[DV.step];
  drawProd('dHost',5,Object.assign({},st.opts));
  document.getElementById('dTag').textContent=`${st.tag}（第 ${DV.step+1}/${DSTEPS.length} 步）`;
  document.getElementById('dTitle').textContent=st.title;
  document.getElementById('dBody').innerHTML=st.body;
  document.getElementById('dDeriv').innerHTML=st.deriv.map(([f,s])=>`<div class=&quot;deriv&quot;>${f}${s?`<small>${s}</small>`:''}</div>`).join('');
  document.getElementById('dPrev').disabled=DV.step===0;document.getElementById('dNext').disabled=DV.step===DSTEPS.length-1;
  document.getElementById('dDots').innerHTML=DSTEPS.map((_,i)=>`<i class=&quot;${i===DV.step?'on':''}&quot; data-i=&quot;${i}&quot;></i>`).join('');
  document.querySelectorAll('#dDots i').forEach(d=>d.onclick=()=>{DV.step=+d.dataset.i;buildDerive();});
}
document.getElementById('dNext').onclick=()=>{if(DV.step<DSTEPS.length-1){DV.step++;buildDerive();}};
document.getElementById('dPrev').onclick=()=>{if(DV.step>0){DV.step--;buildDerive();}};

/* ===== 第三节：实验室 ===== */
const LB={L:5};
function buildLab(){
  drawProd('labHost',LB.L,{tangent:1,ray:1,mp:1,ap:1,crit:1,stages:1,marker:1});
  document.getElementById('vL').textContent=' = '+LB.L.toFixed(1);
  document.getElementById('oTP').textContent=TP(LB.L).toFixed(1);
  document.getElementById('oMP').textContent=MP(LB.L).toFixed(1);
  document.getElementById('oAP').textContent=AP(LB.L).toFixed(1);
  const bd=document.getElementById('labBadge'),it=document.getElementById('labInterp');
  const L=LB.L;
  if(L<L1){bd.className='badge bdg-1';bd.textContent='阶段 Ⅰ · 投入不足';
    it.innerHTML=L<L0?'MP 仍在<b>上升</b>(报酬递增),且 MP&amp;gt;AP 拉动 AP 上升 —— 继续增雇有利。':'MP 已过峰开始<b>递减</b>,但仍 MP&amp;gt;AP,AP 继续上升 —— 尚未到最有效率处。';}
  else if(L<L2){bd.className='badge bdg-2';bd.textContent='阶段 Ⅱ · 合理区间 ✓';
    it.innerHTML='MP&amp;lt;AP(AP 已在下降),但 <b>MP&amp;gt;0</b> 仍能增产 —— 理性厂商应在<b>此区间</b>选投入,具体点由要素价格(VMP=W)定。';}
  else{bd.className='badge bdg-3';bd.textContent='阶段 Ⅲ · 投入过度';
    it.innerHTML='<b>MP&amp;lt;0</b>,多雇反而使 TP <b>下降</b> —— 任何理性厂商都不会停留在此。';}
}

/* ===== 事件 ===== */
document.getElementById('rL').addEventListener('input',e=>{LB.L=+e.target.value;buildLab();});
document.getElementById('rL').value=LB.L;
buildDerive();buildLab();
</script>

  <p class=&quot;lead&quot;>同样的产量,可以多用<b>劳动 L</b>少用<b>资本 K</b>,也可以反过来——可行组合是一条<b style=&quot;color:var(--iso)&quot;>等产量线</b>;花同样的钱能买到的组合是一条<b style=&quot;color:var(--cost)&quot;>等成本线</b>。两者<b>相切</b>处即最优:<span class=&quot;math&quot;>MRTS = w/r</span>。要素价格一变,切点就沿等产量线滑动,这就是&quot;机器人替代木工&quot;的经济学。</p>

<section id=&quot;map&quot; style=&quot;border-bottom:none&quot;><div class=&quot;wrap&quot;>

  <div class=&quot;duo&quot;>
    <div class=&quot;panel&quot;>
      <h3>简答5：机器人替代木工</h3>
      <p>木工工资 <b>w↑</b>、机器人租金 <b>r↓</b> ⇒ 相对价格 <span class=&quot;math&quot;>w/r</span> 上升 ⇒ 等成本线<b>变陡</b>。</p>
      <p>为维持原产量,沿等产量线向<b>资本密集</b>方向移动(用 K 替代 L),新切点满足 <span class=&quot;math&quot;>MRTS=w/r</span>。结果:机器人↑、木工↓。这是企业在要素价格变动下追求<b>成本最小化</b>的理性反应。</p>
      <div class=&quot;note&quot;><b>简答6：技术相同、组合不同。</b>A 店(市中心,空间/资本贵)→ 劳动密集;B 店(郊区,资本便宜)→ 资本密集。同一条等产量线,因 w/r 不同,切点不同。</div>
    </div>
    <div class=&quot;panel&quot;>
      <h3>关系全景</h3>
      <p>· <b>与消费者均衡同构:</b>等产量线↔无差异曲线,等成本线↔预算线,<span class=&quot;math&quot;>MRTS=w/r</span> ↔ <span class=&quot;math&quot;>MRS=P₁/P₂</span>。</p>
      <p>· <b>扩展线(expansion path):</b>价格不变、产量变 → 一串切点连成扩展线。</p>
      <p>· <b>通向成本曲线(第⑥张):</b>对每个产量求出最小成本 <span class=&quot;math&quot;>C*(Q)</span>,就得到<b>总成本曲线</b>——这正是成本曲线的来源。</p>
      <div class=&quot;note&quot;>本例 <span class=&quot;math&quot;>Q=√(LK)</span> 下,最优时 <span class=&quot;math&quot;>wL*=rK*</span>(两要素支出相等),且 <span class=&quot;math&quot;>C*=2Q₀√(wr)</span>。</div>
    </div>
  </div>

<script>
/* ===== 词典 ===== */
const GLOSS=[
 [&quot;Q 等产量线&quot;,&quot;isoquant&quot;,&quot;Isoquant&quot;,&quot;产出相同的所有 (L,K) 组合连线,<b>凸向原点</b>。越远离原点产量越高。&quot;,&quot;p-iso&quot;],
 [&quot;等成本线&quot;,&quot;isocost&quot;,&quot;Isocost line&quot;,&quot;C=wL+rK,花费相同的所有 (L,K) 组合,<b>直线</b>,斜率 −w/r。&quot;,&quot;p-cost&quot;],
 [&quot;MRTS&quot;,&quot;边际技术替代率&quot;,&quot;Marginal rate of technical substitution&quot;,&quot;保持产量不变,多 1 单位 L 可替代的 K。MRTS=MP_L/MP_K=等产量线斜率绝对值,<b>递减</b>。&quot;,&quot;p-iso&quot;],
 [&quot;MP_L / MP_K&quot;,&quot;边际产量&quot;,&quot;Marginal product of L / K&quot;,&quot;各要素多 1 单位带来的产出增量。&quot;,&quot;p-iso&quot;],
 [&quot;w&quot;,&quot;工资&quot;,&quot;Wage&quot;,&quot;劳动 L 的价格。&quot;,&quot;p-cost&quot;],
 [&quot;r&quot;,&quot;资本租金&quot;,&quot;Rental rate of capital&quot;,&quot;资本 K 的价格(使用成本)。&quot;,&quot;p-cost&quot;],
 [&quot;L / K&quot;,&quot;劳动 / 资本&quot;,&quot;Labor / Capital&quot;,&quot;两种生产要素。&quot;,&quot;p-fac&quot;],
 [&quot;E&quot;,&quot;最优要素组合&quot;,&quot;Optimal factor combination&quot;,&quot;等产量线与等成本线<b>相切</b>之点,成本最小(或产量最大)。&quot;,&quot;p-eq&quot;],
 [&quot;最优条件&quot;,&quot;MRTS=w/r&quot;,&quot;Tangency condition&quot;,&quot;MRTS=w/r ⇔ MP_L/w=MP_K/r:每元钱买任何要素带来的边际产量相等。&quot;,&quot;p-eq&quot;],
 [&quot;扩展线&quot;,&quot;expansion path&quot;,&quot;Expansion path&quot;,&quot;要素价格不变、产量变动时,一串最优组合的连线。&quot;,&quot;p-fac&quot;],
 [&quot;要素密集度&quot;,&quot;factor intensity&quot;,&quot;Factor intensity&quot;,&quot;劳动密集 vs 资本密集,由 w/r 决定。&quot;,&quot;p-fac&quot;],
];
(function(){const g=document.getElementById('glossGrid');
 GLOSS.forEach(([s,cn,en,d,p])=>{const e=document.createElement('div');e.className='card';
  const col=p==='p-iso'?'var(--iso)':p==='p-cost'?'var(--cost)':p==='p-eq'?'#9a6e00':'var(--violet)';
  e.innerHTML=`<span class=&quot;sym&quot; style=&quot;color:${col}&quot;>${s}</span><span class=&quot;cn&quot;>${cn}</span><div class=&quot;en&quot;>${en}</div><div class=&quot;desc&quot;>${d}</div><span class=&quot;pill ${p}&quot;>${p==='p-iso'?'等产量/技术':p==='p-cost'?'等成本/价格':p==='p-eq'?'最优':'要素'}</span>`;
  g.appendChild(e);});})();

/* ===== 计算 ===== */
function opt(Q0,w,r){const L=Q0*Math.sqrt(r/w),K=Q0*Math.sqrt(w/r);return {L,K,C:w*L+r*K,MRTS:K/L};}

/* ===== 绘图基元 ===== */
function _css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function mx(v,P){return P.px+(v-P.xMin)/(P.xMax-P.xMin)*P.pw;}
function my(v,P){return P.py+P.ph-(v-P.yMin)/(P.yMax-P.yMin)*P.ph;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function L_(x1,y1,x2,y2,c,w,ex=''){return `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; ${ex}/>`;}
function T(x,y,t,c,s=13,a='start',w=600,it=false){return `<text x=&quot;${x}&quot; y=&quot;${y}&quot; fill=&quot;${c}&quot; font-size=&quot;${s}&quot; text-anchor=&quot;${a}&quot; font-weight=&quot;${w}&quot; ${it?'font-style=&quot;italic&quot; font-family=&quot;Georgia,serif&quot;':'font-family=&quot;PingFang SC,sans-serif&quot;'}>${t}</text>`;}
function svgOpen(w,h,label){return `<svg class=&quot;fig&quot; viewBox=&quot;0 0 ${w} ${h}&quot; role=&quot;img&quot; aria-label=&quot;${label}&quot;><defs>
  <marker id=&quot;ar&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;#192233&quot;/></marker></defs>`;}
function axesG(P,xlab,ylab){
  const Ey=P.py+P.ph,Ex=P.px+P.pw;let g='';
  for(let i=1;i<=4;i++){const gx=P.px+P.pw*i/5,gy=P.py+P.ph*i/5;g+=L_(gx,P.py,gx,Ey,'var(--grid)',1);g+=L_(P.px,gy,Ex,gy,'var(--grid)',1);}
  g+=L_(P.px,Ey,Ex+12,Ey,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=`<line x1=&quot;${P.px}&quot; y1=&quot;${Ey}&quot; x2=&quot;${P.px}&quot; y2=&quot;${P.py-12}&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/>`;
  g+=T(P.px-7,P.py-13,ylab,_css('--ink'),15,'end',800,true);
  g+=T(Ex+16,Ey+5,xlab,_css('--ink'),15,'start',800,true);
  g+=T(P.px-9,Ey+16,'O',_css('--ink'),13,'end',700);
  return g;
}
function isoPath(Q0,P){let pts=[];for(let i=0;i<=120;i++){const Lx=P.xMin+(P.xMax-P.xMin)*i/120;if(Lx<=0.3)continue;const K=Q0*Q0/Lx;if(K>=P.yMin&amp;&amp;K<=P.yMax)pts.push([mx(Lx,P),my(K,P)]);}if(pts.length<2)return '';let d='M'+pts[0][0]+' '+pts[0][1];for(let i=1;i<pts.length;i++)d+=' L'+pts[i][0]+' '+pts[i][1];return d;}

function drawFactor(host,w,r,Q0,opts){
  const P={px:52,py:22,pw:382,ph:330,xMin:0,xMax:30,yMin:0,yMax:30};
  const o=opt(Q0,w,r);
  let g=svgOpen(460,388,'要素组合');g+=axesG(P,'L 劳动','K 资本');
  // faded other isoquants
  if(opts.isoMulti){[Q0-3,Q0+3].forEach(q=>{if(q>0)g+=`<path d=&quot;${isoPath(q,P)}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--iso')}&quot; stroke-width=&quot;1.6&quot; opacity=&quot;0.3&quot;/>`;});}
  // main isoquant
  g+=`<path d=&quot;${isoPath(Q0,P)}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--iso')}&quot; stroke-width=&quot;3&quot;/>`;
  g+=T(mx(Q0*Q0/26,P)+4,my(26,P),'Q₀='+Q0,_css('--iso'),12,'start',800,true);
  // isocost through E: C=wL+rK -> K=(C-wL)/r ; clip to visible box along the TRUE line
  if(opts.cost){
    const C=o.C;
    const Lstart=Math.max(0,(C-P.yMax*r)/w), Lend=Math.min(P.xMax,C/w);
    const Ks=(C-w*Lstart)/r, Ke=(C-w*Lend)/r;
    g+=L_(mx(Lstart,P),my(Ks,P),mx(Lend,P),my(Ke,P),_css('--cost'),3);
    g+=T(mx(Lend,P),my(Ke,P)+14,'等成本',_css('--cost'),12,'end',800);
  }
  // tangent indicator (slope of isoquant at E) when only mrts
  if(opts.mrts&amp;&amp;!opts.cost){
    const slope=-o.K/o.L; const xa=Math.max(0,o.L-6),xb=Math.min(30,o.L+6);
    g+=L_(mx(xa,P),my(clamp(o.K+slope*(xa-o.L),0,30),P),mx(xb,P),my(clamp(o.K+slope*(xb-o.L),0,30),P),_css('--eq'),1.8,'stroke-dasharray=&quot;5 4&quot;');
  }
  // optimal point
  if(opts.eq){
    const ex=mx(o.L,P),ey=my(o.K,P);
    g+=L_(ex,ey,ex,P.py+P.ph,_css('--guide'),1.4,'stroke-dasharray=&quot;4 3&quot;');
    g+=L_(ex,ey,P.px,ey,_css('--guide'),1.4,'stroke-dasharray=&quot;4 3&quot;');
    g+=`<circle cx=&quot;${ex}&quot; cy=&quot;${ey}&quot; r=&quot;7&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
    g+=T(ex+10,ey-8,'E',_css('--eq')==='#E0A21A'?'#9a6e00':_css('--eq'),14,'start',800);
    g+=T(ex,P.py+P.ph+15,'L*',_css('--cost'),11,'middle',800,true);
    g+=T(P.px-7,ey+4,'K*',_css('--iso'),11,'end',800,true);
  }
  g+='</svg>';document.getElementById(host).innerHTML=g;
  return o;
}

/* ===== 第二节：推导剧场 ===== */
const DV={step:0};
const DSTEPS=[
 {tag:&quot;前提 · 等产量线&quot;,title:&quot;同产量的要素组合：等产量线&quot;,
  body:`产出相同的所有 (L,K) 组合连成<b>等产量线</b>,<span class=&quot;key&quot;>凸向原点</span>。要多产,就换更远的等产量线。`,
  deriv:[[&quot;Q = √(LK) = Q₀ ⇒ LK = Q₀²&quot;,&quot;凸向原点的双曲线;越远产量越高&quot;]],opts:{isoMulti:1}},
 {tag:&quot;第 1 步 · MRTS&quot;,title:&quot;愿意如何替换：边际技术替代率&quot;,
  body:`沿等产量线全微分:<span class=&quot;math&quot;>MP_L·dL+MP_K·dK=0</span>。等产量线斜率 = <b>MRTS</b>,<span class=&quot;key&quot;>递减</span>(越往右下,1 单位 L 能替代的 K 越少)。`,
  deriv:[[&quot;−dK/dL = MP_L/MP_K = MRTS&quot;,&quot;等产量线斜率绝对值,递减&quot;]],opts:{mrts:1}},
 {tag:&quot;第 2 步 · 等成本线&quot;,title:&quot;花同样的钱能买什么：等成本线&quot;,
  body:`预算 C 固定:<span class=&quot;math&quot;>C=wL+rK</span>,这是一条直线,斜率 <span class=&quot;key&quot;>−w/r</span>(要素相对价格)。`,
  deriv:[[&quot;C = wL + rK ⇒ K = C/r − (w/r)L&quot;,&quot;斜率 −w/r,截距 C/r、C/w&quot;]],opts:{cost:1}},
 {tag:&quot;第 3 步 · 相切&quot;,title:&quot;最优：等产量线与等成本线相切&quot;,
  body:`在等成本约束下产量最大(或定产量下成本最小):两线<b>相切</b>。切点处斜率相等 ⇒ <span class=&quot;key&quot;>MRTS=w/r</span>。`,
  deriv:[[&quot;MRTS = w/r　⇔　MP_L/w = MP_K/r&quot;,&quot;每元钱的边际产量相等&quot;],[&quot;L*=10, K*=10, C*=40&quot;,&quot;&quot;]],opts:{cost:1,eq:1}},
];
function buildDerive(){
  const st=DSTEPS[DV.step];
  drawFactor('dHost',2,2,10,Object.assign({},st.opts));
  document.getElementById('dTag').textContent=`${st.tag}（第 ${DV.step+1}/${DSTEPS.length} 步）`;
  document.getElementById('dTitle').textContent=st.title;
  document.getElementById('dBody').innerHTML=st.body;
  document.getElementById('dDeriv').innerHTML=st.deriv.map(([f,s])=>`<div class=&quot;deriv&quot;>${f}${s?`<small>${s}</small>`:''}</div>`).join('');
  document.getElementById('dPrev').disabled=DV.step===0;document.getElementById('dNext').disabled=DV.step===DSTEPS.length-1;
  document.getElementById('dDots').innerHTML=DSTEPS.map((_,i)=>`<i class=&quot;${i===DV.step?'on':''}&quot; data-i=&quot;${i}&quot;></i>`).join('');
  document.querySelectorAll('#dDots i').forEach(d=>d.onclick=()=>{DV.step=+d.dataset.i;buildDerive();});
}
document.getElementById('dNext').onclick=()=>{if(DV.step<DSTEPS.length-1){DV.step++;buildDerive();}};
document.getElementById('dPrev').onclick=()=>{if(DV.step>0){DV.step--;buildDerive();}};

/* ===== 第三节：实验室 ===== */
const LB={w:2,r:2,Q0:10};
const PRESETS=[
 {w:2,r:2,t:'基准:w=r=2,要素价格相等 ⇒ 等成本线斜率 −1,最优 L*=K*=10(无偏向)。'},
 {w:4,r:1,t:'木工涨薪(w↑)、机器人降租(r↓):w/r=4,等成本线变陡 ⇒ 沿等产量线移向<b>资本密集</b>,L*↓、K*↑(用机器人替代木工)。'},
 {w:1,r:4,t:'市中心(空间/资本贵 r↑、劳动相对便宜):w/r=0.25 ⇒ 等成本线变平 ⇒ <b>劳动密集</b>,L*↑、K*↓(多雇人、少用设备)。'},
 {w:4,r:1,t:'郊区(资本便宜 r↓):w/r=4 ⇒ <b>资本密集</b>,高度自动化,K*↑、L*↓。'},
];
function buildLab(){

 [&quot;停业点&quot;,&quot;shutdown point&quot;,&quot;Shutdown point&quot;,&quot;AVC 最低点。价格低于此 ⇒ 短期停产。&quot;,&quot;p-mc&quot;],
 [&quot;LTC / LAC&quot;,&quot;长期总/平均成本&quot;,&quot;Long-run total / average cost&quot;,&quot;长期一切要素可变。LAC 是所有 SAC 的<b>下包络线</b>。&quot;,&quot;p-lr&quot;],
 [&quot;规模经济&quot;,&quot;economies of scale&quot;,&quot;Economies of scale&quot;,&quot;产量扩大使 LAC <b>下降</b>(分工、批量、共享资源)。&quot;,&quot;p-lr&quot;],
 [&quot;规模不经济&quot;,&quot;diseconomies of scale&quot;,&quot;Diseconomies of scale&quot;,&quot;规模过大使 LAC <b>上升</b>(管理协调成本增、监督失效)。&quot;,&quot;p-lr&quot;],
 [&quot;边际成本递增&quot;,&quot;increasing MC&quot;,&quot;Increasing marginal cost&quot;,&quot;边际报酬递减 ⇒ 产量增到一定程度后 MC 上升。&quot;,&quot;p-mc&quot;],
];
(function(){const g=document.getElementById('glossGrid');
 GLOSS.forEach(([s,cn,en,d,p])=>{const e=document.createElement('div');e.className='card';
  const col=p==='p-tot'?'var(--tc)':p==='p-avg'?'var(--vc)':p==='p-mc'?'var(--mc)':'var(--violet)';
  e.innerHTML=`<span class=&quot;sym&quot; style=&quot;color:${col}&quot;>${s}</span><span class=&quot;cn&quot;>${cn}</span><div class=&quot;en&quot;>${en}</div><div class=&quot;desc&quot;>${d}</div><span class=&quot;pill ${p}&quot;>${p==='p-tot'?'总量':p==='p-avg'?'平均':p==='p-mc'?'边际':'长期'}</span>`;
  g.appendChild(e);});})();

/* ===== 成本函数 TC=Q^3-6Q^2+15Q+FC ===== */
let FC=18;
function TC(Q){return Q*Q*Q-6*Q*Q+15*Q+FC;}
function VC(Q){return Q*Q*Q-6*Q*Q+15*Q;}
function MC(Q){return 3*Q*Q-12*Q+15;}
function AC(Q){return Q>0?TC(Q)/Q:NaN;}
function AVC(Q){return Q>0?VC(Q)/Q:NaN;}
function AFC(Q){return Q>0?FC/Q:NaN;}
// minima (for current FC): AVC min where d(AVC)/dQ=0 ; VC/Q=Q^2-6Q+15 -> min at Q=3 (value 6); AC min depends on FC
function avcMin(){return 3;} // AVC=Q^2-6Q+15 -> 2Q-6=0 -> Q=3, AVC=6

/* ===== 绘图基元 ===== */
function _css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function mx(v,P){return P.px+(v-P.xMin)/(P.xMax-P.xMin)*P.pw;}
function my(v,P){return P.py+P.ph-(v-P.yMin)/(P.yMax-P.yMin)*P.ph;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function L_(x1,y1,x2,y2,c,w,ex=''){return `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; ${ex}/>`;}
function T(x,y,t,c,s=13,a='start',w=600,it=false){return `<text x=&quot;${x}&quot; y=&quot;${y}&quot; fill=&quot;${c}&quot; font-size=&quot;${s}&quot; text-anchor=&quot;${a}&quot; font-weight=&quot;${w}&quot; ${it?'font-style=&quot;italic&quot; font-family=&quot;Georgia,serif&quot;':'font-family=&quot;PingFang SC,sans-serif&quot;'}>${t}</text>`;}
function svgOpen(w,h,label){return `<svg class=&quot;fig&quot; viewBox=&quot;0 0 ${w} ${h}&quot; role=&quot;img&quot; aria-label=&quot;${label}&quot;><defs>
  <marker id=&quot;ar&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;#192233&quot;/></marker></defs>`;}
function axesG(P,xlab,ylab){
  const Ey=P.py+P.ph,Ex=P.px+P.pw;let g='';
  for(let i=1;i<=4;i++){const gx=P.px+P.pw*i/5,gy=P.py+P.ph*i/5;g+=L_(gx,P.py,gx,Ey,'var(--grid)',1);g+=L_(P.px,gy,Ex,gy,'var(--grid)',1);}
  g+=L_(P.px,Ey,Ex+12,Ey,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=`<line x1=&quot;${P.px}&quot; y1=&quot;${Ey}&quot; x2=&quot;${P.px}&quot; y2=&quot;${P.py-12}&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/>`;
  g+=T(P.px-7,P.py-13,ylab,_css('--ink'),14,'end',700);
  g+=T(Ex+16,Ey+5,xlab,_css('--ink'),15,'start',800,true);
  g+=T(P.px-9,Ey+16,'O',_css('--ink'),13,'end',700);
  return g;
}
function curve(fn,P,lo,hi,c,w,op=1,dash=''){let pts=[];for(let i=0;i<=140;i++){const x=lo+(hi-lo)*i/140;const y=fn(x);if(isFinite(y)&amp;&amp;y>=P.yMin&amp;&amp;y<=P.yMax)pts.push([mx(x,P),my(y,P)]);}if(pts.length<2)return '';let d='M'+pts[0][0]+' '+pts[0][1];for(let i=1;i<pts.length;i++)d+=' L'+pts[i][0]+' '+pts[i][1];return `<path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; opacity=&quot;${op}&quot; ${dash?'stroke-dasharray=&quot;'+dash+'&quot;':''}/>`;}

/* ===== 第二节：推导剧场 ===== */
const DV={step:0};
const DSTEPS=[
 {tag:&quot;前提 · 总量三条&quot;,title:&quot;TC = FC + VC&quot;,
  body:`<b style=&quot;color:var(--fc)&quot;>固定成本 FC</b> 是水平线(Q=0 也有);<b style=&quot;color:var(--vc)&quot;>可变成本 VC</b> 从原点出发、先慢后快;两者叠加成 <b style=&quot;color:var(--tc)&quot;>总成本 TC</b>,<b>TC 与 VC 之间永远相差 FC</b>。`,
  deriv:[[&quot;TC = FC + VC&quot;,&quot;TC、VC 形状相同,垂直相差 FC&quot;]],mode:'total',show:['fc','vc','tc']},
 {tag:&quot;第 1 步 · 边际成本&quot;,title:&quot;MC = TC 的斜率&quot;,
  body:`<span class=&quot;key&quot;>MC = dTC/dQ</span>=TC(也=VC)切线的斜率。因边际报酬<b>先增后减</b>,MC 呈 <b>U 形</b>(先降后升)。`,
  deriv:[[&quot;MC = dTC/dQ = 3Q² − 12Q + 15&quot;,&quot;最低在 Q=2(MC=3)&quot;]],mode:'avg',show:['mc']},
 {tag:&quot;第 2 步 · 平均三条&quot;,title:&quot;AC、AVC、AFC&quot;,
  body:`各除以产量:<b style=&quot;color:var(--tc)&quot;>AC=TC/Q</b>、<b style=&quot;color:var(--vc)&quot;>AVC=VC/Q</b>、<b style=&quot;color:var(--fc)&quot;>AFC=FC/Q</b>。AFC 持续下降(摊薄);AC=AVC+AFC,故 <b>AC 与 AVC 随 Q 增大越靠越近</b>。`,
  deriv:[[&quot;AC = AVC + AFC&quot;,&quot;AFC=FC/Q 单调下降&quot;]],mode:'avg',show:['mc','ac','avc','afc']},
 {tag:&quot;第 3 步 · 关键交点&quot;,title:&quot;MC 穿过 AC、AVC 的最低点&quot;,
  body:`<span class=&quot;key&quot;>MC 低于平均 ⇒ 把平均拉低;MC 高于平均 ⇒ 把平均抬高;相等 ⇒ 平均最低。</span>所以 MC 必从下方穿过 AVC、AC 的<b>最低点</b>。`,
  deriv:[[&quot;MC = AVC ⇒ AVC 最低（停业点）&quot;,&quot;Q=3, AVC=6&quot;],[&quot;MC = AC ⇒ AC 最低&quot;,&quot;&quot;]],mode:'avg',show:['mc','ac','avc','afc','marks']},
];
function drawCost(host,mode,show,Qmark){
  if(mode==='total'){
    const P={px:54,py:22,pw:382,ph:320,xMin:0,xMax:5.5,yMin:0,yMax:120};
    let g=svgOpen(460,378,'总成本');g+=axesG(P,'Q','C');
    if(show.includes('fc')){g+=L_(mx(0,P),my(FC,P),mx(5.5,P),my(FC,P),_css('--fc'),2.6);g+=T(mx(5.4,P),my(FC,P)-6,'FC',_css('--fc'),13,'end',800,true);}
    if(show.includes('vc')){g+=curve(VC,P,0,5.5,_css('--vc'),2.8);g+=T(mx(5.2,P),my(VC(5.2),P)+4,'VC',_css('--vc'),13,'end',800,true);}
    if(show.includes('tc')){g+=curve(TC,P,0,5.5,_css('--tc'),3);g+=T(mx(5.2,P),my(TC(5.2),P)-6,'TC',_css('--tc'),13,'end',800,true);}
    g+='</svg>';document.getElementById(host).innerHTML=g;return;
  }
  const P={px:54,py:22,pw:382,ph:320,xMin:0,xMax:5.5,yMin:0,yMax:30};
  let g=svgOpen(460,378,'平均与边际成本');g+=axesG(P,'Q','C');
  if(show.includes('afc'))g+=curve(AFC,P,0.6,5.5,_css('--fc'),2.4,1,'5 4');
  if(show.includes('avc'))g+=curve(AVC,P,0.4,5.5,_css('--vc'),2.8);
  if(show.includes('ac'))g+=curve(AC,P,0.7,5.5,_css('--tc'),2.8);
  if(show.includes('mc'))g+=curve(MC,P,0,5.5,_css('--mc'),3);
  if(show.includes('mc'))g+=T(mx(4.7,P),my(MC(4.7),P)-6,'MC',_css('--mc'),13,'middle',800,true);
  if(show.includes('avc'))g+=T(mx(5.2,P),my(AVC(5.2),P)+12,'AVC',_css('--vc'),12,'end',800,true);
  if(show.includes('ac'))g+=T(mx(5.2,P),my(AC(5.2),P)-6,'AC',_css('--tc'),12,'end',800,true);
  if(show.includes('afc'))g+=T(mx(4.6,P),my(AFC(4.6),P)+12,'AFC',_css('--fc'),12,'middle',800,true);
  if(show.includes('marks')){
    // AVC min at Q=3 (value 6); AC min where MC=AC
    g+=`<circle cx=&quot;${mx(3,P)}&quot; cy=&quot;${my(AVC(3),P)}&quot; r=&quot;5&quot; fill=&quot;${_css('--vc')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
    // find AC min numerically
    let qm=2,best=1e9;for(let q=1;q<=5;q+=0.001){const a=AC(q);if(a<best){best=a;qm=q;}}
    g+=`<circle cx=&quot;${mx(qm,P)}&quot; cy=&quot;${my(best,P)}&quot; r=&quot;5&quot; fill=&quot;${_css('--tc')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
    g+=L_(mx(3,P),my(AVC(3),P),mx(3,P),P.py+P.ph,_css('--vc'),1,'stroke-dasharray=&quot;3 3&quot; opacity=&quot;0.6&quot;');
    g+=T(mx(3,P),P.py+P.ph+15,'AVC min',_css('--vc'),10.5,'middle',700);
  }
  if(Qmark!==undefined){
    const mxL=mx(Qmark,P);
    g+=L_(mxL,P.py,mxL,P.py+P.ph,_css('--eq'),1.5,'stroke-dasharray=&quot;4 3&quot;');
    [[MC,_css('--mc')],[AC,_css('--tc')],[AVC,_css('--vc')],[AFC,_css('--fc')]].forEach(([fn,c])=>{const y=fn(Qmark);if(isFinite(y)&amp;&amp;y<=30)g+=`<circle cx=&quot;${mxL}&quot; cy=&quot;${my(y,P)}&quot; r=&quot;4.5&quot; fill=&quot;${c}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.8&quot;/>`;});
  }
  g+='</svg>';document.getElementById(host).innerHTML=g;
}
function buildDerive(){
  const st=DSTEPS[DV.step];
  drawCost('dHost',st.mode,st.show);
  document.getElementById('dTag').textContent=`${st.tag}（第 ${DV.step+1}/${DSTEPS.length} 步）`;
  document.getElementById('dTitle').textContent=st.title;
  document.getElementById('dBody').innerHTML=st.body;
  document.getElementById('dDeriv').innerHTML=st.deriv.map(([f,s])=>`<div class=&quot;deriv&quot;>${f}${s?`<small>${s}</small>`:''}</div>`).join('');
  document.getElementById('dPrev').disabled=DV.step===0;document.getElementById('dNext').disabled=DV.step===DSTEPS.length-1;
  document.getElementById('dDots').innerHTML=DSTEPS.map((_,i)=>`<i class=&quot;${i===DV.step?'on':''}&quot; data-i=&quot;${i}&quot;></i>`).join('');
  document.querySelectorAll('#dDots i').forEach(d=>d.onclick=()=>{DV.step=+d.dataset.i;buildDerive();});
}
document.getElementById('dNext').onclick=()=>{if(DV.step<DSTEPS.length-1){DV.step++;buildDerive();}};
document.getElementById('dPrev').onclick=()=>{if(DV.step>0){DV.step--;buildDerive();}};

/* ===== 第三节：实验室 ===== */
const LB={Q:2.5};
function buildLab(){
  drawCost('labHost','avg',['mc','ac','avc','afc'],LB.Q);
  document.getElementById('vQ').textContent=' = '+LB.Q.toFixed(2);
  document.getElementById('vF').textContent=' = '+FC;
  document.getElementById('oMC').textContent=MC(LB.Q).toFixed(2);
  document.getElementById('oAC').textContent=AC(LB.Q).toFixed(2);
  document.getElementById('oAVC').textContent=AVC(LB.Q).toFixed(2);
  document.getElementById('oAFC').textContent=AFC(LB.Q).toFixed(2);
  const bd=document.getElementById('labBadge'),it=document.getElementById('labInterp');
  const mc=MC(LB.Q),ac=AC(LB.Q),avc=AVC(LB.Q);
  if(mc<avc){bd.textContent='MC < AVC < AC';it.innerHTML='MC 在两条平均线<b>下方</b> ⇒ AVC、AC 都在<b>下降</b>。';}
  else if(mc<ac){bd.textContent='AVC < MC < AC';it.innerHTML='MC 已超过 AVC(AVC 开始<b>上升</b>),但仍低于 AC(AC 仍在<b>下降</b>)。';}
  else{bd.textContent='MC > AC > AVC';it.innerHTML='MC 在两条平均线<b>上方</b> ⇒ AVC、AC 都在<b>上升</b>。';}
}
document.getElementById('rQ').addEventListener('input',e=>{LB.Q=+e.target.value;buildLab();});
document.getElementById('rF').addEventListener('input',e=>{FC=+e.target.value;buildLab();buildDerive();});
document.getElementById('rQ').value=LB.Q;document.getElementById('rF').value=FC;

/* ===== 第四节：长期 LAC 包络线 ===== */
let LRZONE='eos';
function buildLR(){
  const P={px:52,py:22,pw:384,ph:300,xMin:0,xMax:12,yMin:0,yMax:14};
  // SAC family: parabolas with min shifting; SACk(Q)=a*(Q-ck)^2+dk
  const plants=[[2.2,7.2,0.55],[4,5.6,0.42],[6,5.0,0.42],[8,5.6,0.42],[9.8,7.2,0.55]];
  function sac(Q,c,d,a){return a*(Q-c)*(Q-c)+d;}
  function lac(Q){let m=1e9;plants.forEach(([c,d,a])=>{m=Math.min(m,sac(Q,c,d,a));});return m;}
  let g=svgOpen(460,360,'长期平均成本');g+=axesG(P,'Q','LAC');
  plants.forEach(([c,d,a],i)=>{g+=curve(q=>sac(q,c,d,a),P,Math.max(0.3,c-3),Math.min(12,c+3),_css('--ink-faint'),1.6,0.55);});
  g+=curve(lac,P,0.4,11.6,_css('--violet'),3.4);
  g+=T(mx(11,P),my(lac(11),P)-8,'LAC',_css('--violet'),14,'end',800,true);
  // zone shading
  const zones={eos:[0.4,6,'rgba(31,158,90,0.10)','规模经济:LAC↓'],min:[5.4,6.6,'rgba(224,162,26,0.16)','最优规模:LAC 最低'],dis:[6,11.6,'rgba(179,18,58,0.08)','规模不经济:LAC↑']};
  const z=zones[LRZONE];
  g+=`<rect x=&quot;${mx(z[0],P)}&quot; y=&quot;${P.py}&quot; width=&quot;${mx(z[1],P)-mx(z[0],P)}&quot; height=&quot;${P.ph}&quot; fill=&quot;${z[2]}&quot;/>`;
  // min point
  g+=`<circle cx=&quot;${mx(6,P)}&quot; cy=&quot;${my(lac(6),P)}&quot; r=&quot;5&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
  g+='</svg>';document.getElementById('lrHost').innerHTML=g;
  document.getElementById('lrInterp').innerHTML={
    eos:'产量较小段:扩大规模 → 分工、批量采购、共享资源 ⇒ <b>LAC 下降</b>,即规模经济。',
    min:'LAC 最低点 = <b>最优规模(最小效率规模)</b>。此处长期平均成本最低,企业最理想的长期规模。',
    dis:'产量过大段:组织臃肿、管理协调成本上升、监督失效 ⇒ <b>LAC 上升</b>,即规模不经济。'
  }[LRZONE];
}
document.querySelectorAll('#map [data-z]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#map [data-z]').forEach(x=>x.classList.remove('on'));b.classList.add('on');LRZONE=b.dataset.z;buildLR();});

buildDerive();buildLab();buildLR();
</script>

<header class=&quot;hero&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;eyebrow&quot;>微观十大核心图 · 第七张</div>
  <h1>推导 <em>完全竞争供给曲线</em><br>为什么供给曲线就是 MC</h1>
  <p class=&quot;lead&quot;>完全竞争企业是<b>价格接受者</b>:需求曲线是一条水平线 <span class=&quot;math&quot;>P=MR=AR</span>。利润最大化要 <span class=&quot;math&quot;>P=MC</span>,于是给定任意价格,产量都落在 MC 上——<b style=&quot;color:var(--mc)&quot;>MC 在 AVC 最低点以上的部分,就是企业的短期供给曲线</b>。价格跌破 AVC 最低点(停业点),停产。</p>
  <div class=&quot;formula&quot;>利润最大化：P = MR = MC　·　停业点：P = AVC_min</div>
  <svg class=&quot;mini&quot; viewBox=&quot;0 0 215 165&quot;>
    <line x1=&quot;24&quot; y1=&quot;148&quot; x2=&quot;210&quot; y2=&quot;148&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot;/>
    <line x1=&quot;24&quot; y1=&quot;148&quot; x2=&quot;24&quot; y2=&quot;8&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot;/>
    <path d=&quot;M34 60 Q75 130 110 100 Q150 70 195 22&quot; fill=&quot;none&quot; stroke=&quot;#B3123A&quot; stroke-width=&quot;2.8&quot;/>
    <path d=&quot;M40 120 Q95 145 150 120 Q175 108 195 78&quot; fill=&quot;none&quot; stroke=&quot;#2E7FD1&quot; stroke-width=&quot;2.4&quot;/>
    <line x1=&quot;24&quot; y1=&quot;78&quot; x2=&quot;195&quot; y2=&quot;78&quot; stroke=&quot;#1F9E5A&quot; stroke-width=&quot;2.2&quot; stroke-dasharray=&quot;5 4&quot;/>
    <circle cx=&quot;150&quot; cy=&quot;78&quot; r=&quot;5&quot; fill=&quot;#E0A21A&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>
  </svg>
</div></header>

<!-- 1 GLOSSARY -->

  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>01</span><h2>字母词典：中英文全称 + 经济含义</h2></div>
  <p class=&quot;sub&quot;>完全竞争:大量买卖者、产品同质、自由进出、<b>价格接受者</b>。先把市场结构与收益术语认全。</p>

</div></section>

  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>02</span><h2>推导剧场：MC 如何变成供给曲线</h2></div>
  <p class=&quot;sub&quot;>点下一步。用与上一张相同的成本结构:<span class=&quot;math&quot;>MC=3Q²−12Q+15</span>,AVC 最低点在 <span class=&quot;math&quot;>Q=3, AVC=6</span>(停业点),AC 最低 ≈11.35。</p>

  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>03</span><h2>短期均衡实验室：盈利、亏损、停业</h2></div>
  <p class=&quot;sub&quot;>拖动市场价格 <span class=&quot;math&quot;>P</span>(水平的需求线)。企业按 <span class=&quot;math&quot;>P=MC</span> 选产量,看它落在哪个区间:<b style=&quot;color:var(--profit)&quot;>P&amp;gt;AC 盈利</b> / <b>AVC&amp;lt;P&amp;lt;AC 亏损但继续生产</b> / <b style=&quot;color:var(--loss)&quot;>P&amp;lt;AVC 停产</b>。利润/亏损用矩形表示。</p>
  <div class=&quot;legend&quot;>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--mc)&quot;></i>MC=供给</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--ac)&quot;></i>AC</span>

    <span><i class=&quot;swatch&quot; style=&quot;background:var(--price)&quot;></i>P=MR=AR</span>
  </div>
  <div class=&quot;stage&quot;>

    <div class=&quot;controls&quot;>

      <div class=&quot;sliders&quot;>
        <div class=&quot;slider&quot;><label>市场价格 <span class=&quot;math&quot;>P</span><span class=&quot;v&quot; id=&quot;vP&quot;></span></label><input type=&quot;range&quot; id=&quot;rP&quot; min=&quot;3&quot; max=&quot;20&quot; step=&quot;0.25&quot;></div>
        <div class=&quot;readout&quot;>
          <div class=&quot;ro q&quot;><div class=&quot;k&quot;>产量 Q（P=MC）</div><div class=&quot;val&quot; id=&quot;oQ&quot;></div></div>
          <div class=&quot;ro p&quot;><div class=&quot;k&quot;>单位利润 P−AC</div><div class=&quot;val&quot; id=&quot;oM&quot;></div></div>
          <div class=&quot;ro pi&quot;><div class=&quot;k&quot;>总利润 π</div><div class=&quot;val&quot; id=&quot;oPi&quot;></div></div>
          <div class=&quot;ro pi&quot;><div class=&quot;k&quot;>AC / AVC</div><div class=&quot;val&quot; id=&quot;oAcAvc&quot;></div></div>
        </div>
      </div>
    </div>

</div></section>

<!-- 4 MAP -->
<section id=&quot;map&quot; style=&quot;border-bottom:none&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>04</span><h2>关系全景 · 长期均衡</h2></div>
  <div class=&quot;duo&quot;>
    <div class=&quot;panel&quot;>
      <h3>三种价格、三种处境</h3>
      <p>· <b style=&quot;color:var(--profit)&quot;>P &amp;gt; AC 最低:</b>有经济利润 → 吸引新企业进入。</p>
      <p>· <b>P = AC 最低:</b>不亏不赢(正常利润),长期均衡。</p>
      <p>· <b>AVC 最低 &amp;lt; P &amp;lt; AC 最低:</b>亏损,但价格仍能覆盖可变成本并补贴部分固定成本 → <b>短期继续生产</b>。</p>
      <p>· <b style=&quot;color:var(--loss)&quot;>P &amp;lt; AVC 最低:</b>连可变成本都收不回 → <b>停产</b>(停业点)。</p>
      <div class=&quot;note&quot;><b>供给曲线 = MC 曲线在 AVC 最低点以上的那一段。</b>市场供给曲线 = 所有企业供给曲线的<b>水平加总</b>。</div>
    </div>
    <div class=&quot;panel&quot;>
      <h3>长期均衡：P = AC 最低</h3>
      <p>自由进出 ⇒ 经济利润趋于 0。长期均衡处:</p>
      <p class=&quot;deriv&quot; style=&quot;font-size:14px&quot;>P = MR = MC = AC<sub>min</sub> = LAC<sub>min</sub></p>
      <p>厂商在长期平均成本最低点生产,经济利润为零(只赚正常利润),资源配置达到帕累托最优。</p>
      <div class=&quot;note&quot;>这就是为什么经济学推崇完全竞争——它把社会总剩余推到最大。下一张<b>垄断</b>恰恰相反:P&amp;gt;MC,产量偏低,出现无谓损失。</div>
    </div>
  </div>
</div></section>

<script>
/* ===== 词典 ===== */
const GLOSS=[
 [&quot;完全竞争&quot;,&quot;perfect competition&quot;,&quot;Perfect competition&quot;,&quot;大量买卖者、产品同质、自由进出、信息充分,厂商是价格接受者。&quot;,&quot;p-str&quot;],
 [&quot;价格接受者&quot;,&quot;price taker&quot;,&quot;Price taker&quot;,&quot;单个厂商无法影响市场价格,只能按市价销售任意产量。&quot;,&quot;p-str&quot;],
 [&quot;P=MR=AR&quot;,&quot;需求/收益线&quot;,&quot;Demand = MR = AR&quot;,&quot;完全竞争厂商面对的需求曲线是<b>水平线</b>,价格=边际收益=平均收益。&quot;,&quot;p-rev&quot;],
 [&quot;MR&quot;,&quot;边际收益&quot;,&quot;Marginal revenue&quot;,&quot;多卖 1 单位增加的收益。完全竞争下 MR=P。&quot;,&quot;p-rev&quot;],
 [&quot;利润最大化&quot;,&quot;profit max&quot;,&quot;Profit maximization&quot;,&quot;MR=MC 处利润最大。完全竞争即 <b>P=MC</b>。&quot;,&quot;p-eq&quot;],
 [&quot;MC&quot;,&quot;边际成本&quot;,&quot;Marginal cost&quot;,&quot;多产 1 单位的成本。其在 AVC 最低点以上的部分=供给曲线。&quot;,&quot;p-cost&quot;],
 [&quot;AC / AVC&quot;,&quot;平均(可变)成本&quot;,&quot;Average (variable) cost&quot;,&quot;AC=TC/Q;AVC=VC/Q。判断盈亏与是否停产的标尺。&quot;,&quot;p-cost&quot;],
 [&quot;停业点&quot;,&quot;shutdown point&quot;,&quot;Shutdown point&quot;,&quot;AVC 最低点。P 低于此则停产(连可变成本都收不回)。&quot;,&quot;p-cost&quot;],
 [&quot;短期供给曲线&quot;,&quot;short-run supply&quot;,&quot;Short-run supply curve&quot;,&quot;MC 在 AVC 最低点以上的部分。&quot;,&quot;p-eq&quot;],
 [&quot;长期均衡&quot;,&quot;long-run equilibrium&quot;,&quot;Long-run equilibrium&quot;,&quot;P=MC=AC_min,经济利润为零,资源最优配置。&quot;,&quot;p-eq&quot;],
 [&quot;市场供给&quot;,&quot;market supply&quot;,&quot;Market supply&quot;,&quot;所有厂商供给曲线的<b>水平加总</b>。&quot;,&quot;p-str&quot;],
];
(function(){const g=document.getElementById('glossGrid');
 GLOSS.forEach(([s,cn,en,d,p])=>{const e=document.createElement('div');e.className='card';
  const col=p==='p-str'?'var(--violet)':p==='p-rev'?'var(--price)':p==='p-cost'?'var(--mc)':'#9a6e00';
  e.innerHTML=`<span class=&quot;sym&quot; style=&quot;color:${col}&quot;>${s}</span><span class=&quot;cn&quot;>${cn}</span><div class=&quot;en&quot;>${en}</div><div class=&quot;desc&quot;>${d}</div><span class=&quot;pill ${p}&quot;>${p==='p-str'?'市场结构':p==='p-rev'?'收益':p==='p-cost'?'成本':'均衡'}</span>`;
  g.appendChild(e);});})();

/* ===== 成本函数(承接第六张) ===== */
const FC=18;
function VC(Q){return Q*Q*Q-6*Q*Q+15*Q;}
function MC(Q){return 3*Q*Q-12*Q+15;}
function AC(Q){return Q>0?(VC(Q)+FC)/Q:NaN;}
function AVC(Q){return Q>0?VC(Q)/Q:NaN;}
const AVCMIN_Q=3, AVCMIN=6;             // AVC=Q^2-6Q+15 -> min Q=3, val 6
// AC min numeric
let ACMIN_Q=3.67,ACMIN=11.35;(function(){let best=1e9,qm=3;for(let q=1;q<=5;q+=0.0005){const a=AC(q);if(a<best){best=a;qm=q;}}ACMIN_Q=qm;ACMIN=best;})();
// invert P=MC on the upward branch (Q>=2): 3Q^2-12Q+15=P -> Q=2+sqrt((P-3)/3)
function qFromP(P){return 2+Math.sqrt(Math.max(0,(P-3)/3));}

/* ===== 绘图基元 ===== */
function _css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function mx(v,P){return P.px+(v-P.xMin)/(P.xMax-P.xMin)*P.pw;}
function my(v,P){return P.py+P.ph-(v-P.yMin)/(P.yMax-P.yMin)*P.ph;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function L_(x1,y1,x2,y2,c,w,ex=''){return `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; ${ex}/>`;}
function T(x,y,t,c,s=13,a='start',w=600,it=false){return `<text x=&quot;${x}&quot; y=&quot;${y}&quot; fill=&quot;${c}&quot; font-size=&quot;${s}&quot; text-anchor=&quot;${a}&quot; font-weight=&quot;${w}&quot; ${it?'font-style=&quot;italic&quot; font-family=&quot;Georgia,serif&quot;':'font-family=&quot;PingFang SC,sans-serif&quot;'}>${t}</text>`;}
function POLY(pts,fill,op){return `<polygon points=&quot;${pts.map(p=>p[0]+','+p[1]).join(' ')}&quot; fill=&quot;${fill}&quot; opacity=&quot;${op}&quot;/>`;}
function svgOpen(w,h,label){return `<svg class=&quot;fig&quot; viewBox=&quot;0 0 ${w} ${h}&quot; role=&quot;img&quot; aria-label=&quot;${label}&quot;><defs>
  <marker id=&quot;ar&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;#192233&quot;/></marker></defs>`;}
function axesG(P,xlab,ylab){
  const Ey=P.py+P.ph,Ex=P.px+P.pw;let g='';
  for(let i=1;i<=4;i++){const gx=P.px+P.pw*i/5,gy=P.py+P.ph*i/5;g+=L_(gx,P.py,gx,Ey,'var(--grid)',1);g+=L_(P.px,gy,Ex,gy,'var(--grid)',1);}
  g+=L_(P.px,Ey,Ex+12,Ey,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=`<line x1=&quot;${P.px}&quot; y1=&quot;${Ey}&quot; x2=&quot;${P.px}&quot; y2=&quot;${P.py-12}&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/>`;
  g+=T(P.px-7,P.py-13,ylab,_css('--ink'),15,'end',800,true);
  g+=T(Ex+16,Ey+5,xlab,_css('--ink'),15,'start',800,true);
  g+=T(P.px-9,Ey+16,'O',_css('--ink'),13,'end',700);
  return g;
}
function curve(fn,P,lo,hi,c,w,op=1,dash=''){let pts=[];for(let i=0;i<=140;i++){const x=lo+(hi-lo)*i/140;const y=fn(x);if(isFinite(y)&amp;&amp;y>=P.yMin&amp;&amp;y<=P.yMax)pts.push([mx(x,P),my(y,P)]);}if(pts.length<2)return '';let d='M'+pts[0][0]+' '+pts[0][1];for(let i=1;i<pts.length;i++)d+=' L'+pts[i][0]+' '+pts[i][1];return `<path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; opacity=&quot;${op}&quot; ${dash?'stroke-dasharray=&quot;'+dash+'&quot;':''}/>`;}

function drawPC(host,opts){
  const P={px:52,py:22,pw:384,ph:320,xMin:0,xMax:5.5,yMin:0,yMax:30};
  let g=svgOpen(460,378,'完全竞争');g+=axesG(P,'Q','P, 成本');
  // supply highlight: MC above AVC min
  if(opts.supply){g+=curve(MC,P,AVCMIN_Q,5.3,_css('--mc'),5,0.25);}
  g+=curve(MC,P,0,5.3,_css('--mc'),3);
  g+=T(mx(5,P),my(MC(5),P)-6,'MC',_css('--mc'),13,'middle',800,true);
  if(opts.avc){g+=curve(AVC,P,0.4,5.3,_css('--avc'),2.6);g+=T(mx(5.1,P),my(AVC(5.1),P)+12,'AVC',_css('--avc'),12,'end',800,true);}
  if(opts.ac){g+=curve(AC,P,0.7,5.3,_css('--ac'),2.6);g+=T(mx(5.1,P),my(AC(5.1),P)-6,'AC',_css('--ac'),12,'end',800,true);}
  // shutdown point
  if(opts.shut){g+=`<circle cx=&quot;${mx(AVCMIN_Q,P)}&quot; cy=&quot;${my(AVCMIN,P)}&quot; r=&quot;5&quot; fill=&quot;${_css('--avc')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
    g+=T(mx(AVCMIN_Q,P)+8,my(AVCMIN,P)+14,'停业点',_css('--avc'),11,'start',800);}
  if(opts.acmin){g+=`<circle cx=&quot;${mx(ACMIN_Q,P)}&quot; cy=&quot;${my(ACMIN,P)}&quot; r=&quot;5&quot; fill=&quot;${_css('--ac')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;}
  // price line &amp; equilibrium
  if(opts.price!==undefined){
    const pr=opts.price;
    g+=L_(P.px,my(pr,P),mx(5.5,P),my(pr,P),_css('--price'),2.6,'stroke-dasharray=&quot;6 4&quot;');
    g+=T(mx(5.5,P),my(pr,P)-6,'P=MR=AR',_css('--price'),12,'end',800,true);
    if(pr>=AVCMIN){
      const q=qFromP(pr);
      const ex=mx(q,P),ey=my(pr,P);
      // profit/loss rectangle: between P and AC over [0,q]
      const ac=AC(q);
      const fill=pr>=ac?_css('--profit'):_css('--loss');
      g+=POLY([[mx(0,P),my(pr,P)],[ex,my(pr,P)],[ex,my(ac,P)],[mx(0,P),my(ac,P)]],fill,0.16);
      g+=L_(ex,ey,ex,P.py+P.ph,_css('--guide'),1.3,'stroke-dasharray=&quot;4 3&quot;');
      g+=`<circle cx=&quot;${ex}&quot; cy=&quot;${ey}&quot; r=&quot;6&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
      g+=T(ex,P.py+P.ph+15,'Q*',_css('--mc'),11,'middle',800,true);
    }else{
      g+=T((P.px+mx(5.5,P))/2,my(pr,P)-8,'P<AVCmin → 停产 Q=0',_css('--loss'),12,'middle',800);
    }
  }
  g+='</svg>';document.getElementById(host).innerHTML=g;
}

/* ===== 第二节：推导剧场 ===== */
const DV={step:0};
const DSTEPS=[
 {tag:&quot;前提 · 水平需求&quot;,title:&quot;价格接受者：需求线是水平的&quot;,
  body:`完全竞争厂商太小,改变产量不影响市价。它面对的需求线是<b>水平线</b>:卖多卖少都按市价 P。于是 <span class=&quot;key&quot;>P = MR = AR</span>。`,
  deriv:[[&quot;P = MR = AR = 常数&quot;,&quot;水平需求线&quot;]],opts:{ac:1,avc:1,price:11}},
 {tag:&quot;第 1 步 · 利润最大化&quot;,title:&quot;P = MC 决定最优产量&quot;,
  body:`利润最大化要 MR=MC;完全竞争 MR=P,故 <span class=&quot;key&quot;>P=MC</span>。在 MC 上升段与价格线交点即最优产量 Q*。`,
  deriv:[[&quot;MR = MC ⇒ P = MC&quot;,&quot;交点定 Q*&quot;]],opts:{ac:1,avc:1,price:11}},
 {tag:&quot;第 2 步 · 停业点&quot;,title:&quot;价格跌破 AVC 最低点就停产&quot;,
  body:`若 P 低于 <b style=&quot;color:var(--avc)&quot;>AVC 最低点</b>,连可变成本都收不回,生产不如停产(只亏固定成本)。<span class=&quot;key&quot;>AVC 最低点 = 停业点</span>。`,
  deriv:[[&quot;停业点：P = AVC_min = 6 (Q=3)&quot;,&quot;P<此 ⇒ 停产&quot;]],opts:{ac:1,avc:1,shut:1,price:6}},
 {tag:&quot;第 3 步 · 供给曲线&quot;,title:&quot;供给曲线 = AVC 最低点以上的 MC&quot;,
  body:`对每个 P≥AVC_min,最优产量都在 MC 上 ⇒ <span class=&quot;key&quot;>MC 在 AVC 最低点以上的部分,就是短期供给曲线</span>(加粗段)。市场供给 = 各厂商水平加总。`,
  deriv:[[&quot;S = MC | (P ≥ AVC_min)&quot;,&quot;加粗段即供给曲线&quot;]],opts:{ac:1,avc:1,shut:1,supply:1}},
];
function buildDerive(){
  const st=DSTEPS[DV.step];
  drawPC('dHost',Object.assign({},st.opts));
  document.getElementById('dTag').textContent=`${st.tag}（第 ${DV.step+1}/${DSTEPS.length} 步）`;
  document.getElementById('dTitle').textContent=st.title;
  document.getElementById('dBody').innerHTML=st.body;
  document.getElementById('dDeriv').innerHTML=st.deriv.map(([f,s])=>`<div class=&quot;deriv&quot;>${f}${s?`<small>${s}</small>`:''}</div>`).join('');
  document.getElementById('dPrev').disabled=DV.step===0;document.getElementById('dNext').disabled=DV.step===DSTEPS.length-1;
  document.getElementById('dDots').innerHTML=DSTEPS.map((_,i)=>`<i class=&quot;${i===DV.step?'on':''}&quot; data-i=&quot;${i}&quot;></i>`).join('');
  document.querySelectorAll('#dDots i').forEach(d=>d.onclick=()=>{DV.step=+d.dataset.i;buildDerive();});
}
document.getElementById('dNext').onclick=()=>{if(DV.step<DSTEPS.length-1){DV.step++;buildDerive();}};
document.getElementById('dPrev').onclick=()=>{if(DV.step>0){DV.step--;buildDerive();}};

/* ===== 第三节：实验室 ===== */
const LB={P:13};
function buildLab(){
  drawPC('labHost',{ac:1,avc:1,shut:1,acmin:1,price:LB.P});
  document.getElementById('vP').textContent=' = '+LB.P.toFixed(2);
  const bd=document.getElementById('labBadge'),it=document.getElementById('labInterp');
  if(LB.P<AVCMIN){
    document.getElementById('oQ').textContent='0';document.getElementById('oM').textContent='—';
    document.getElementById('oPi').textContent=(-FC).toFixed(1);document.getElementById('oAcAvc').textContent='—';
    bd.style.background='rgba(179,18,58,.1)';bd.style.color='var(--loss)';bd.textContent='P < AVCmin · 停产';
    it.innerHTML='价格连可变成本都收不回 ⇒ <b>停产</b>,只亏固定成本 −'+FC+'。';
    return;
  }
  const q=qFromP(LB.P),ac=AC(q),avc=AVC(q),pi=(LB.P-ac)*q;
  document.getElementById('oQ').textContent=q.toFixed(2);
  document.getElementById('oM').textContent=(LB.P-ac).toFixed(2);
  document.getElementById('oPi').textContent=(pi>=0?'+':'')+pi.toFixed(1);
  document.getElementById('oAcAvc').textContent=ac.toFixed(1)+' / '+avc.toFixed(1);
  if(LB.P>=ACMIN){bd.style.background='rgba(31,158,90,.13)';bd.style.color='var(--profit)';bd.textContent='P > ACmin · 盈利';
    it.innerHTML='P 高于 AC ⇒ 有<b>经济利润</b>(绿色矩形)。长期会吸引新企业进入,价格被压回 AC 最低。';}
  else{bd.style.background='rgba(224,162,26,.18)';bd.style.color='#9a6e00';bd.textContent='AVCmin < P < ACmin · 亏损但生产';
    it.innerHTML='P 低于 AC 但高于 AVC ⇒ <b>亏损</b>(红色矩形),但价格能覆盖可变成本并补贴部分固定成本,<b>短期继续生产</b>好过停产。';}
}
document.getElementById('rP').addEventListener('input',e=>{LB.P=+e.target.value;buildLab();});
document.getElementById('rP').value=LB.P;
buildDerive();buildLab();
</script>

<section id=&quot;pd&quot; style=&quot;border-bottom:none&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>04</span><h2>价格歧视：三级歧视（计算题6）</h2></div>
  <p class=&quot;sub&quot;>两类顾客:<span class=&quot;math&quot;>Q_A=400−20P_A</span>(对价格更敏感,E 大)、<span class=&quot;math&quot;>Q_B=600−20P_B</span>,<span class=&quot;math&quot;>MC=10</span>。三级歧视=分别在每个子市场令 <span class=&quot;math&quot;>MR=MC</span>,<b>弹性大的定低价、弹性小的定高价</b>。切换看与统一定价的福利差异。</p>
  <div class=&quot;btnrow&quot;><span class=&quot;lab&quot;>定价方式：</span>
    <button class=&quot;btn on&quot; data-pd=&quot;sep&quot;>三级歧视(分别定价)</button>
    <button class=&quot;btn&quot; data-pd=&quot;uni&quot;>统一定价</button></div>
  <div class=&quot;stage&quot;>
    <div class=&quot;figbox&quot;><div id=&quot;pdHost&quot;></div></div>
    <div class=&quot;controls&quot;>

        <tr><td class=&quot;l&quot;>利润 π(PS)</td><td id=&quot;t_pia&quot;></td><td id=&quot;t_pib&quot;></td><td id=&quot;t_pi&quot;></td></tr>
        <tr><td class=&quot;l&quot;>消费者剩余 CS</td><td id=&quot;t_csa&quot;></td><td id=&quot;t_csb&quot;></td><td id=&quot;t_cs&quot;></td></tr>
        <tr><td class=&quot;l&quot;>社会总福利 TS</td><td>—</td><td>—</td><td id=&quot;t_ts&quot;></td></tr>

      <div class=&quot;note&quot;><b>结论(计算题6)：</b>分别定价利润 2500 &amp;gt; 统一 2250(+250),但社会总福利 3750 &amp;lt; 3875(−125),且 PS 占比从 58.1% 升到 66.7% —— 厂商更赚、社会更不公。<br>(注:三级歧视并不总是降低总福利;若能扩大总产量,反而可能提高。)</div>

  </div>
  <div class=&quot;duo&quot; style=&quot;margin-top:22px&quot;>
    <div class=&quot;panel&quot;>

      <table class=&quot;tbl&quot;>
        <tr><th>　</th><th>统一定价</th><th>一级歧视</th></tr>
        <tr><td class=&quot;l&quot;>产量 Q</td><td>40</td><td>80</td></tr>
        <tr><td class=&quot;l&quot;>价格</td><td>60</td><td>沿需求逐单位</td></tr>
        <tr><td class=&quot;l&quot;>CS</td><td>800</td><td class=&quot;hi&quot;>0</td></tr>
        <tr><td class=&quot;l&quot;>PS</td><td>1600</td><td class=&quot;hi&quot;>3200</td></tr>
        <tr><td class=&quot;l&quot;>TS</td><td>2400</td><td class=&quot;hi&quot;>3200</td></tr>

      <p style=&quot;font-size:12.5px;margin-top:8px;color:var(--ink-soft)&quot;>一级歧视:对每单位按最高意愿支付定价,产到 P=MC(Q=80),<b>消除无谓损失(有效率)</b>,但 CS 全部转给厂商(<b>极不公平</b>)。</p>
    </div>
    <div class=&quot;panel&quot;>
      <h3>三级价格歧视的定价原则</h3>
      <p class=&quot;deriv&quot; style=&quot;font-size:14px&quot;>MR_A = MR_B = MC，且 MR = P(1 − 1/E)</p>
      <p>⇒ 弹性 <b>E 小</b>的市场定<b>高价</b>,E 大的市场定<b>低价</b>(如学生票、不同国家定价)。本题 A 弹性大(E=1)→ 低价 15;B 弹性小(E=0.5)→ 高价 20。</p>
      <div class=&quot;note&quot;>三级歧视成立的两个前提:<b>有定价权 + 市场可隔离(不能转售套利)</b>。</div>
