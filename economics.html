<script>
/* ===== 词典 ===== */
const GLOSS=[
 [&quot;π&quot;,&quot;通货膨胀率&quot;,&quot;Inflation rate&quot;,&quot;一般价格水平的变动率,纵轴。π = P − P₋₁（对数）。&quot;,&quot;p-core&quot;],
 [&quot;u&quot;,&quot;失业率&quot;,&quot;Unemployment rate&quot;,&quot;失业人数 / 劳动力,横轴。&quot;,&quot;p-core&quot;],
 [&quot;PC&quot;,&quot;菲利普斯曲线&quot;,&quot;Phillips Curve&quot;,&quot;通胀与失业关系的曲线。短期下倾(SRPC)、长期垂直(LRPC)。&quot;,&quot;p-core&quot;],
 [&quot;πᴱ&quot;,&quot;预期通胀&quot;,&quot;Expected inflation&quot;,&quot;公众对本期通胀的预期。πᴱ 上升 ⇒ SRPC 整体上移。&quot;,&quot;p-exp&quot;],
 [&quot;u*&quot;,&quot;自然失业率 / NAIRU&quot;,&quot;Natural rate / NAIRU&quot;,&quot;摩擦+结构性失业,长期 PC 的位置,「不让通胀加速的失业率」。&quot;,&quot;p-nat&quot;],
 [&quot;β&quot;,&quot;斜率系数&quot;,&quot;Slope coefficient&quot;,&quot;β&amp;gt;0,衡量失业缺口对通胀的拉动。β 越大,SRPC 越陡。&quot;,&quot;p-par&quot;],
 [&quot;μ&quot;,&quot;供给冲击项&quot;,&quot;Supply-shock term&quot;,&quot;μ=−v/α。<b>不利冲击 μ&amp;gt;0</b> 使 PC 上移(滞胀);有利 μ&amp;lt;0 下移。&quot;,&quot;p-exp&quot;],
 [&quot;λ&quot;,&quot;预期调整权重&quot;,&quot;Adaptive-expectation weight&quot;,&quot;πᴱ=λπ₋₁+(1−λ)πᴱ₋₁。λ=1 即 πᴱ=π₋₁（极端适应性）。&quot;,&quot;p-exp&quot;],
 [&quot;SRPC&quot;,&quot;短期菲利普斯曲线&quot;,&quot;Short-run Phillips Curve&quot;,&quot;给定 πᴱ,向右下倾,存在通胀–失业取舍。&quot;,&quot;p-core&quot;],
 [&quot;LRPC&quot;,&quot;长期菲利普斯曲线&quot;,&quot;Long-run Phillips Curve&quot;,&quot;在 u* 处垂直,无持久取舍。&quot;,&quot;p-core&quot;],
 [&quot;奥肯定律&quot;,&quot;Okun's law&quot;,&quot;Okun's law&quot;,&quot;产出缺口与失业缺口负相关：(1/α)(Y−Y*) = −β(u−u*)。&quot;,&quot;p-nat&quot;],
 [&quot;滞胀&quot;,&quot;停滞膨胀&quot;,&quot;Stagflation&quot;,&quot;失业与通胀同升,对应 μ&amp;gt;0 使 PC 整体上移。&quot;,&quot;p-exp&quot;],
];
(function(){const g=document.getElementById('glossGrid');
 GLOSS.forEach(([s,cn,en,d,p])=>{const e=document.createElement('div');e.className='card';
  const col=p==='p-core'?'var(--pc)':p==='p-exp'?'var(--violet)':p==='p-nat'?'var(--natural)':'#9a6e00';
  e.innerHTML=`<span class=&quot;sym&quot; style=&quot;color:${col}&quot;>${s}</span><span class=&quot;cn&quot;>${cn}</span><div class=&quot;en&quot;>${en}</div><div class=&quot;desc&quot;>${d}</div><span class=&quot;pill ${p}&quot;>${p==='p-core'?'核心/坐标':p==='p-exp'?'预期/冲击':p==='p-nat'?'自然率':'参数'}</span>`;
  g.appendChild(e);});})();

/* ===== 绘图基元 ===== */
function _css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function mx(v,P){return P.px+(v-P.xMin)/(P.xMax-P.xMin)*P.pw;}
function my(v,P){return P.py+P.ph-(v-P.yMin)/(P.yMax-P.yMin)*P.ph;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function L(x1,y1,x2,y2,c,w,ex=''){return `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; ${ex}/>`;}
function T(x,y,t,c,s=13,a='start',w=600,it=false){return `<text x=&quot;${x}&quot; y=&quot;${y}&quot; fill=&quot;${c}&quot; font-size=&quot;${s}&quot; text-anchor=&quot;${a}&quot; font-weight=&quot;${w}&quot; ${it?'font-style=&quot;italic&quot; font-family=&quot;Georgia,serif&quot;':'font-family=&quot;PingFang SC,sans-serif&quot;'}>${t}</text>`;}
function svgOpen(w,h,label){return `<svg class=&quot;fig&quot; viewBox=&quot;0 0 ${w} ${h}&quot; role=&quot;img&quot; aria-label=&quot;${label}&quot;><defs>
  <marker id=&quot;ar&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;#192233&quot;/></marker>
  <marker id=&quot;vio&quot; markerWidth=&quot;10&quot; markerHeight=&quot;10&quot; refX=&quot;7&quot; refY=&quot;5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;#7A3FB0&quot;/></marker></defs>`;}
function axesG(P,xlab,ylab){
  const Ey=P.py+P.ph,Ex=P.px+P.pw;let g='';
  for(let i=1;i<=4;i++){const gx=P.px+P.pw*i/5,gy=P.py+P.ph*i/5;g+=L(gx,P.py,gx,Ey,'var(--grid)',1);g+=L(P.px,gy,Ex,gy,'var(--grid)',1);}
  g+=L(P.px,Ey,Ex+12,Ey,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=`<line x1=&quot;${P.px}&quot; y1=&quot;${Ey}&quot; x2=&quot;${P.px}&quot; y2=&quot;${P.py-12}&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/>`;
  g+=T(P.px-7,P.py-13,ylab,_css('--ink'),16,'end',800,true);
  g+=T(Ex+16,Ey+5,xlab,_css('--ink'),16,'start',800,true);
  g+=T(P.px-9,Ey+16,'O',_css('--ink'),13,'end',700);
  return g;
}

/* ===== 第二节：推导剧场 ===== */
const DV={step:0,pe:2,beta:0.8,ustar:5,mu:0};
const DSTEPS=[
 {tag:&quot;前提 · 第十二章总供给&quot;,title:&quot;从 AS 曲线出发&quot;,
  body:`总供给可写成 <span class=&quot;math&quot;>Y = Y* + α(P − Pᴱ) + v</span>：实际产出偏离潜在产出 Y*,取决于<b>价格意外</b>(P−Pᴱ)和供给扰动 v。`,
  deriv:[[&quot;Y = Y* + α(P − Pᴱ) + v&quot;,&quot;α&amp;gt;0：价格高于预期 ⇒ 厂商多生产&quot;]],draw:0},
 {tag:&quot;第 1 步 · 解出价格&quot;,title:&quot;把 P 解出来&quot;,
  body:`移项,把价格 P 写成产出缺口的函数。`,
  deriv:[[&quot;P = Pᴱ + (1/α)(Y − Y*) − v/α&quot;,&quot;&quot;]],draw:0},
 {tag:&quot;第 2 步 · 变成通胀率&quot;,title:&quot;减去上期价格 ⇒ 通胀&quot;,
  body:`两边减上期价格 <span class=&quot;math&quot;>P₋₁</span>。因取对数,<span class=&quot;math&quot;>P − P₋₁</span> 即通胀率 π。令 <span class=&quot;math&quot;>μ = −v/α</span>。`,
  deriv:[[&quot;π = πᴱ + (1/α)(Y − Y*) + μ&quot;,&quot;(1) 用产出缺口表示的 PC&quot;]],draw:1},
 {tag:&quot;第 3 步 · 奥肯定律&quot;,title:&quot;把产出缺口换成失业缺口&quot;,
  body:`<b>奥肯定律</b>把产出缺口与失业缺口挂钩：产出高于潜在 ⇒ 失业低于自然率。`,
  deriv:[[&quot;(1/α)(Y − Y*) = −β(u − u*)&quot;,&quot;产出缺口 ↔ 失业缺口,负相关&quot;]],draw:2},
 {tag:&quot;第 4 步 · 最终 PC&quot;,title:&quot;代入 ⇒ 菲利普斯曲线&quot;,
  body:`把奥肯定律代入 (1),得到最终版本。<span class=&quot;key&quot;>β&amp;gt;0 ⇒ π 与 u 负相关</span>,SRPC 向右下倾斜。`,
  deriv:[[&quot;π = πᴱ − β(u − u*) + μ&quot;,&quot;给定 πᴱ,这是一条向下的 SRPC&quot;]],draw:3},
];
function srpcPi(u,s){return s.pe - s.beta*(u-s.ustar) + s.mu;}
function buildDerive(){
  const P={px:60,py:26,pw:360,ph:296,xMin:0,xMax:12,yMin:-2,yMax:12};
  const st=DSTEPS[DV.step];let g=svgOpen(450,360,'PC 推导');g+=axesG(P,'u','π');
  g+=`<text x=&quot;${P.px-6}&quot; y=&quot;${P.py-1}&quot; fill=&quot;${_css('--ink-soft')}&quot; font-size=&quot;10&quot; text-anchor=&quot;end&quot;>通胀</text>`;
  g+=`<text x=&quot;${P.px+P.pw+14}&quot; y=&quot;${P.py+P.ph+20}&quot; fill=&quot;${_css('--ink-soft')}&quot; font-size=&quot;10&quot; text-anchor=&quot;end&quot;>失业</text>`;
  if(st.draw>=2){ // u* vertical guide
    g+=L(mx(DV.ustar,P),P.py,mx(DV.ustar,P),P.py+P.ph,_css('--natural'),1.6,'stroke-dasharray=&quot;5 4&quot;');
    g+=T(mx(DV.ustar,P),P.py+P.ph+16,'u*',_css('--natural'),13,'middle',800,true);
  }
  if(st.draw>=3){ // SRPC line
    const u1=1.5,u2=10.5,p1=srpcPi(u1,DV),p2=srpcPi(u2,DV);
    g+=L(mx(u1,P),my(clamp(p1,-2,12),P),mx(u2,P),my(clamp(p2,-2,12),P),_css('--pc'),3);
    g+=T(mx(2.4,P),my(srpcPi(2.4,DV),P)-8,'PC',_css('--pc'),15,'start',800,true);
    // point at u* showing pe+mu
    g+=`<circle cx=&quot;${mx(DV.ustar,P)}&quot; cy=&quot;${my(DV.pe+DV.mu,P)}&quot; r=&quot;5&quot; fill=&quot;${_css('--accent')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
    g+=T(mx(DV.ustar,P)+8,my(DV.pe+DV.mu,P)-6,'πᴱ',_css('--ink'),12,'start',700,true);
  } else if(st.draw>=1){
    g+=T(P.px+P.pw/2,P.py+P.ph/2,'π = πᴱ + (1/α)(Y−Y*) + μ',_css('--ink-faint'),13,'middle',600,true);
  } else {
    g+=T(P.px+P.pw/2,P.py+P.ph/2,'AS: Y = Y* + α(P−Pᴱ) + v',_css('--ink-faint'),13,'middle',600,true);
  }
  g+='</svg>';document.getElementById('dHost').innerHTML=g;
  document.getElementById('dTag').textContent=`${st.tag} （第 ${DV.step+1}/${DSTEPS.length} 步）`;
  document.getElementById('dTitle').textContent=st.title;
  document.getElementById('dBody').innerHTML=st.body;
  document.getElementById('dDeriv').innerHTML=st.deriv.map(([f,s])=>`<div class=&quot;deriv&quot;>${f}${s?`<small>${s}</small>`:''}</div>`).join('');
  document.getElementById('dPrev').disabled=DV.step===0;document.getElementById('dNext').disabled=DV.step===DSTEPS.length-1;
  document.getElementById('dDots').innerHTML=DSTEPS.map((_,i)=>`<i class=&quot;${i===DV.step?'on':''}&quot; data-i=&quot;${i}&quot;></i>`).join('');
  document.querySelectorAll('#dDots i').forEach(d=>d.onclick=()=>{DV.step=+d.dataset.i;buildDerive();});
}
document.getElementById('dNext').onclick=()=>{if(DV.step<DSTEPS.length-1){DV.step++;buildDerive();}};
document.getElementById('dPrev').onclick=()=>{if(DV.step>0){DV.step--;buildDerive();}};

/* ===== 第三节：实验室 ===== */
const LB={mode:'explore',u:3.5,pe:2,ustar:5,beta:0.8,mu:0,gap:1.5,
  demo:{round:0,peSeq:[2],path:[],lrpc:[]}};
const PLB={px:62,py:28,pw:476,ph:402,xMin:0,xMax:12,yMin:-2,yMax:16};
function piAt(u,pe){return pe - LB.beta*(u-LB.ustar) + LB.mu;}
function buildLab(){
  let g=svgOpen(600,490,'菲利普斯曲线');g+=axesG(PLB,'u','π');
  g+=`<text x=&quot;${PLB.px-6}&quot; y=&quot;${PLB.py-1}&quot; fill=&quot;${_css('--ink-soft')}&quot; font-size=&quot;10&quot; text-anchor=&quot;end&quot;>通胀</text>`;
  // LRPC vertical at u*
  g+=L(mx(LB.ustar,PLB),PLB.py,mx(LB.ustar,PLB),PLB.py+PLB.ph,_css('--lrpc'),2.4,'stroke-dasharray=&quot;7 5&quot;');
  g+=T(mx(LB.ustar,PLB)+6,PLB.py+14,'LRPC',_css('--lrpc'),13,'start',800,true);
  g+=T(mx(LB.ustar,PLB),PLB.py+PLB.ph+16,'u*',_css('--natural'),13,'middle',800,true);
  if(LB.mode==='explore'){
    // SRPC
    const u1=1,u2=11,p1=piAt(u1,LB.pe),p2=piAt(u2,LB.pe);
    g+=L(mx(u1,PLB),my(clamp(p1,-2,16),PLB),mx(u2,PLB),my(clamp(p2,-2,16),PLB),_css('--pc'),3);
    g+=T(mx(2,PLB),my(clamp(piAt(2,LB.pe),-2,16),PLB)-8,'SRPC',_css('--pc'),14,'start',800,true);
    // chosen point
    const pu=piAt(LB.u,LB.pe),px=mx(LB.u,PLB),py=my(clamp(pu,-2,16),PLB);
    g+=L(px,py,px,PLB.py+PLB.ph,_css('--accent'),1.4,'stroke-dasharray=&quot;4 3&quot;');
    g+=L(px,py,PLB.px,py,_css('--accent'),1.4,'stroke-dasharray=&quot;4 3&quot;');
    g+=`<circle cx=&quot;${px}&quot; cy=&quot;${py}&quot; r=&quot;7&quot; fill=&quot;${_css('--accent')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
    g+=T(px+10,py-9,'A',_css('--accent')==='#E0A21A'?'#9a6e00':_css('--accent'),14,'start',800);
    g+=T(px,PLB.py+PLB.ph+16,'u',_css('--ink'),12,'middle',700,true);
    g+=T(PLB.px-7,py+4,'π',_css('--pc'),12,'end',700,true);
    document.getElementById('oU').textContent=LB.u.toFixed(1);
    document.getElementById('oPi').textContent=pu.toFixed(1);
  } else {
    // demo: draw each round's SRPC faded, zigzag path, lrpc points
    const D=LB.demo;
    D.peSeq.forEach((pe,i)=>{
      const u1=1,u2=11,p1=pe-LB.beta*(u1-LB.ustar)+LB.mu,p2=pe-LB.beta*(u2-LB.ustar)+LB.mu;
      const fade=i===D.peSeq.length-1?1:0.32;
      g+=L(mx(u1,PLB),my(clamp(p1,-2,16),PLB),mx(u2,PLB),my(clamp(p2,-2,16),PLB),_css('--pc'),i===D.peSeq.length-1?3:2,`opacity=&quot;${fade}&quot;`);
      g+=T(mx(1.6,PLB),my(clamp(pe-LB.beta*(1.6-LB.ustar)+LB.mu,-2,16),PLB)-6,'SRPC'+(i+1),_css('--pc'),11,'start',700,true);
    });
    // zigzag path
    if(D.path.length>1){let d='M'+mx(D.path[0][0],PLB)+' '+my(clamp(D.path[0][1],-2,16),PLB);
      for(let i=1;i<D.path.length;i++)d+=' L'+mx(D.path[i][0],PLB)+' '+my(clamp(D.path[i][1],-2,16),PLB);
      g+=`<path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--violet')}&quot; stroke-width=&quot;2.4&quot; marker-end=&quot;url(#vio)&quot;/>`;}
    // points
    D.path.forEach((pt,i)=>{const isU=Math.abs(pt[0]-LB.ustar)<0.01;
      g+=`<circle cx=&quot;${mx(pt[0],PLB)}&quot; cy=&quot;${my(clamp(pt[1],-2,16),PLB)}&quot; r=&quot;5&quot; fill=&quot;${isU?_css('--lrpc'):_css('--accent')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.8&quot;/>`;});
    // labels for last F and A
    if(D.path.length){const last=D.path[D.path.length-1];
      g+=T(mx(last[0],PLB)+8,my(clamp(last[1],-2,16),PLB)-6,Math.abs(last[0]-LB.ustar)<0.01?'回到 u*':'F',_css('--ink'),12,'start',800);}
  }
  g+='</svg>';document.getElementById('labHost').innerHTML=g;
  // slider displays
  document.getElementById('vU').textContent=' = '+LB.u.toFixed(1);
  document.getElementById('vPe').textContent=' = '+LB.pe.toFixed(1);
  document.getElementById('vUs').textContent=' = '+LB.ustar.toFixed(1);
  document.getElementById('vB').textContent=' = '+LB.beta.toFixed(1);
  document.getElementById('vMu').textContent=' = '+LB.mu.toFixed(1);
  document.getElementById('vGap').textContent=' = '+LB.gap.toFixed(1);
  document.getElementById('muHint').style.display=LB.mu>0?'block':'none';
}
function renderDemoBox(){
  const D=LB.demo;let html='';
  if(D.round===0){html=`<div class=&quot;ttl&quot;>起点：长期均衡</div><div class=&quot;rd&quot;>u = u* = ${LB.ustar.toFixed(1)}%,π = πᴱ = ${LB.demo.peSeq[0].toFixed(1)}%</div><div style=&quot;font-size:12.5px;color:var(--ink-soft);margin-top:5px&quot;>点「推进一轮」开始。</div>`;}
  else{const cur=D.peSeq[D.peSeq.length-1];const uT=LB.ustar-LB.gap;const piF=cur; // after adapt, at u* pi=cur
    const piPush=(D.peSeq[D.peSeq.length-2]!==undefined?D.peSeq[D.peSeq.length-2]:cur)+LB.beta*LB.gap;
    html=`<div class=&quot;ttl&quot;>第 ${D.round} 轮完成</div>
      <div class=&quot;rd&quot;>① 压低失业到 u=${uT.toFixed(1)}% ⇒ 通胀升到 ${piPush.toFixed(1)}%（点 F）</div>
      <div class=&quot;rd&quot;>② 预期上调 πᴱ←${piPush.toFixed(1)}% ⇒ 失业回 u*,通胀 = ${cur.toFixed(1)}%</div>
      <div style=&quot;font-size:12.5px;color:var(--violet);font-weight:700;margin-top:5px&quot;>u* 处通胀已累积到 ${cur.toFixed(1)}% —— 失业没降下来,只换来更高通胀。</div>`;}
  document.getElementById('demoBox').innerHTML=html;
}
function demoStep(){
  const D=LB.demo;const peCur=D.peSeq[D.peSeq.length-1];
  const uT=LB.ustar-LB.gap;
  const piF=peCur - LB.beta*(uT-LB.ustar) + LB.mu; // = peCur + beta*gap + mu
  // path: from current u* point (or start) -> F(uT,piF) -> back to u*(peNew)
  const peNew=piF; // lambda=1: expectation becomes realized inflation; at u* next pi=peNew
  if(D.round===0){D.path.push([LB.ustar, peCur+LB.mu]);} // start point at u*
  D.path.push([uT,piF]);              // F
  D.path.push([LB.ustar,peNew]);      // back to u*
  D.peSeq.push(peNew);
  D.round++;
  buildLab();renderDemoBox();
}
function demoReset(){LB.demo={round:0,peSeq:[LB.pe],path:[],lrpc:[]};buildLab();renderDemoBox();}

/* ===== 事件 ===== */
document.querySelectorAll('.modetabs .btn').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.modetabs .btn').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  LB.mode=b.dataset.m;
  document.getElementById('exploreCtl').style.display=LB.mode==='explore'?'block':'none';
  document.getElementById('demoCtl').style.display=LB.mode==='demo'?'block':'none';
  if(LB.mode==='demo'){demoReset();}else buildLab();});
function bind(id,key){document.getElementById(id).addEventListener('input',e=>{LB[key]=+e.target.value;
  if(LB.mode==='demo'&amp;&amp;(key==='pe')){LB.demo.peSeq=[LB.pe];}
  buildLab();if(LB.mode==='demo')renderDemoBox();});}
bind('rU','u');bind('rPe','pe');bind('rUs','ustar');bind('rB','beta');bind('rMu','mu');bind('rGap','gap');
document.getElementById('demoStep').onclick=demoStep;
document.getElementById('demoReset').onclick=demoReset;
// init values
document.getElementById('rU').value=LB.u;document.getElementById('rPe').value=LB.pe;document.getElementById('rUs').value=LB.ustar;
document.getElementById('rB').value=LB.beta;document.getElementById('rMu').value=LB.mu;document.getElementById('rGap').value=LB.gap;
buildDerive();buildLab();
</script>

<body>

<header class=&quot;hero&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;eyebrow&quot;>微观十大核心图 · 第一张</div>
  <h1>推导 <em>供求均衡图</em><br>价格如何配置稀缺资源</h1>
  <p class=&quot;lead&quot;>向右下倾的 <b style=&quot;color:var(--demand)&quot;>需求 D</b> 与向右上倾的 <b style=&quot;color:var(--supply)&quot;>供给 S</b> 相交,定出均衡 <span class=&quot;math&quot;>(P*, Q*)</span>。这一张图就装下了:供求移动、弹性、税收归宿、消费者/生产者剩余、价格管制——本课最高频的考点。默认参数取自你试卷 <span class=&quot;math&quot;>Qd=10−5P, Qs=−5+10P</span>。</p>
  <svg class=&quot;mini&quot; viewBox=&quot;0 0 230 180&quot;>
    <line x1=&quot;26&quot; y1=&quot;160&quot; x2=&quot;226&quot; y2=&quot;160&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot;/>
    <line x1=&quot;26&quot; y1=&quot;160&quot; x2=&quot;26&quot; y2=&quot;12&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot;/>
    <line x1=&quot;40&quot; y1=&quot;30&quot; x2=&quot;200&quot; y2=&quot;150&quot; stroke=&quot;#B3123A&quot; stroke-width=&quot;3&quot;/>
    <line x1=&quot;40&quot; y1=&quot;150&quot; x2=&quot;200&quot; y2=&quot;34&quot; stroke=&quot;#1B3A8C&quot; stroke-width=&quot;3&quot;/>
    <circle cx=&quot;120&quot; cy=&quot;92&quot; r=&quot;6&quot; fill=&quot;#E0A21A&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>
  </svg>
</div></header>

<!-- 1 GLOSSARY -->
<section id=&quot;gloss&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>01</span><h2>字母词典：中英文全称 + 经济含义</h2></div>
  <p class=&quot;sub&quot;>在 <span class=&quot;math&quot;>(Q, P)</span> 平面里:横轴数量、纵轴价格。需求侧、供给侧、弹性、福利、政策五组术语,先认全。</p>
  <div class=&quot;gloss&quot; id=&quot;glossGrid&quot;></div>
</div></section>

<!-- 2 EQUILIBRIUM -->
<section id=&quot;eq&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>02</span><h2>均衡的形成与移动</h2></div>
  <p class=&quot;sub&quot;>供求相等定出 <span class=&quot;math&quot;>(P*, Q*)</span>。区分<b>需求量变动</b>(沿曲线滑动,因价格)与<b>需求变动</b>(整条移动,因收入/偏好/相关品价等)。点按钮移动 D、S,看新均衡,并对照&quot;市场变化总结表&quot;——注意有些格子结果<b>不确定</b>。</p>
  <div class=&quot;legend&quot;>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--demand)&quot;></i>需求 D</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--supply)&quot;></i>供给 S</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--eq)&quot;></i>均衡 E</span>
  </div>
  <div class=&quot;stage&quot;>
    <div class=&quot;figbox&quot;><div id=&quot;eqHost&quot;></div></div>
    <div class=&quot;controls&quot;>
      <div class=&quot;step-title&quot;>移动曲线,观察 P*、Q*</div>
      <div class=&quot;btnrow&quot;><span class=&quot;lab&quot;>需求 D：</span>
        <button class=&quot;btn&quot; data-d=&quot;1&quot;>增加 →</button>
        <button class=&quot;btn&quot; data-d=&quot;0&quot;>复位</button>
        <button class=&quot;btn&quot; data-d=&quot;-1&quot;>减少 ←</button></div>
      <div class=&quot;btnrow&quot;><span class=&quot;lab&quot;>供给 S：</span>
        <button class=&quot;btn&quot; data-s=&quot;1&quot;>增加 →</button>
        <button class=&quot;btn&quot; data-s=&quot;0&quot;>复位</button>
        <button class=&quot;btn&quot; data-s=&quot;-1&quot;>减少 ←</button></div>
      <div class=&quot;readout&quot;>
        <div class=&quot;ro p&quot;><div class=&quot;k&quot;>均衡价格 P*</div><div class=&quot;val&quot; id=&quot;eqP&quot;></div></div>
        <div class=&quot;ro q&quot;><div class=&quot;k&quot;>均衡数量 Q*</div><div class=&quot;val&quot; id=&quot;eqQ&quot;></div></div>
      </div>
      <div class=&quot;interp&quot; id=&quot;eqInterp&quot;></div>
      <table class=&quot;tbl&quot; id=&quot;eqTable&quot;>
        <tr><th>　</th><th>供给不变</th><th>供给增加</th><th>供给减少</th></tr>
        <tr><td class=&quot;l&quot;>需求不变</td><td data-cell=&quot;0,0&quot;>P— Q—</td><td data-cell=&quot;0,1&quot;>P↓ Q↑</td><td data-cell=&quot;0,-1&quot;>P↑ Q↓</td></tr>
        <tr><td class=&quot;l&quot;>需求增加</td><td data-cell=&quot;1,0&quot;>P↑ Q↑</td><td data-cell=&quot;1,1&quot;>P? Q↑</td><td data-cell=&quot;1,-1&quot;>P↑ Q?</td></tr>
        <tr><td class=&quot;l&quot;>需求减少</td><td data-cell=&quot;-1,0&quot;>P↓ Q↓</td><td data-cell=&quot;-1,1&quot;>P↓ Q?</td><td data-cell=&quot;-1,-1&quot;>P? Q↓</td></tr>
      </table>
      <div class=&quot;note&quot;><b>口诀：</b>两条曲线移动方向对 <b>价格</b>影响相反时,价格方向定、数量不定;对 <b>数量</b>影响相反时,数量方向定、价格不定。</div>
    </div>
  </div>
</div></section>

<!-- 3 ELASTICITY -->
<section id=&quot;elas&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>03</span><h2>弹性沿曲线变化 · 与总收益的关系</h2></div>
  <p class=&quot;sub&quot;>线性需求曲线<b>斜率固定,但弹性不固定</b>:从上到下,<span class=&quot;math&quot;>E</span> 由大变小。点弹性 <span class=&quot;math&quot;>E = (dQ/dP)·(P/Q)</span> 取绝对值。拖动一点观察 <span class=&quot;math&quot;>E</span> 与<b>总收益 TR=P·Q</b> 的关系——这是&quot;薄利多销是否划算&quot;的判据。</p>
  <div class=&quot;stage&quot;>
    <div class=&quot;figbox&quot;><div id=&quot;elHost&quot;></div></div>
    <div class=&quot;controls&quot;>
      <div class=&quot;step-title&quot;>拖动需求线上的点</div>
      <div class=&quot;step-body&quot;>用自含示例 <span class=&quot;math&quot;>P = 10 − Q</span>。中点 <span class=&quot;math&quot;>E=1</span>;上半段 <span class=&quot;key&quot;>E&amp;gt;1 富有弹性</span>,降价 → 总收益<b>增加</b>;下半段 <span class=&quot;key&quot;>E&amp;lt;1 缺乏弹性</span>,降价 → 总收益<b>减少</b>。</div>
      <div class=&quot;sliders&quot;>
        <div class=&quot;slider&quot;><label>数量 <span class=&quot;math&quot;>Q</span><span class=&quot;v&quot; id=&quot;vQ&quot;></span></label><input type=&quot;range&quot; id=&quot;rQ&quot; min=&quot;0.5&quot; max=&quot;9.5&quot; step=&quot;0.1&quot;></div>
        <div class=&quot;readout&quot;>
          <div class=&quot;ro p&quot;><div class=&quot;k&quot;>价格 P</div><div class=&quot;val&quot; id=&quot;elP&quot;></div></div>
          <div class=&quot;ro a&quot;><div class=&quot;k&quot;>总收益 TR=P·Q</div><div class=&quot;val&quot; id=&quot;elTR&quot;></div></div>
        </div>
        <div id=&quot;elBadge&quot; class=&quot;badge bdg-e&quot;>—</div>
        <div class=&quot;interp&quot; id=&quot;elInterp&quot;></div>
      </div>
      <table class=&quot;tbl&quot;>
        <tr><th>弹性 Eₚ</th><th>价格</th><th>需求量</th><th>总收益</th></tr>
        <tr><td class=&quot;l up&quot;>Eₚ&amp;gt;1</td><td>↓</td><td>↑更多</td><td class=&quot;up&quot;>↑</td></tr>
        <tr><td class=&quot;l qq&quot;>Eₚ=1</td><td>↓</td><td>同比例↑</td><td class=&quot;qq&quot;>不变(最大)</td></tr>
        <tr><td class=&quot;l dn&quot;>Eₚ&amp;lt;1</td><td>↓</td><td>↑较少</td><td class=&quot;dn&quot;>↓</td></tr>
      </table>
    </div>
  </div>
</div></section>

<!-- 4 TAX -->
<section id=&quot;tax&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>04</span><h2>税收归宿 · 消费者/生产者剩余 · 无谓损失</h2></div>
  <p class=&quot;sub&quot;>对每单位征从量税 <span class=&quot;math&quot;>t</span>,供给上移 <span class=&quot;math&quot;>t</span>,买卖价之间裂开<b>税楔</b>。<span class=&quot;key&quot;>谁的弹性小,谁承担更多税负</span>。下面用你试卷的 <span class=&quot;math&quot;>Qd=10−5P, Qs=−5+10P</span>(均衡 P*=1, Q*=5;Ed=1, Es=2),拖税率看税负分摊、税收与无谓损失。</p>
  <div class=&quot;legend&quot;>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--cs)&quot;></i>消费者剩余</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--ps)&quot;></i>生产者剩余</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--dwl)&quot;></i>无谓损失</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--tax)&quot;></i>税收</span>
  </div>
  <div class=&quot;stage&quot;>
    <div class=&quot;figbox&quot;><div id=&quot;taxHost&quot;></div></div>
    <div class=&quot;controls&quot;>
      <div class=&quot;step-title&quot;>税率与需求弹性,如何改变税负</div>
      <div class=&quot;sliders&quot;>
        <div class=&quot;slider&quot;><label>从量税 <span class=&quot;math&quot;>t</span>（元/单位）<span class=&quot;v&quot; id=&quot;vT&quot;></span></label><input type=&quot;range&quot; id=&quot;rT&quot; min=&quot;0&quot; max=&quot;1.5&quot; step=&quot;0.05&quot;></div>
        <div class=&quot;slider&quot;><label>需求斜率 <span class=&quot;math&quot;>b</span>（越小越陡＝越缺乏弹性）<span class=&quot;v&quot; id=&quot;vB&quot;></span></label><input type=&quot;range&quot; id=&quot;rB&quot; min=&quot;2&quot; max=&quot;12&quot; step=&quot;0.5&quot;></div>
        <div class=&quot;readout&quot;>
          <div class=&quot;ro p&quot;><div class=&quot;k&quot;>买方付价 P_b</div><div class=&quot;val&quot; id=&quot;txPb&quot;></div></div>
          <div class=&quot;ro q&quot;><div class=&quot;k&quot;>卖方得价 P_s</div><div class=&quot;val&quot; id=&quot;txPs&quot;></div></div>
          <div class=&quot;ro b&quot;><div class=&quot;k&quot;>消费者承担</div><div class=&quot;val&quot; id=&quot;txConS&quot;></div></div>
          <div class=&quot;ro b&quot;><div class=&quot;k&quot;>生产者承担</div><div class=&quot;val&quot; id=&quot;txProS&quot;></div></div>
          <div class=&quot;ro a&quot;><div class=&quot;k&quot;>税收总额 T</div><div class=&quot;val&quot; id=&quot;txRev&quot;></div></div>
          <div class=&quot;ro p&quot;><div class=&quot;k&quot;>无谓损失 DWL</div><div class=&quot;val&quot; id=&quot;txDwl&quot;></div></div>
        </div>
        <div class=&quot;interp&quot; id=&quot;txInterp&quot;></div>
      </div>
      <div class=&quot;note&quot;><b>试卷口径：</b><span class=&quot;math&quot;>t=1</span> 时买方付 5/3、卖方得 2/3,消费者承担 2/3、生产者承担 1/3,税收 T=5/3。比例正好等于 <span class=&quot;math&quot;>Es : Ed = 2 : 1</span> —— 弹性小的需求方承担更多。</div>
    </div>
  </div>
</div></section>

<!-- 5 PRICE CONTROL -->
<section id=&quot;ctrl&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>05</span><h2>价格管制：限价与支持价格</h2></div>
  <p class=&quot;sub&quot;><b>最高限价(限制价格)</b>低于均衡 → 需求&amp;gt;供给 → <b>短缺</b>(打车难、排队、寻租);<b>最低限价(支持价格)</b>高于均衡 → 供给&amp;gt;需求 → <b>过剩</b>(最低工资下的失业、农产品过剩)。拖动管制价,看缺口。</p>
  <div class=&quot;stage&quot;>
    <div class=&quot;figbox&quot;><div id=&quot;ctrlHost&quot;></div></div>
    <div class=&quot;controls&quot;>
      <div class=&quot;btnrow&quot;><span class=&quot;lab&quot;>类型：</span>
        <button class=&quot;btn on&quot; data-mode=&quot;ceiling&quot;>最高限价</button>
        <button class=&quot;btn&quot; data-mode=&quot;floor&quot;>最低限价</button></div>
      <div class=&quot;sliders&quot;>
        <div class=&quot;slider&quot;><label>管制价格 <span class=&quot;math&quot;>P_c</span><span class=&quot;v&quot; id=&quot;vPc&quot;></span></label><input type=&quot;range&quot; id=&quot;rPc&quot; min=&quot;0.3&quot; max=&quot;1.8&quot; step=&quot;0.05&quot;></div>
        <div class=&quot;readout&quot;>
          <div class=&quot;ro q&quot;><div class=&quot;k&quot;>需求量 Qd</div><div class=&quot;val&quot; id=&quot;cQd&quot;></div></div>
          <div class=&quot;ro q&quot;><div class=&quot;k&quot;>供给量 Qs</div><div class=&quot;val&quot; id=&quot;cQs&quot;></div></div>
        </div>
        <div id=&quot;cBadge&quot; class=&quot;badge bdg-i&quot;>—</div>
        <div class=&quot;interp&quot; id=&quot;cInterp&quot;></div>
      </div>
      <div class=&quot;note&quot; id=&quot;ctrlNote&quot;></div>
    </div>
  </div>
</div></section>

<footer><div class=&quot;wrap&quot;>交互推导工具 · 微观十大核心图之一 · 依《经济学原理（微观部分）》课程口径编制。默认参数取自课程练习题。</div></footer>

<script>
/* ===== 词典 ===== */
const GLOSS=[
 [&quot;P&quot;,&quot;价格&quot;,&quot;Price&quot;,&quot;纵轴。市场上单位商品的价格。&quot;,&quot;p-core&quot;],
 [&quot;Q&quot;,&quot;数量&quot;,&quot;Quantity&quot;,&quot;横轴。需求量或供给量。&quot;,&quot;p-core&quot;],
 [&quot;D&quot;,&quot;需求曲线&quot;,&quot;Demand&quot;,&quot;各价格下愿买的量,<b>向右下倾</b>(需求规律)。Qd=a−bP。&quot;,&quot;p-core&quot;],
 [&quot;S&quot;,&quot;供给曲线&quot;,&quot;Supply&quot;,&quot;各价格下愿卖的量,<b>向右上倾</b>。Qs=c+dP。&quot;,&quot;p-core&quot;],
 [&quot;E&quot;,&quot;均衡点&quot;,&quot;Equilibrium&quot;,&quot;D∩S。定出 P*、Q*,供求相等、市场出清。&quot;,&quot;p-core&quot;],
 [&quot;P* / Q*&quot;,&quot;均衡价格 / 数量&quot;,&quot;Equilibrium price / quantity&quot;,&quot;P*=(a−c)/(b+d),Q*=a−bP*。&quot;,&quot;p-core&quot;],
 [&quot;Ed&quot;,&quot;需求价格弹性&quot;,&quot;Price elasticity of demand&quot;,&quot;需求量对价格的敏感度,Ed=|(dQ/dP)·P/Q|。&amp;gt;1 富有弹性。&quot;,&quot;p-el&quot;],
 [&quot;Es&quot;,&quot;供给价格弹性&quot;,&quot;Price elasticity of supply&quot;,&quot;供给量对价格的敏感度。&quot;,&quot;p-el&quot;],
 [&quot;TR&quot;,&quot;总收益&quot;,&quot;Total revenue&quot;,&quot;TR=P·Q。E&amp;gt;1 时降价增收;E&amp;lt;1 时降价减收。&quot;,&quot;p-el&quot;],
 [&quot;CS&quot;,&quot;消费者剩余&quot;,&quot;Consumer surplus&quot;,&quot;愿付价 − 实付价的累加,需求线下、价格线上的三角形。&quot;,&quot;p-wel&quot;],
 [&quot;PS&quot;,&quot;生产者剩余&quot;,&quot;Producer surplus&quot;,&quot;实收价 − 愿供价,价格线下、供给线上的三角形。&quot;,&quot;p-wel&quot;],
 [&quot;TS&quot;,&quot;社会总剩余&quot;,&quot;Total surplus&quot;,&quot;TS=CS+PS。完全竞争均衡时最大(帕累托最优)。&quot;,&quot;p-wel&quot;],
 [&quot;DWL&quot;,&quot;无谓损失&quot;,&quot;Deadweight loss&quot;,&quot;税收/管制/垄断造成的、无人获得的福利净损失三角形。&quot;,&quot;p-wel&quot;],
 [&quot;t&quot;,&quot;从量税&quot;,&quot;Per-unit tax&quot;,&quot;每单位征定额税,使供给上移 t,买卖价裂开税楔。&quot;,&quot;p-pol&quot;],
 [&quot;税收归宿&quot;,&quot;tax incidence&quot;,&quot;Tax incidence&quot;,&quot;税负实际由谁承担,<b>与法定纳税人无关</b>,弹性小的一方承担多。&quot;,&quot;p-pol&quot;],
 [&quot;限制/支持价格&quot;,&quot;price ceiling / floor&quot;,&quot;Price ceiling / floor&quot;,&quot;最高限价→短缺;最低限价→过剩。&quot;,&quot;p-pol&quot;],
 [&quot;替代/互补品&quot;,&quot;substitutes / complements&quot;,&quot;Substitutes / complements&quot;,&quot;交叉弹性&amp;gt;0 为替代品,&amp;lt;0 为互补品(移动需求曲线)。&quot;,&quot;p-core&quot;],
];
(function(){const g=document.getElementById('glossGrid');
 GLOSS.forEach(([s,cn,en,d,p])=>{const e=document.createElement('div');e.className='card';
  const col=p==='p-core'?'var(--demand)':p==='p-el'?'#9a6e00':p==='p-wel'?'var(--ps)':'var(--violet)';
  e.innerHTML=`<span class=&quot;sym&quot; style=&quot;color:${col}&quot;>${s}</span><span class=&quot;cn&quot;>${cn}</span><div class=&quot;en&quot;>${en}</div><div class=&quot;desc&quot;>${d}</div><span class=&quot;pill ${p}&quot;>${p==='p-core'?'供求/坐标':p==='p-el'?'弹性':p==='p-wel'?'福利':'政策'}</span>`;
  g.appendChild(e);});})();

/* ===== 绘图基元 ===== */
function _css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function mx(v,P){return P.px+(v-P.xMin)/(P.xMax-P.xMin)*P.pw;}
function my(v,P){return P.py+P.ph-(v-P.yMin)/(P.yMax-P.yMin)*P.ph;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function L(x1,y1,x2,y2,c,w,ex=''){return `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; ${ex}/>`;}
function T(x,y,t,c,s=13,a='start',w=600,it=false){return `<text x=&quot;${x}&quot; y=&quot;${y}&quot; fill=&quot;${c}&quot; font-size=&quot;${s}&quot; text-anchor=&quot;${a}&quot; font-weight=&quot;${w}&quot; ${it?'font-style=&quot;italic&quot; font-family=&quot;Georgia,serif&quot;':'font-family=&quot;PingFang SC,sans-serif&quot;'}>${t}</text>`;}
function POLY(pts,fill,op){return `<polygon points=&quot;${pts.map(p=>p[0]+','+p[1]).join(' ')}&quot; fill=&quot;${fill}&quot; opacity=&quot;${op}&quot;/>`;}
function svgOpen(w,h,label){return `<svg class=&quot;fig&quot; viewBox=&quot;0 0 ${w} ${h}&quot; role=&quot;img&quot; aria-label=&quot;${label}&quot;><defs>
  <marker id=&quot;ar&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;#192233&quot;/></marker></defs>`;}
function axesG(P,xlab,ylab){
  const Ey=P.py+P.ph,Ex=P.px+P.pw;let g='';
  for(let i=1;i<=4;i++){const gx=P.px+P.pw*i/5,gy=P.py+P.ph*i/5;g+=L(gx,P.py,gx,Ey,'var(--grid)',1);g+=L(P.px,gy,Ex,gy,'var(--grid)',1);}
  g+=L(P.px,Ey,Ex+12,Ey,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=`<line x1=&quot;${P.px}&quot; y1=&quot;${Ey}&quot; x2=&quot;${P.px}&quot; y2=&quot;${P.py-12}&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/>`;
  g+=T(P.px-7,P.py-13,ylab,_css('--ink'),16,'end',800,true);
  g+=T(Ex+16,Ey+5,xlab,_css('--ink'),16,'start',800,true);
  g+=T(P.px-9,Ey+16,'O',_css('--ink'),13,'end',700);
  return g;
}

/* ===== 第二节：均衡与移动 ===== */
const EQ={a:10,b:5,c:-5,d:10,dS:0,sS:0};
function eqSolve(a,b,c,d){const P=(a-c)/(b+d);return {P,Q:a-b*P};}
function buildEq(){
  const a=EQ.a+EQ.dS*4, c=EQ.c+EQ.sS*4, b=EQ.b, d=EQ.d;
  const P={px:58,py:26,pw:380,ph:300,xMin:0,xMax:13,yMin:0,yMax:3};
  let g=svgOpen(470,370,'供求均衡');g+=axesG(P,'Q','P');
  // base (faded) D,S
  const baseDx1=0,baseDp1=(EQ.a-0)/EQ.b, baseDx2=EQ.a,baseDp2=0; // demand P=(a-Q)/b
  // current Demand: P=(a-Q)/b  -> at Q=0 P=a/b; at P=0 Q=a
  const dQ0=0,dP0=a/EQ.b, dQ1=Math.min(a,13),dP1=(a-dQ1)/EQ.b;
  // current Supply: P=(Q-c)/d -> at Q=0 P=-c/d; cap
  const sQ0=Math.max(0,c),sP0=Math.max(0,(0-c)/d), sQ1=13,sP1=(13-c)/d;
  // faded baseline
  if(EQ.dS!==0){g+=L(mx(0,P),my(EQ.a/EQ.b,P),mx(EQ.a,P),my(0,P),_css('--demand'),1.5,'opacity=&quot;0.3&quot; stroke-dasharray=&quot;5 4&quot;');}
  if(EQ.sS!==0){g+=L(mx(Math.max(0,EQ.c),P),my(Math.max(0,-EQ.c/EQ.d),P),mx(13,P),my((13-EQ.c)/EQ.d,P),_css('--supply'),1.5,'opacity=&quot;0.3&quot; stroke-dasharray=&quot;5 4&quot;');}
  // current lines
  g+=L(mx(dQ0,P),my(dP0,P),mx(dQ1,P),my(clamp(dP1,0,3),P),_css('--demand'),3);
  g+=L(mx(sQ0,P),my(clamp(sP0,0,3),P),mx(sQ1,P),my(clamp(sP1,0,3),P),_css('--supply'),3);
  g+=T(mx(dQ1,P)-2,my(clamp(dP1,0,3),P)-6,'D',_css('--demand'),15,'end',800,true);
  g+=T(mx(13,P)-2,my(clamp(sP1,0,3),P)-6,'S',_css('--supply'),15,'end',800,true);
  // eq
  const e=eqSolve(a,b,c,d);
  const ex=mx(e.Q,P),ey=my(e.P,P);
  g+=L(ex,ey,ex,P.py+P.ph,_css('--guide'),1.5,'stroke-dasharray=&quot;5 4&quot;');
  g+=L(ex,ey,P.px,ey,_css('--guide'),1.5,'stroke-dasharray=&quot;5 4&quot;');
  g+=`<circle cx=&quot;${ex}&quot; cy=&quot;${ey}&quot; r=&quot;7&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
  g+=T(ex+10,ey-9,'E',_css('--eq')==='#E0A21A'?'#9a6e00':_css('--eq'),14,'start',800);
  g+=T(ex,P.py+P.ph+16,'Q*',_css('--ink'),12,'middle',800,true);
  g+=T(P.px-7,ey+4,'P*',_css('--guide'),12,'end',800,true);
  g+='</svg>';document.getElementById('eqHost').innerHTML=g;
  document.getElementById('eqP').textContent=e.P.toFixed(2);
  document.getElementById('eqQ').textContent=e.Q.toFixed(2);
  // table highlight + interp
  document.querySelectorAll('#eqTable td[data-cell]').forEach(td=>td.classList.remove('hot'));
  const cell=document.querySelector(`#eqTable td[data-cell=&quot;${EQ.dS},${EQ.sS}&quot;]`);if(cell)cell.classList.add('hot');
  let txt='';const dd=EQ.dS,ss=EQ.sS;
  if(dd===0&amp;&amp;ss===0)txt='初始均衡。移动 D 或 S 看变化。';
  else if(dd!==0&amp;&amp;ss!==0&amp;&amp;dd===ss)txt='两曲线同向移动:数量方向确定,价格<b>不确定</b>(取决于两者幅度)。';
  else if(dd!==0&amp;&amp;ss!==0&amp;&amp;dd!==ss)txt='两曲线反向移动:价格方向确定,数量<b>不确定</b>。';
  else txt='只移动一条曲线:价格、数量方向都确定。';
  document.getElementById('eqInterp').innerHTML=txt;
}

/* ===== 第三节：弹性 ===== */
const EL={Q:3};
function buildEl(){
  const A=10; // P=10-Q
  const P={px:58,py:26,pw:380,ph:300,xMin:0,xMax:11,yMin:0,yMax:11};
  let g=svgOpen(470,370,'弹性');g+=axesG(P,'Q','P');
  // demand P=10-Q
  g+=L(mx(0,P),my(A,P),mx(A,P),my(0,P),_css('--demand'),3);
  g+=T(mx(A,P)-4,my(0,P)-8,'D',_css('--demand'),15,'end',800,true);
  // midpoint E=1
  g+=`<circle cx=&quot;${mx(5,P)}&quot; cy=&quot;${my(5,P)}&quot; r=&quot;4&quot; fill=&quot;#fff&quot; stroke=&quot;${_css('--ink-faint')}&quot; stroke-width=&quot;2&quot;/>`;
  g+=T(mx(5,P)+8,my(5,P)-4,'E=1',_css('--ink-faint'),11,'start',700);
  // TR rectangle
  const q=EL.Q,p=A-q;
  g+=POLY([[mx(0,P),my(p,P)],[mx(q,P),my(p,P)],[mx(q,P),my(0,P)],[mx(0,P),my(0,P)]],_css('--ps'),0.13);
  // point
  const px=mx(q,P),py=my(p,P);
  g+=L(px,py,px,P.py+P.ph,_css('--eq'),1.4,'stroke-dasharray=&quot;4 3&quot;');
  g+=L(px,py,P.px,py,_css('--eq'),1.4,'stroke-dasharray=&quot;4 3&quot;');
  g+=`<circle cx=&quot;${px}&quot; cy=&quot;${py}&quot; r=&quot;7&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
  g+=T(px,P.py+P.ph+16,'Q',_css('--ink'),12,'middle',700,true);
  g+=T(P.px-7,py+4,'P',_css('--demand'),12,'end',700,true);
  g+=T(mx(q/2,P),my(p/2,P),'TR',_css('--ps'),13,'middle',800,true);
  g+='</svg>';document.getElementById('elHost').innerHTML=g;
  const E=p/q, TR=p*q;
  document.getElementById('vQ').textContent=' = '+q.toFixed(1);
  document.getElementById('elP').textContent=p.toFixed(1);
  document.getElementById('elTR').textContent=TR.toFixed(1);
  const bd=document.getElementById('elBadge'),it=document.getElementById('elInterp');
  if(Math.abs(E-1)<0.06){bd.className='badge bdg-1';bd.textContent='E ≈ 1 单位弹性(TR 最大)';it.innerHTML='此处总收益最大;价格再动 TR 几乎不变。';}
  else if(E>1){bd.className='badge bdg-e';bd.textContent='E = '+E.toFixed(2)+' &amp;gt; 1 富有弹性';it.innerHTML='量对价格敏感:<b>降价 → 总收益上升</b>,薄利多销划算。';}
  else{bd.className='badge bdg-i';bd.textContent='E = '+E.toFixed(2)+' &amp;lt; 1 缺乏弹性';it.innerHTML='量对价格不敏感:<b>降价 → 总收益下降</b>,涨价反而增收。';}
}

/* ===== 第四节：税收 ===== */
const TX={a:10,b:5,c:-5,d:10,t:1};
function buildTax(){
  const a=TX.a,b=TX.b,c=TX.c,d=TX.d,t=TX.t;
  const P0=(a-c)/(b+d), Q0=a-b*P0;
  const Pb=(a-c+d*t)/(b+d), Ps=Pb-t, Q1=a-b*Pb;
  const consBear=d/(b+d), prodBear=b/(b+d);
  const rev=t*Q1, dwl=0.5*t*(Q0-Q1);
  const csP0=a/b, psP0=Math.max(0,-c/d);
  const PL={px:58,py:26,pw:380,ph:300,xMin:0,xMax:12,yMin:0,yMax:3};
  let g=svgOpen(470,370,'税收归宿');g+=axesG(PL,'Q','P');
  // Demand P=(a-Q)/b
  g+=L(mx(0,PL),my(a/b,PL),mx(Math.min(a,12),PL),my(clamp((a-Math.min(a,12))/b,0,3),PL),_css('--demand'),3);
  // Supply P=(Q-c)/d
  g+=L(mx(Math.max(0,c),PL),my(clamp(-c/d,0,3),PL),mx(12,PL),my(clamp((12-c)/d,0,3),PL),_css('--supply'),2.6);
  // Supply+tax P=(Q-c)/d + t
  g+=L(mx(Math.max(0,c),PL),my(clamp(-c/d+t,0,3),PL),mx(12,PL),my(clamp((12-c)/d+t,0,3),PL),_css('--tax'),2.6,'stroke-dasharray=&quot;6 4&quot;');
  g+=T(mx(11.5,PL),my(clamp((12-c)/d+t,0,3),PL)-4,'S+t',_css('--tax'),12,'end',800,true);
  g+=T(mx(11.5,PL),my(clamp((12-c)/d,0,3),PL)+12,'S',_css('--supply'),13,'end',800,true);
  g+=T(mx(a,PL)-4,my(0,PL)-8,'D',_css('--demand'),13,'end',800,true);
  // surplus polygons (after tax): CS above Pb under D; PS below Ps above S
  g+=POLY([[mx(0,PL),my(a/b,PL)],[mx(0,PL),my(Pb,PL)],[mx(Q1,PL),my(Pb,PL)]],_css('--cs'),0.16);
  g+=POLY([[mx(0,PL),my(Ps,PL)],[mx(0,PL),my(psP0,PL)],[mx(Q1,PL),my(Ps,PL)]],_css('--ps'),0.16);
  // tax revenue rectangle (Ps..Pb x 0..Q1)
  g+=POLY([[mx(0,PL),my(Pb,PL)],[mx(Q1,PL),my(Pb,PL)],[mx(Q1,PL),my(Ps,PL)],[mx(0,PL),my(Ps,PL)]],_css('--tax'),0.18);
  // DWL triangle (Q1..Q0 between D and S)
  g+=POLY([[mx(Q1,PL),my(Pb,PL)],[mx(Q1,PL),my(Ps,PL)],[mx(Q0,PL),my(P0,PL)]],_css('--dwl'),0.30);
  // guides at Pb, Ps, Q1
  g+=L(mx(Q1,PL),my(Pb,PL),mx(Q1,PL),PL.py+PL.ph,'#192233',1.1,'stroke-dasharray=&quot;4 3&quot;');
  g+=`<circle cx=&quot;${mx(Q1,PL)}&quot; cy=&quot;${my(Pb,PL)}&quot; r=&quot;5&quot; fill=&quot;${_css('--demand')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
  g+=`<circle cx=&quot;${mx(Q1,PL)}&quot; cy=&quot;${my(Ps,PL)}&quot; r=&quot;5&quot; fill=&quot;${_css('--supply')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
  g+=T(PL.px-7,my(Pb,PL)+4,'P_b',_css('--demand'),11,'end',700,true);
  g+=T(PL.px-7,my(Ps,PL)+4,'P_s',_css('--supply'),11,'end',700,true);
  g+=T(mx(Q1,PL),PL.py+PL.ph+15,'Q₁',_css('--ink'),11,'middle',700,true);
  g+='</svg>';document.getElementById('taxHost').innerHTML=g;
  document.getElementById('vT').textContent=' = '+t.toFixed(2);
  document.getElementById('vB').textContent=' = '+b.toFixed(1);
  document.getElementById('txPb').textContent=Pb.toFixed(2);
  document.getElementById('txPs').textContent=Ps.toFixed(2);
  document.getElementById('txConS').textContent=(consBear*100).toFixed(0)+'%';
  document.getElementById('txProS').textContent=(prodBear*100).toFixed(0)+'%';
  document.getElementById('txRev').textContent=rev.toFixed(2);
  document.getElementById('txDwl').textContent=dwl.toFixed(2);
  const Ed=b*P0/Q0, Es=d*P0/Q0;
  document.getElementById('txInterp').innerHTML=`当前 <span class=&quot;math&quot;>Ed=${Ed.toFixed(2)}</span>、<span class=&quot;math&quot;>Es=${Es.toFixed(2)}</span>。`+(b<TX.d?'需求更<b>缺乏弹性</b>,故<b>消费者</b>承担更多税负。':b>TX.d?'需求更<b>富有弹性</b>,故<b>生产者</b>承担更多税负。':'两侧弹性相等,税负各半。');
}

/* ===== 第五节：价格管制 ===== */
const CT={a:10,b:5,c:-5,d:10,Pc:0.7,mode:'ceiling'};
function buildCtrl(){
  const a=CT.a,b=CT.b,c=CT.c,d=CT.d,Pc=CT.Pc;
  const P0=(a-c)/(b+d), Q0=a-b*P0;
  const Qd=a-b*Pc, Qs=c+d*Pc;
  const PL={px:58,py:26,pw:380,ph:300,xMin:0,xMax:12,yMin:0,yMax:3};
  let g=svgOpen(470,370,'价格管制');g+=axesG(PL,'Q','P');
  g+=L(mx(0,PL),my(a/b,PL),mx(Math.min(a,12),PL),my(0,PL),_css('--demand'),3);
  g+=L(mx(Math.max(0,c),PL),my(clamp(-c/d,0,3),PL),mx(12,PL),my(clamp((12-c)/d,0,3),PL),_css('--supply'),3);
  g+=T(mx(a,PL)-4,my(0,PL)-8,'D',_css('--demand'),13,'end',800,true);
  g+=T(mx(11.6,PL),my(clamp((12-c)/d,0,3),PL)-6,'S',_css('--supply'),13,'end',800,true);
  // eq dot
  g+=`<circle cx=&quot;${mx(Q0,PL)}&quot; cy=&quot;${my(P0,PL)}&quot; r=&quot;5&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
  g+=T(mx(Q0,PL)+8,my(P0,PL)-6,'E',_css('--eq')==='#E0A21A'?'#9a6e00':_css('--eq'),12,'start',800);
  // control price line
  g+=L(PL.px,my(Pc,PL),mx(12,PL),my(Pc,PL),_css('--violet'),2.4,'stroke-dasharray=&quot;7 4&quot;');
  g+=T(PL.px-7,my(Pc,PL)+4,'P_c',_css('--violet'),12,'end',800,true);
  // mark Qd, Qs on the line
  g+=`<circle cx=&quot;${mx(Qd,PL)}&quot; cy=&quot;${my(Pc,PL)}&quot; r=&quot;5&quot; fill=&quot;${_css('--demand')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
  g+=`<circle cx=&quot;${mx(Qs,PL)}&quot; cy=&quot;${my(Pc,PL)}&quot; r=&quot;5&quot; fill=&quot;${_css('--supply')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
  g+=T(mx(Qd,PL),PL.py+PL.ph+15,'Qd',_css('--demand'),11,'middle',700,true);
  g+=T(mx(Qs,PL),PL.py+PL.ph+15,'Qs',_css('--supply'),11,'middle',700,true);
  // gap bracket
  const lo=Math.min(Qd,Qs),hi=Math.max(Qd,Qs);
  g+=L(mx(lo,PL),my(Pc,PL),mx(hi,PL),my(Pc,PL),_css('--dwl'),5,'opacity=&quot;0.35&quot;');
  g+='</svg>';document.getElementById('ctrlHost').innerHTML=g;
  document.getElementById('vPc').textContent=' = '+Pc.toFixed(2);
  document.getElementById('cQd').textContent=Qd.toFixed(2);
  document.getElementById('cQs').textContent=Qs.toFixed(2);
  const bd=document.getElementById('cBadge'),it=document.getElementById('cInterp'),note=document.getElementById('ctrlNote');
  if(CT.mode==='ceiling'){
    if(Pc<P0){const sh=(Qd-Qs);bd.className='badge bdg-i';bd.textContent='短缺 '+sh.toFixed(2);it.innerHTML='限价低于均衡:需求 &amp;gt; 供给,出现<b>短缺</b>。';
      note.innerHTML='<b>出租车限价案例：</b>限价低于均衡 → 想打车的人多、愿出车的司机少 → 打车更难,并引发排队、寻租等非价格竞争。';}
    else{bd.className='badge bdg-1';bd.textContent='不起作用';it.innerHTML='限价高于均衡 → <b>不具约束力</b>,市场仍在 E 成交。';note.innerHTML='最高限价只有<b>低于</b>均衡价时才造成短缺。';}
  }else{
    if(Pc>P0){const su=(Qs-Qd);bd.className='badge bdg-i';bd.textContent='过剩 '+su.toFixed(2);it.innerHTML='支持价高于均衡:供给 &amp;gt; 需求,出现<b>过剩</b>。';
      note.innerHTML='<b>最低工资/农产品支持价案例：</b>价高于均衡 → 供给 &amp;gt; 需求 → 过剩(失业、卖不掉的存货)。';}
    else{bd.className='badge bdg-1';bd.textContent='不起作用';it.innerHTML='支持价低于均衡 → <b>不具约束力</b>,市场仍在 E 成交。';note.innerHTML='最低限价只有<b>高于</b>均衡价时才造成过剩。';}
  }
}

/* ===== 事件 ===== */
document.querySelectorAll('#eq [data-d]').forEach(b=>b.onclick=()=>{EQ.dS=+b.dataset.d;buildEq();});
document.querySelectorAll('#eq [data-s]').forEach(b=>b.onclick=()=>{EQ.sS=+b.dataset.s;buildEq();});
document.getElementById('rQ').addEventListener('input',e=>{EL.Q=+e.target.value;buildEl();});
document.getElementById('rT').addEventListener('input',e=>{TX.t=+e.target.value;buildTax();});
document.getElementById('rB').addEventListener('input',e=>{TX.b=+e.target.value;buildTax();});
document.getElementById('rPc').addEventListener('input',e=>{CT.Pc=+e.target.value;buildCtrl();});
document.querySelectorAll('#ctrl [data-mode]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#ctrl [data-mode]').forEach(x=>x.classList.remove('on'));b.classList.add('on');
  CT.mode=b.dataset.mode;buildCtrl();});
// init
document.getElementById('rQ').value=EL.Q;document.getElementById('rT').value=TX.t;document.getElementById('rB').value=TX.b;document.getElementById('rPc').value=CT.Pc;
buildEq();buildEl();buildTax();buildCtrl();
</script>

"></iframe></div><div class="panel" data-i="5"><iframe loading="lazy" title="② 消费者均衡" sandbox="allow-scripts" srcdoc="<!DOCTYPE html>
<html lang=&quot;zh-CN&quot;>
<head>
<meta charset=&quot;UTF-8&quot;>
<meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1.0&quot;>
<title>消费者均衡图 · 交互推导</title>
<style>
  :root{
    --paper:#F6F7FA; --surface:#FFFFFF; --ink:#192233; --ink-soft:#5B6678; --ink-faint:#8A93A3;
    --ic:#1B3A8C;        /* 无差异曲线 */

    --eq:#E0A21A;        /* 均衡点 */
    --se:#2E7FD1;        /* 替代效应 */
    --ie:#1F9E5A;        /* 收入效应 */
    --comp:#7A3FB0;      /* 补偿预算线 */
    --violet:#7A3FB0; --guide:#B3123A;
    --grid:#E5E9F0; --border:#DDE2EB;
    --shadow:0 1px 2px rgba(20,30,50,.05),0 8px 28px rgba(20,30,50,.06);

  }

  header.hero{padding:54px 0 30px;border-bottom:1px solid var(--border);position:relative;overflow:hidden;
    background:linear-gradient(var(--paper),var(--paper)),

  nav.toc{position:sticky;top:0;z-index:30;background:rgba(246,247,250,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}

  section{padding:46px 0;border-bottom:1px solid var(--border)}

  h2{font-size:clamp(22px,3.2vw,30px);margin:0;font-weight:800;letter-spacing:-.3px}
  .sub{color:var(--ink-soft);margin:.1em 0 1.4em;max-width:800px}

  .gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(256px,1fr));gap:14px}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:15px 16px;box-shadow:var(--shadow)}
  .card .sym{font-family:var(--math);font-style:italic;font-weight:700;font-size:20px}
  .card .cn{font-weight:700;font-size:14.5px;margin-left:7px}
  .card .en{font-size:12px;color:var(--ink-faint);font-style:italic;font-family:var(--math);margin-top:1px}
  .card .desc{font-size:13.5px;color:var(--ink-soft);margin-top:5px} .card .desc b{color:var(--ink)}
  .pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;margin-top:8px}
  .p-pref{background:rgba(27,58,140,.08);color:var(--ic)} .p-bud{background:rgba(179,18,58,.07);color:var(--budget)}
  .p-eff{background:rgba(31,158,90,.09);color:var(--ie)} .p-der{background:rgba(224,162,26,.13);color:#9a6e00}

  .stage{display:grid;gap:22px;align-items:start}
  @media(min-width:900px){.stage{grid-template-columns:1.08fr 1fr}}
  .figbox{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:10px;position:sticky;top:58px}
  svg.fig{width:100%;height:auto;display:block;user-select:none}
  .controls{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:20px}
  .step-tag{font-size:12.5px;font-weight:700;letter-spacing:1.5px;color:var(--eq);text-transform:uppercase}

  .step-body{font-size:14.5px;color:var(--ink-soft)} .step-body b{color:var(--ink)} .step-body .math{color:var(--ink)}
  .step-body .key{background:linear-gradient(transparent 62%,rgba(224,162,26,.35) 62%);padding:0 2px;color:var(--ink);font-weight:600}
  .deriv{font-family:var(--math);font-style:italic;font-size:15.5px;color:var(--ink);background:var(--paper);border-radius:10px;padding:11px 13px;margin:10px 0;border-left:3px solid var(--ic)}
  .deriv small{font-family:var(--sans);font-style:normal;font-size:12px;color:var(--ink-soft);display:block;margin-top:3px}

  .btn{font-family:var(--sans);font-size:13.5px;font-weight:700;border:1px solid var(--border);background:#fff;color:var(--ink);padding:8px 14px;border-radius:10px;cursor:pointer;transition:.15s}
  .btn:hover{box-shadow:var(--shadow);transform:translateY(-1px)} .btn.on{background:var(--ic);color:#fff;border-color:var(--ic)}
  .btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
  .btnrow{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0} .btnrow .lab{font-size:12.5px;color:var(--ink-faint);font-weight:600;align-self:center}
  .stepnav{display:flex;gap:10px;align-items:center;margin:18px 0 6px}
  .dots{display:flex;gap:6px;margin-left:auto} .dots i{width:8px;height:8px;border-radius:50%;background:var(--border);cursor:pointer} .dots i.on{background:var(--eq);transform:scale(1.25)}
  .sliders{border-top:1px dashed var(--border);margin-top:14px;padding-top:14px}
  .slider{margin-bottom:12px} .slider label{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:3px}
  .slider label .v{font-family:var(--math);font-style:italic;color:var(--budget)}
  input[type=range]{width:100%;accent-color:var(--ic);height:4px}
  .readout{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
  .ro{background:var(--paper);border-radius:10px;padding:9px 11px} .ro .k{font-size:11.5px;color:var(--ink-faint);font-weight:600} .ro .val{font-family:var(--math);font-style:italic;font-size:17px;font-weight:700}
  .ro.x .val{color:var(--budget)} .ro.y .val{color:var(--ic)} .ro.s .val{color:var(--se)} .ro.i .val{color:var(--ie)}
  .interp{font-size:13.6px;color:var(--ink-soft);margin-top:10px;min-height:30px}

  .duo{display:grid;gap:20px} @media(min-width:820px){.duo{grid-template-columns:1fr 1fr}}
  .panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:18px}
  .panel h3{margin:0 0 6px;font-size:17px} .panel p{font-size:14px;color:var(--ink-soft);margin:.35em 0} .panel p b{color:var(--ink)}
  .note{background:#FFFBF0;border:1px solid #F0E2BC;border-radius:12px;padding:12px 14px;font-size:13.6px;color:#7a5e12;margin-top:12px} .note b{color:#5e4a08}
  table.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  table.tbl th,table.tbl td{border:1px solid var(--border);padding:7px 8px;text-align:center}
  table.tbl th{background:var(--paper);font-weight:700} table.tbl td.l{text-align:left;font-weight:700}
  .pos{color:var(--ie);font-weight:800} .neg{color:var(--budget);font-weight:800}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;margin:2px 0 10px}
  .legend span{display:inline-flex;align-items:center;gap:6px;color:var(--ink-soft)} .swatch{width:18px;height:3px;border-radius:2px;display:inline-block}
  footer{padding:30px 0 60px;color:var(--ink-faint);font-size:13px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class=&quot;hero&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;eyebrow&quot;>微观十大核心图 · 第二张</div>
  <h1>推导 <em>消费者均衡图</em><br>无差异曲线、预算线与最优选择</h1>
  <p class=&quot;lead&quot;>消费者在<b style=&quot;color:var(--budget)&quot;>预算线</b>约束下,爬到最高可达的<b style=&quot;color:var(--ic)&quot;>无差异曲线</b>——两者相切处即均衡 <span class=&quot;math&quot;>E</span>。再把价格变动拆成<b style=&quot;color:var(--se)&quot;>替代效应</b>与<b style=&quot;color:var(--ie)&quot;>收入效应</b>,正是本课最常考的难点(对应你试卷计算题3)。</p>
  <div class=&quot;formula&quot;>均衡：MRS₁,₂ = P₁/P₂　⇔　MU₁/P₁ = MU₂/P₂</div>
  <svg class=&quot;mini&quot; viewBox=&quot;0 0 220 170&quot;>
    <line x1=&quot;24&quot; y1=&quot;150&quot; x2=&quot;216&quot; y2=&quot;150&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot;/>
    <line x1=&quot;24&quot; y1=&quot;150&quot; x2=&quot;24&quot; y2=&quot;10&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot;/>
    <line x1=&quot;40&quot; y1=&quot;30&quot; x2=&quot;180&quot; y2=&quot;150&quot; stroke=&quot;#B3123A&quot; stroke-width=&quot;3&quot;/>
    <path d=&quot;M50 140 Q90 70 170 55&quot; fill=&quot;none&quot; stroke=&quot;#1B3A8C&quot; stroke-width=&quot;3&quot;/>
    <circle cx=&quot;103&quot; cy=&quot;92&quot; r=&quot;6&quot; fill=&quot;#E0A21A&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>
  </svg>
</div></header>

<nav class=&quot;toc&quot;><div class=&quot;wrap&quot;>
  <a href=&quot;#gloss&quot;>① 字母词典(中英文)</a>
  <a href=&quot;#derive&quot;>② 均衡推导剧场</a>
  <a href=&quot;#lab&quot;>③ 均衡实验室</a>
  <a href=&quot;#effect&quot;>④ 替代效应 × 收入效应</a>
  <a href=&quot;#map&quot;>⑤ 关系全景</a>
</div></nav>

<!-- 1 GLOSSARY -->
<section id=&quot;gloss&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>01</span><h2>字母词典：中英文全称 + 经济含义</h2></div>
  <p class=&quot;sub&quot;>平面横轴 <span class=&quot;math&quot;>Q₁(X)</span>、纵轴 <span class=&quot;math&quot;>Q₂(Y)</span> 是两种商品的数量。偏好侧、预算侧、均衡与效应,四组术语认全。</p>
  <div class=&quot;gloss&quot; id=&quot;glossGrid&quot;></div>
</div></section>

<!-- 2 DERIVATION -->
<section id=&quot;derive&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>02</span><h2>均衡推导剧场：从边际效用递减到相切条件</h2></div>
  <p class=&quot;sub&quot;>点下一步,看消费者均衡如何&quot;长&quot;出来。用示例 <span class=&quot;math&quot;>U=XY,m=400,P₁=2,P₂=1</span>。</p>
  <div class=&quot;stage&quot;>
    <div class=&quot;figbox&quot;><div id=&quot;dHost&quot;></div></div>
    <div class=&quot;controls&quot;>
      <div class=&quot;step-tag&quot; id=&quot;dTag&quot;></div>
      <div class=&quot;step-title&quot; id=&quot;dTitle&quot;></div>
      <div class=&quot;step-body&quot; id=&quot;dBody&quot;></div>
      <div id=&quot;dDeriv&quot;></div>
      <div class=&quot;stepnav&quot;>
        <button class=&quot;btn&quot; id=&quot;dPrev&quot;>‹ 上一步</button>
        <button class=&quot;btn on&quot; id=&quot;dNext&quot;>下一步 ›</button>
        <div class=&quot;dots&quot; id=&quot;dDots&quot;></div>
      </div>
    </div>
  </div>
</div></section>

<!-- 3 LAB -->
<section id=&quot;lab&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>03</span><h2>均衡实验室：价格、收入怎么动,E 就怎么走</h2></div>
  <p class=&quot;sub&quot;>用 <span class=&quot;math&quot;>U=XY</span>(柯布-道格拉斯)。拖动 <span class=&quot;math&quot;>P₁、P₂、m</span>,预算线随之转动/平移,均衡 <span class=&quot;math&quot;>E</span> 始终落在相切点 <span class=&quot;math&quot;>X*=m/2P₁, Y*=m/2P₂</span>。开启叠加,看<b>收入-消费曲线</b>(→恩格尔)或<b>价格-消费曲线</b>(→需求)。</p>
  <div class=&quot;legend&quot;>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--budget)&quot;></i>预算线</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--ic)&quot;></i>无差异曲线</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--eq)&quot;></i>均衡 E</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--ie)&quot;></i>叠加轨迹</span>
  </div>
  <div class=&quot;stage&quot;>
    <div class=&quot;figbox&quot;><div id=&quot;labHost&quot;></div></div>
    <div class=&quot;controls&quot;>
      <div class=&quot;step-title&quot;>相切 ⇒ MRS = P₁/P₂</div>
      <div class=&quot;step-body&quot;>在 E 点,无差异曲线斜率(MRS)＝预算线斜率(P₁/P₂),即每元钱买任何商品带来的边际效用相等。</div>
      <div class=&quot;btnrow&quot;><span class=&quot;lab&quot;>叠加：</span>
        <button class=&quot;btn on&quot; data-ov=&quot;none&quot;>无</button>
        <button class=&quot;btn&quot; data-ov=&quot;icc&quot;>收入-消费曲线</button>
        <button class=&quot;btn&quot; data-ov=&quot;pcc&quot;>价格-消费曲线</button></div>
      <div class=&quot;sliders&quot;>
        <div class=&quot;slider&quot;><label>P₁（X 的价格）<span class=&quot;v&quot; id=&quot;vP1&quot;></span></label><input type=&quot;range&quot; id=&quot;rP1&quot; min=&quot;1&quot; max=&quot;5&quot; step=&quot;0.5&quot;></div>
        <div class=&quot;slider&quot;><label>P₂（Y 的价格）<span class=&quot;v&quot; id=&quot;vP2&quot;></span></label><input type=&quot;range&quot; id=&quot;rP2&quot; min=&quot;1&quot; max=&quot;5&quot; step=&quot;0.5&quot;></div>
        <div class=&quot;slider&quot;><label>收入 m<span class=&quot;v&quot; id=&quot;vM&quot;></span></label><input type=&quot;range&quot; id=&quot;rM&quot; min=&quot;200&quot; max=&quot;500&quot; step=&quot;20&quot;></div>
        <div class=&quot;readout&quot;>
          <div class=&quot;ro x&quot;><div class=&quot;k&quot;>X* = m/2P₁</div><div class=&quot;val&quot; id=&quot;oX&quot;></div></div>
          <div class=&quot;ro y&quot;><div class=&quot;k&quot;>Y* = m/2P₂</div><div class=&quot;val&quot; id=&quot;oY&quot;></div></div>
        </div>
        <div class=&quot;interp&quot; id=&quot;labInterp&quot;></div>
      </div>
    </div>
  </div>
</div></section>

<!-- 4 SE/IE -->
<section id=&quot;effect&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>04</span><h2>替代效应 × 收入效应（计算题3 同款）</h2></div>
  <p class=&quot;sub&quot;><span class=&quot;math&quot;>X</span> 降价后需求增加,可拆成两步:<b style=&quot;color:var(--se)&quot;>替代效应</b>(X 变相对便宜 → 沿<b>原</b>无差异曲线多买 X)+ <b style=&quot;color:var(--ie)&quot;>收入效应</b>(实际购买力上升 → 再多买)。做法:作一条平行于新预算、又与原无差异曲线相切的<b style=&quot;color:var(--comp)&quot;>补偿预算线</b>。默认 <span class=&quot;math&quot;>U=XY, m=400, P₂=1, P₁:2→1</span>。</p>
  <div class=&quot;legend&quot;>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--budget)&quot;></i>预算线 I₁/I₂</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--comp)&quot;></i>补偿预算线 I₁′</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--ic)&quot;></i>无差异曲线</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--se)&quot;></i>替代效应</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--ie)&quot;></i>收入效应</span>
  </div>
  <div class=&quot;stage&quot;>
    <div class=&quot;figbox&quot;><div id=&quot;effHost&quot;></div></div>
    <div class=&quot;controls&quot;>
      <div class=&quot;step-title&quot;>拖动 X 的新价格 P₁</div>
      <div class=&quot;step-body&quot;>E₀=原均衡(U₀)；E₁=新均衡(U₁,更高)；E₁′=补偿点(新价格、原效用)。<br><b style=&quot;color:var(--se)&quot;>替代效应</b>=X(E₁′)−X(E₀)；<b style=&quot;color:var(--ie)&quot;>收入效应</b>=X(E₁)−X(E₁′)；总效应=两者之和。</div>
      <div class=&quot;sliders&quot;>
        <div class=&quot;slider&quot;><label>X 的新价格 P₁′（原为 2）<span class=&quot;v&quot; id=&quot;vPx&quot;></span></label><input type=&quot;range&quot; id=&quot;rPx&quot; min=&quot;1&quot; max=&quot;2&quot; step=&quot;0.05&quot;></div>
        <div class=&quot;readout&quot;>
          <div class=&quot;ro x&quot;><div class=&quot;k&quot;>总效应 ΔX</div><div class=&quot;val&quot; id=&quot;eTot&quot;></div></div>
          <div class=&quot;ro s&quot;><div class=&quot;k&quot;>替代效应</div><div class=&quot;val&quot; id=&quot;eSE&quot;></div></div>
          <div class=&quot;ro i&quot;><div class=&quot;k&quot;>收入效应</div><div class=&quot;val&quot; id=&quot;eIE&quot;></div></div>
          <div class=&quot;ro y&quot;><div class=&quot;k&quot;>X₀ → X₁</div><div class=&quot;val&quot; id=&quot;eXX&quot;></div></div>
        </div>
        <div class=&quot;interp&quot; id=&quot;eInterp&quot;></div>
      </div>
      <div class=&quot;note&quot;><b>计算题3 对照（P₁:2→1）：</b>X₀=100,X₁=200,补偿点 X₁′=100√2≈141.4。替代效应≈+41.4,收入效应≈+58.6,总效应=+100。正常品两者同向为正。</div>
    </div>
  </div>
</div></section>

<!-- 5 MAP -->
<section id=&quot;map&quot; style=&quot;border-bottom:none&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>05</span><h2>关系全景：四类商品 + 这张图的来路与去处</h2></div>
  <div class=&quot;duo&quot;>
    <div class=&quot;panel&quot;>
      <h3>四类商品的效应符号（价格上涨时）</h3>
      <table class=&quot;tbl&quot;>
        <tr><th>商品类型</th><th>替代效应</th><th>收入效应</th><th>总效应</th><th>需求曲线</th></tr>
        <tr><td class=&quot;l&quot;>正常品</td><td class=&quot;neg&quot;>−</td><td class=&quot;neg&quot;>−</td><td class=&quot;neg&quot;>−</td><td>右下倾</td></tr>
        <tr><td class=&quot;l&quot;>低档品(普通)</td><td class=&quot;neg&quot;>−</td><td class=&quot;pos&quot;>+</td><td class=&quot;neg&quot;>−</td><td>右下倾</td></tr>
        <tr><td class=&quot;l&quot;>吉芬商品</td><td class=&quot;neg&quot;>−</td><td class=&quot;pos&quot;>+</td><td class=&quot;pos&quot;>+</td><td>右上倾</td></tr>
        <tr><td class=&quot;l&quot;>凡勃仑商品</td><td class=&quot;pos&quot;>+</td><td class=&quot;neg&quot;>−</td><td class=&quot;pos&quot;>+</td><td>右上倾</td></tr>
      </table>
      <p style=&quot;font-size:12.5px;color:var(--ink-soft);margin-top:8px&quot;>替代效应永远使涨价的商品需求<b>减少</b>(负)。区别全在收入效应:低档品收入效应反向,吉芬品反向且<b>超过</b>替代效应,于是需求曲线反常上倾。</p>
    </div>
    <div class=&quot;panel&quot;>
      <h3>来路与去处</h3>
      <p>· <b>偏好 + 预算 → 均衡 E</b>:本图核心。</p>
      <p>· 变收入 <span class=&quot;math&quot;>m</span> → <b>收入-消费曲线</b> → <b>恩格尔曲线</b>(数量随收入)。</p>
      <p>· 变价格 <span class=&quot;math&quot;>P₁</span> → <b>价格-消费曲线</b> → 一个个 <span class=&quot;math&quot;>(X*, P₁)</span> 描出<b>需求曲线</b>。</p>
      <p>这正是第①张<b>供求图</b>里那条需求曲线的微观来源——需求曲线下倾,本质是替代效应+(正常品)收入效应共同作用。</p>
      <div class=&quot;note&quot;>柯布-道格拉斯 <span class=&quot;math&quot;>U=XY</span> 的特例:两商品都是正常品,价格-消费曲线水平,需求 <span class=&quot;math&quot;>X*=m/2P₁</span> 为<b>单位弹性</b>双曲线。</div>
    </div>
  </div>
</div></section>

<footer><div class=&quot;wrap&quot;>交互推导工具 · 微观十大核心图之二 · 依《经济学原理（微观部分）》课程口径编制。</div></footer>

<script>
/* ===== 词典 ===== */
const GLOSS=[
 [&quot;U&quot;,&quot;效用&quot;,&quot;Utility&quot;,&quot;消费带来的满足。序数效用只看排序,不看绝对大小。&quot;,&quot;p-pref&quot;],
 [&quot;MU&quot;,&quot;边际效用&quot;,&quot;Marginal utility&quot;,&quot;多消费一单位增加的效用。<b>边际效用递减</b>:越多越不稀罕。&quot;,&quot;p-pref&quot;],
 [&quot;IC&quot;,&quot;无差异曲线&quot;,&quot;Indifference curve&quot;,&quot;效用相同的消费组合连线,<b>凸向原点</b>、互不相交、越远越好。&quot;,&quot;p-pref&quot;],
 [&quot;MRS&quot;,&quot;边际替代率&quot;,&quot;Marginal rate of substitution&quot;,&quot;保持效用不变,多 1 单位 X 愿放弃的 Y。MRS=MU₁/MU₂=IC 斜率绝对值,<b>递减</b>。&quot;,&quot;p-pref&quot;],
 [&quot;BL&quot;,&quot;预算约束线&quot;,&quot;Budget line&quot;,&quot;P₁Q₁+P₂Q₂=m。斜率 −P₁/P₂,截距 m/P₁、m/P₂。&quot;,&quot;p-bud&quot;],
 [&quot;m&quot;,&quot;收入&quot;,&quot;Income / budget&quot;,&quot;可支配预算。m↑ → 预算线<b>平行外移</b>。&quot;,&quot;p-bud&quot;],
 [&quot;E&quot;,&quot;消费者均衡&quot;,&quot;Consumer equilibrium&quot;,&quot;最高可达 IC 与预算线<b>相切</b>之点。&quot;,&quot;p-bud&quot;],
 [&quot;λ&quot;,&quot;货币的边际效用&quot;,&quot;Marginal utility of money&quot;,&quot;均衡时 MU₁/P₁=MU₂/P₂=λ,每元钱的边际效用相等。&quot;,&quot;p-der&quot;],
 [&quot;ICC&quot;,&quot;收入-消费曲线&quot;,&quot;Income-consumption curve&quot;,&quot;收入变动时一串均衡点的连线 → 导出恩格尔曲线。&quot;,&quot;p-der&quot;],
 [&quot;恩格尔曲线&quot;,&quot;Engel curve&quot;,&quot;Engel curve&quot;,&quot;某商品需求量随收入变化的曲线。低档品段向后弯。&quot;,&quot;p-der&quot;],
 [&quot;PCC&quot;,&quot;价格-消费曲线&quot;,&quot;Price-consumption curve&quot;,&quot;某价格变动时一串均衡点的连线 → 导出需求曲线。&quot;,&quot;p-der&quot;],
 [&quot;SE&quot;,&quot;替代效应&quot;,&quot;Substitution effect&quot;,&quot;相对价格变化引起的需求变化(沿原 IC)。降价时恒使该品需求<b>增加</b>。&quot;,&quot;p-eff&quot;],
 [&quot;IE&quot;,&quot;收入效应&quot;,&quot;Income effect&quot;,&quot;实际购买力变化引起的需求变化。正常品同向、低档品反向。&quot;,&quot;p-eff&quot;],
 [&quot;吉芬商品&quot;,&quot;Giffen good&quot;,&quot;Giffen good&quot;,&quot;低档品中收入效应反向且<b>超过</b>替代效应,需求曲线<b>右上倾</b>。&quot;,&quot;p-eff&quot;],
 [&quot;凡勃仑商品&quot;,&quot;Veblen good&quot;,&quot;Veblen good&quot;,&quot;炫耀性商品,越贵越买,替代效应即为正,需求右上倾。&quot;,&quot;p-eff&quot;],
];
(function(){const g=document.getElementById('glossGrid');
 GLOSS.forEach(([s,cn,en,d,p])=>{const e=document.createElement('div');e.className='card';
  const col=p==='p-pref'?'var(--ic)':p==='p-bud'?'var(--budget)':p==='p-eff'?'var(--ie)':'#9a6e00';
  e.innerHTML=`<span class=&quot;sym&quot; style=&quot;color:${col}&quot;>${s}</span><span class=&quot;cn&quot;>${cn}</span><div class=&quot;en&quot;>${en}</div><div class=&quot;desc&quot;>${d}</div><span class=&quot;pill ${p}&quot;>${p==='p-pref'?'偏好侧':p==='p-bud'?'预算/均衡':p==='p-eff'?'价格效应':'曲线导出'}</span>`;
  g.appendChild(e);});})();

/* ===== 绘图基元 ===== */
function _css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function mx(v,P){return P.px+(v-P.xMin)/(P.xMax-P.xMin)*P.pw;}
function my(v,P){return P.py+P.ph-(v-P.yMin)/(P.yMax-P.yMin)*P.ph;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function L(x1,y1,x2,y2,c,w,ex=''){return `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; ${ex}/>`;}
function T(x,y,t,c,s=13,a='start',w=600,it=false){return `<text x=&quot;${x}&quot; y=&quot;${y}&quot; fill=&quot;${c}&quot; font-size=&quot;${s}&quot; text-anchor=&quot;${a}&quot; font-weight=&quot;${w}&quot; ${it?'font-style=&quot;italic&quot; font-family=&quot;Georgia,serif&quot;':'font-family=&quot;PingFang SC,sans-serif&quot;'}>${t}</text>`;}
function svgOpen(w,h,label){return `<svg class=&quot;fig&quot; viewBox=&quot;0 0 ${w} ${h}&quot; role=&quot;img&quot; aria-label=&quot;${label}&quot;><defs>
  <marker id=&quot;ar&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;#192233&quot;/></marker></defs>`;}
function axesG(P,xlab,ylab){
  const Ey=P.py+P.ph,Ex=P.px+P.pw;let g='';
  for(let i=1;i<=4;i++){const gx=P.px+P.pw*i/5,gy=P.py+P.ph*i/5;g+=L(gx,P.py,gx,Ey,'var(--grid)',1);g+=L(P.px,gy,Ex,gy,'var(--grid)',1);}
  g+=L(P.px,Ey,Ex+12,Ey,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=`<line x1=&quot;${P.px}&quot; y1=&quot;${Ey}&quot; x2=&quot;${P.px}&quot; y2=&quot;${P.py-12}&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/>`;
  g+=T(P.px-7,P.py-13,ylab,_css('--ink'),15,'end',800,true);
  g+=T(Ex+16,Ey+5,xlab,_css('--ink'),15,'start',800,true);
  g+=T(P.px-9,Ey+16,'O',_css('--ink'),13,'end',700);
  return g;
}
function icPath(U,P,xmin,xmax){let pts=[];const N=90;for(let i=0;i<=N;i++){const X=xmin+(xmax-xmin)*i/N;if(X<=0)continue;const Y=U/X;if(Y<=P.yMax*1.4&amp;&amp;X>=P.xMin&amp;&amp;X<=P.xMax){const yy=clamp(Y,P.yMin,P.yMax*1.2);if(Y<=P.yMax)pts.push([mx(X,P),my(Y,P)]);}}return pts;}
function pathD(pts){if(!pts.length)return '';let d='M'+pts[0][0]+' '+pts[0][1];for(let i=1;i<pts.length;i++)d+=' L'+pts[i][0]+' '+pts[i][1];return d;}

/* ===== 第二节：推导剧场 ===== */
const m0=400,P1d=2,P2d=1;
const X0d=m0/(2*P1d),Y0d=m0/(2*P2d),U0d=X0d*Y0d;
const DV={step:0};
const DSTEPS=[
 {tag:&quot;前提 · 预算约束&quot;,title:&quot;消费者能买什么：预算线&quot;,
  body:`收入 m 与价格 P₁、P₂ 框定可选范围。预算线 <span class=&quot;math&quot;>P₁X+P₂Y=m</span>,斜率 <span class=&quot;math&quot;>−P₁/P₂</span>。`,
  deriv:[[&quot;P₁X + P₂Y = m&quot;,&quot;截距 m/P₁=200、m/P₂=400；斜率 −2&quot;]],draw:0},
 {tag:&quot;第 1 步 · 偏好&quot;,title:&quot;消费者想要什么：无差异曲线&quot;,
  body:`同一条 IC 上效用相同。<b>边际效用递减</b> ⇒ IC <span class=&quot;key&quot;>凸向原点</span>;越靠右上效用越高。`,
  deriv:[[&quot;U = XY = 常数 ⇒ Y = U/X&quot;,&quot;凸向原点的双曲线族&quot;]],draw:1},
 {tag:&quot;第 2 步 · MRS&quot;,title:&quot;愿意如何替换：边际替代率&quot;,
  body:`沿 IC 全微分:<span class=&quot;math&quot;>MU₁dX+MU₂dY=0</span>,得 IC 斜率。`,
  deriv:[[&quot;dY/dX = −MU₁/MU₂ = −MRS&quot;,&quot;MRS=多 1 单位 X 愿放弃的 Y,递减&quot;]],draw:1},
 {tag:&quot;第 3 步 · 相切&quot;,title:&quot;最优：IC 与预算线相切&quot;,
  body:`在预算线上爬到<b>最高</b>可达的 IC,切点即均衡 <span class=&quot;key&quot;>E</span>。切点处两线斜率相等。`,
  deriv:[[&quot;MRS = P₁/P₂　⇔　MU₁/P₁ = MU₂/P₂&quot;,&quot;每元钱的边际效用相等 =λ&quot;],[&quot;X*=m/2P₁=100, Y*=m/2P₂=200&quot;,&quot;&quot;]],draw:2},
];
function buildDerive(){
  const st=DSTEPS[DV.step];
  const P={px:50,py:24,pw:368,ph:300,xMin:0,xMax:440,yMin:0,yMax:440};
  let g=svgOpen(440,360,'消费者均衡推导');g+=axesG(P,'X','Y');
  // budget line always (step>=0)
  g+=L(mx(0,P),my(m0/P2d,P),mx(m0/P1d,P),my(0,P),_css('--budget'),3);
  g+=T(mx(m0/P1d,P)-2,my(0,P)-8,'预算线',_css('--budget'),12,'end',800);
  if(st.draw>=1){ // ICs
    [12000,U0d,32000].forEach((U,idx)=>{
      const op=Math.abs(U-U0d)<1?1:0.4;
      g+=`<path d=&quot;${pathD(icPath(U,P,4,440))}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--ic')}&quot; stroke-width=&quot;${op===1?3:2}&quot; opacity=&quot;${op}&quot;/>`;
    });
    g+=T(mx(330,P),my(U0d/330,P)-6,'IC',_css('--ic'),13,'start',800,true);
  }
  if(st.draw>=2){ // tangency
    const ex=mx(X0d,P),ey=my(Y0d,P);
    g+=L(ex,ey,ex,P.py+P.ph,_css('--guide'),1.4,'stroke-dasharray=&quot;4 3&quot;');
    g+=L(ex,ey,P.px,ey,_css('--guide'),1.4,'stroke-dasharray=&quot;4 3&quot;');
    g+=`<circle cx=&quot;${ex}&quot; cy=&quot;${ey}&quot; r=&quot;7&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
    g+=T(ex+10,ey-8,'E',_css('--eq')==='#E0A21A'?'#9a6e00':_css('--eq'),14,'start',800);
    g+=T(ex,P.py+P.ph+15,'X*=100',_css('--ink'),11,'middle',700);
    g+=T(P.px-7,ey+4,'Y*=200',_css('--ic'),11,'end',700);
  }
  g+='</svg>';document.getElementById('dHost').innerHTML=g;
  document.getElementById('dTag').textContent=`${st.tag}（第 ${DV.step+1}/${DSTEPS.length} 步）`;
  document.getElementById('dTitle').textContent=st.title;
  document.getElementById('dBody').innerHTML=st.body;
  document.getElementById('dDeriv').innerHTML=st.deriv.map(([f,s])=>`<div class=&quot;deriv&quot;>${f}${s?`<small>${s}</small>`:''}</div>`).join('');
  document.getElementById('dPrev').disabled=DV.step===0;document.getElementById('dNext').disabled=DV.step===DSTEPS.length-1;
  document.getElementById('dDots').innerHTML=DSTEPS.map((_,i)=>`<i class=&quot;${i===DV.step?'on':''}&quot; data-i=&quot;${i}&quot;></i>`).join('');
  document.querySelectorAll('#dDots i').forEach(d=>d.onclick=()=>{DV.step=+d.dataset.i;buildDerive();});
}
document.getElementById('dNext').onclick=()=>{if(DV.step<DSTEPS.length-1){DV.step++;buildDerive();}};
document.getElementById('dPrev').onclick=()=>{if(DV.step>0){DV.step--;buildDerive();}};

/* ===== 第三节：均衡实验室 ===== */
const LB={P1:2,P2:1,m:400,ov:'none'};
function buildLab(){
  const {P1,P2,m,ov}=LB;
  const X=m/(2*P1),Y=m/(2*P2),U=X*Y;
  const P={px:50,py:24,pw:380,ph:330,xMin:0,xMax:520,yMin:0,yMax:520};
  let g=svgOpen(460,390,'均衡实验室');g+=axesG(P,'X','Y');
  // budget
  g+=L(mx(0,P),my(m/P2,P),mx(m/P1,P),my(0,P),_css('--budget'),3);
  // IC through E
  g+=`<path d=&quot;${pathD(icPath(U,P,4,520))}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--ic')}&quot; stroke-width=&quot;2.6&quot;/>`;
  // overlay locus
  if(ov==='icc'){let pts=[];for(let mm=120;mm<=500;mm+=20){pts.push([mx(mm/(2*P1),P),my(mm/(2*P2),P)]);}g+=`<path d=&quot;${pathD(pts)}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--ie')}&quot; stroke-width=&quot;2.4&quot; stroke-dasharray=&quot;6 4&quot;/>`;g+=T(pts[pts.length-1][0]+4,pts[pts.length-1][1],'ICC',_css('--ie'),12,'start',800);}
  if(ov==='pcc'){let pts=[];for(let pp=1;pp<=5;pp+=0.25){pts.push([mx(m/(2*pp),P),my(m/(2*P2),P)]);}g+=`<path d=&quot;${pathD(pts)}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--ie')}&quot; stroke-width=&quot;2.4&quot; stroke-dasharray=&quot;6 4&quot;/>`;g+=T(pts[0][0]+4,pts[0][1]-6,'PCC',_css('--ie'),12,'start',800);}
  // E
  const ex=mx(X,P),ey=my(Y,P);
  g+=L(ex,ey,ex,P.py+P.ph,_css('--guide'),1.3,'stroke-dasharray=&quot;4 3&quot;');
  g+=L(ex,ey,P.px,ey,_css('--guide'),1.3,'stroke-dasharray=&quot;4 3&quot;');
  g+=`<circle cx=&quot;${ex}&quot; cy=&quot;${ey}&quot; r=&quot;7&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
  g+=T(ex+10,ey-8,'E',_css('--eq')==='#E0A21A'?'#9a6e00':_css('--eq'),14,'start',800);
  g+=T(P.px+P.pw,P.py+14,'U='+Math.round(U),_css('--ic'),12,'end',700,true);
  g+='</svg>';document.getElementById('labHost').innerHTML=g;
  document.getElementById('vP1').textContent=' = '+P1.toFixed(1);
  document.getElementById('vP2').textContent=' = '+P2.toFixed(1);
  document.getElementById('vM').textContent=' = '+m;
  document.getElementById('oX').textContent=X.toFixed(1);
  document.getElementById('oY').textContent=Y.toFixed(1);
  let it='MRS = P₁/P₂ = '+(P1/P2).toFixed(2)+'。';
  if(ov==='icc')it+=' 收入变动 → 均衡连成<b>收入-消费曲线</b>(此处为过原点射线,两品皆正常品),投影即恩格尔曲线。';
  if(ov==='pcc')it+=' P₁ 变动 → 均衡连成<b>价格-消费曲线</b>;把 (X*,P₁) 描出来就是<b>需求曲线</b>。';
  document.getElementById('labInterp').innerHTML=it;
}

/* ===== 第四节：替代/收入效应 ===== */
const EF={Px:1};
function buildEff(){
  const m=400,Py=1,Px0=2,PxN=EF.Px;
  const X0=m/(2*Px0),Y0=m/(2*Py),U0=X0*Y0;
  const X1=m/(2*PxN),Y1=m/(2*Py);
  const X1c=Math.sqrt(U0*Py/PxN),Y1c=Math.sqrt(U0*PxN/Py);
  const mc=PxN*X1c+Py*Y1c;
  const SE=X1c-X0,IE=X1-X1c,TOT=X1-X0;
  const P={px:50,py:24,pw:380,ph:330,xMin:0,xMax:440,yMin:0,yMax:440};
  let g=svgOpen(460,395,'替代收入效应');g+=axesG(P,'X','Y');
  // budgets: I1 (orig), I2 (new), I1' (compensated)
  g+=L(mx(0,P),my(m/Py,P),mx(m/Px0,P),my(0,P),_css('--budget'),2.6);
  g+=L(mx(0,P),my(m/Py,P),mx(m/PxN,P),my(0,P),_css('--budget'),2.6);
  g+=L(mx(0,P),my(mc/Py,P),mx(mc/PxN,P),my(0,P),_css('--comp'),2.4,'stroke-dasharray=&quot;6 4&quot;');
  g+=T(mx(m/Px0,P),my(0,P)-8,'I₁',_css('--budget'),12,'middle',800,true);
  g+=T(mx(m/PxN,P),my(0,P)-8,'I₂',_css('--budget'),12,'middle',800,true);
  g+=T(mx(mc/PxN,P)+2,my(0,P)+13,'I₁′',_css('--comp'),12,'middle',800,true);
  // ICs U0, U1
  g+=`<path d=&quot;${pathD(icPath(U0,P,8,440))}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--ic')}&quot; stroke-width=&quot;2.4&quot;/>`;
  g+=`<path d=&quot;${pathD(icPath(X1*Y1,P,8,440))}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--ic')}&quot; stroke-width=&quot;2.4&quot; opacity=&quot;0.55&quot;/>`;
  g+=T(mx(360,P),my(U0/360,P)-5,'U₀',_css('--ic'),12,'start',800,true);
  // points
  function dot(X,Y,c,lab,dx,dy){return `<circle cx=&quot;${mx(X,P)}&quot; cy=&quot;${my(Y,P)}&quot; r=&quot;6&quot; fill=&quot;${c}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`+T(mx(X,P)+dx,my(Y,P)+dy,lab,c==='#E0A21A'?'#9a6e00':c,12,'start',800);}
  g+=dot(X0,Y0,_css('--eq'),'E₀',9,-6);
  g+=dot(X1c,Y1c,_css('--comp'),'E₁′',9,-6);
  g+=dot(X1,Y1,_css('--se'),'E₁',9,16);
  // SE/IE brackets on x-axis
  const yb=P.py+P.ph+22;
  g+=L(mx(X0,P),yb,mx(X1c,P),yb,_css('--se'),3);
  g+=L(mx(X1c,P),yb+8,mx(X1,P),yb+8,_css('--ie'),3);
  g+=T((mx(X0,P)+mx(X1c,P))/2,yb-4,'替代',_css('--se'),11,'middle',700);
  g+=T((mx(X1c,P)+mx(X1,P))/2,yb+20,'收入',_css('--ie'),11,'middle',700);
  // vertical drops
  [[X0,_css('--eq')],[X1c,_css('--comp')],[X1,_css('--se')]].forEach(([X,c])=>{g+=L(mx(X,P),my(0,P),mx(X,P),yb,c,1,'stroke-dasharray=&quot;3 3&quot; opacity=&quot;0.7&quot;');});
  g+='</svg>';document.getElementById('effHost').innerHTML=g;
  document.getElementById('vPx').textContent=' = '+PxN.toFixed(2);
  document.getElementById('eTot').textContent='+'+TOT.toFixed(1);
  document.getElementById('eSE').textContent='+'+SE.toFixed(1);
  document.getElementById('eIE').textContent='+'+IE.toFixed(1);
