  <div class=&quot;gloss&quot; id=&quot;glossGrid&quot;></div>
  <div class=&quot;note&quot;><b>一处常见笔误：</b>讲义图10-6 标注 <span class=&quot;math&quot;>APC &amp;lt; β</span>，这是错的。因为 <span class=&quot;math&quot;>APC = C/Y = α/Y + β</span>，而 <span class=&quot;math&quot;>α/Y &amp;gt; 0</span>，所以正确关系是 <span class=&quot;math&quot;>APC &amp;gt; β = MPC</span>（平均消费倾向恒大于边际消费倾向，且随收入上升而下降）。下方滑块可以亲手验证。</p>

        <div class=&quot;slider&quot;><label>计划投资 <span class=&quot;math&quot;>I</span><span class=&quot;v&quot; id=&quot;iVal&quot;></span></label>
          <input type=&quot;range&quot; id=&quot;iRange&quot; min=&quot;0&quot; max=&quot;400&quot; step=&quot;10&quot;></div>
        <div class=&quot;slider&quot; id=&quot;diWrap&quot; style=&quot;display:none&quot;><label>投资增量 <span class=&quot;math&quot;>ΔI</span><span class=&quot;v&quot; id=&quot;diVal&quot;></span></label>
          <input type=&quot;range&quot; id=&quot;diRange&quot; min=&quot;40&quot; max=&quot;320&quot; step=&quot;10&quot;></div>
        <div class=&quot;readout&quot;>
          <div class=&quot;ro&quot;><div class=&quot;k&quot;>自发支出 a = α+I</div><div class=&quot;val&quot; id=&quot;roA&quot;></div></div>
          <div class=&quot;ro mul&quot;><div class=&quot;k&quot;>乘数 k = 1/(1−β)</div><div class=&quot;val&quot; id=&quot;roK&quot;></div></div>
          <div class=&quot;ro eq&quot;><div class=&quot;k&quot;>均衡收入 Y* = a/(1−β)</div><div class=&quot;val&quot; id=&quot;roY&quot;></div></div>
          <div class=&quot;ro&quot;><div class=&quot;k&quot; id=&quot;roXk&quot;>APC @ Y* = C/Y</div><div class=&quot;val&quot; id=&quot;roX&quot;></div></div>
        </div>
      </div>
    </div>
  </div>
</div></section>

<!-- ===================== 3. CONSUMPTION vs SAVING ===================== -->
<section id=&quot;cs&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>03</span><h2>消费函数与储蓄函数：一枚硬币的两面</h2></div>
  <p class=&quot;sub&quot;>收入只有两个去向：消费或储蓄，所以 <span class=&quot;math&quot;>C + S = Y</span>。把消费函数 <span class=&quot;math&quot;>C=α+βY</span> 减出来，就得到储蓄函数 <span class=&quot;math&quot;>S = Y − C = −α + (1−β)Y</span>。两条线随 α、β 联动——拖上面的滑块，这里同步变。</p>
  <div class=&quot;duo&quot;>
    <div class=&quot;panel&quot;>
      <div id=&quot;csHost&quot;></div>
      <div class=&quot;legend&quot; style=&quot;margin-top:6px&quot;>
        <span><i class=&quot;swatch&quot; style=&quot;background:var(--line45)&quot;></i>45°线 C=Y</span>
        <span><i class=&quot;swatch&quot; style=&quot;background:var(--lineAE)&quot;></i>C=α+βY</span>
        <span><i class=&quot;swatch&quot; style=&quot;background:var(--lineSave)&quot;></i>S=−α+(1−β)Y</span>
      </div>
    </div>
    <div class=&quot;panel&quot;>
      <h3>怎么读这张图</h3>
      <p>· <b>截距互为反号：</b>消费线纵截距 <span class=&quot;math&quot;>+α</span>（收入为零也要花钱），储蓄线纵截距 <span class=&quot;math&quot;>−α</span>（靠借贷/动用积蓄）。</p>
      <p>· <b>斜率互补：</b>消费线斜率 <span class=&quot;math&quot;>β=MPC</span>，储蓄线斜率 <span class=&quot;math&quot;>1−β=MPS</span>，两者之和恒为 1。</p>
      <p>· <b>盈亏平衡点 <span class=&quot;math&quot;>Y₁</span>：</b>消费线与 45°线相交处，<span class=&quot;math&quot;>C=Y</span>，此时 <span class=&quot;math&quot;>S=0</span>（储蓄线穿过横轴）。<span class=&quot;math&quot;>Y₁ = α/(1−β)</span>。</p>
      <p>· 左侧 <span class=&quot;math&quot;>Y&amp;lt;Y₁</span>：消费&amp;gt;收入，<b>负储蓄</b>；右侧 <span class=&quot;math&quot;>Y&amp;gt;Y₁</span>：开始有正储蓄。</p>
      <div class=&quot;readout&quot; style=&quot;grid-template-columns:1fr 1fr&quot;>
        <div class=&quot;ro&quot;><div class=&quot;k&quot;>MPC = β</div><div class=&quot;val&quot; id=&quot;csMPC&quot;></div></div>
        <div class=&quot;ro&quot;><div class=&quot;k&quot;>MPS = 1−β</div><div class=&quot;val&quot; id=&quot;csMPS&quot;></div></div>
        <div class=&quot;ro&quot;><div class=&quot;k&quot;>盈亏平衡 Y₁=α/(1−β)</div><div class=&quot;val&quot; id=&quot;csY1&quot;></div></div>
        <div class=&quot;ro&quot;><div class=&quot;k&quot;>此点 APC=C/Y</div><div class=&quot;val&quot; id=&quot;csAPC&quot;></div></div>
      </div>
    </div>
  </div>
</div></section>

<!-- ===================== 4. MULTIPLIER FORMULA ===================== -->
<section id=&quot;multi&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>04</span><h2>乘数公式：为什么 ΔY 比 ΔI 大</h2></div>
  <p class=&quot;sub&quot;>一笔投资 <span class=&quot;math&quot;>ΔI</span> 不会只增加一次收入：拿到收入的人会按 <span class=&quot;math&quot;>β</span> 的比例再消费，引发第二轮、第三轮……加总起来就是一条等比数列。下方按收入轮次&quot;摊开&quot;看，再用闭式公式收口。</p>
  <div class=&quot;duo&quot;>
    <div class=&quot;panel&quot;>
      <h3>分轮次加总（取当前 β）</h3>
      <div id=&quot;roundsHost&quot; style=&quot;font-size:14px&quot;></div>
    </div>
    <div class=&quot;panel&quot;>
      <h3>极限求和 ⇒ 闭式乘数</h3>
      <p class=&quot;math&quot; style=&quot;font-size:16px;color:var(--ink)&quot;>ΔY = ΔI·(1 + β + β² + β³ + ⋯)</p>
      <p class=&quot;math&quot; style=&quot;font-size:16px;color:var(--ink)&quot;>&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;= ΔI · lim<sub>n→∞</sub> Σβⁿ</p>
      <p class=&quot;math&quot; style=&quot;font-size:18px;color:var(--line45)&quot;>&amp;nbsp;&amp;nbsp;&amp;nbsp;&amp;nbsp;= ΔI · <b>1/(1−β)</b></p>
      <p>因 <span class=&quot;math&quot;>0&amp;lt;β&amp;lt;1</span>，等比数列收敛，<span class=&quot;math&quot;>Σβⁿ = 1/(1−β)</span>。于是<b>乘数</b> <span class=&quot;math&quot;>≡ ΔY/ΔI = 1/(1−β) = 1/MPS</span>。</p>
      <p>· <b>β 越大</b>（越爱花钱、漏出越少）⇒ 乘数越大、波动越剧烈；</p>
      <p>· 加入税收 <span class=&quot;math&quot;>T</span>、进口 <span class=&quot;math&quot;>M</span> 等&quot;漏出&quot;后，分母变大、乘数变小（如对外贸易乘数 <span class=&quot;math&quot;>1/(1−β+MPM)</span>）。</p>
      <div class=&quot;note&quot; style=&quot;background:#F4F7FF;border-color:#CBD8F2;color:#274690&quot;><b>前提：</b>乘数效应成立要求经济存在<b>闲置资源</b>（萧条期）、<b>价格水平不变</b>——增产不涨价，新增支出才能全部转化为实际产出。</div>
    </div>
  </div>
</div></section>

<!-- ===================== 5. RELATIONSHIP MAP ===================== -->

const VB={w:600,h:560}, PLOT={x:74,y:34,size:452};
function niceMax(v){const p=Math.pow(10,Math.floor(Math.log10(Math.max(v,1))));const n=v/p;
  const steps=[1,1.25,1.5,2,2.5,3,4,5,6,8,10];let x=10;
  for(const s of steps){if(n<=s){x=s;break;}}return x*p;}
function getYmax(){const a=S.alpha+S.I, ys=a/(1-S.beta);
  let top=Math.max(ys*1.5, (a)+S.beta*ys, 1);
  if(S.step>=6){const y2=(a+S.dI)/(1-S.beta);top=Math.max(top, y2*1.35, (a+S.dI)+S.beta*y2);}
  return niceMax(top);}
function sx(Y,M){return PLOT.x + (Y/M)*PLOT.size;}
function sy(E,M){return PLOT.y + PLOT.size - (E/M)*PLOT.size;}
const fmt=n=>Math.abs(n)>=1000?Math.round(n).toLocaleString():(Math.round(n*10)/10);

function L(x1,y1,x2,y2,col,w,extra=''){return `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${col}&quot; stroke-width=&quot;${w}&quot; ${extra}/>`;}
function T(x,y,t,col,size=14,anchor='start',weight=600,it=false){

function buildMain(){

  // regions

    g+=T(Ex-150,Ey-46,'AE &amp;lt; Y',getCss('--lineAE'),13,'start',700);

  }
  // grid ticks (light)
  for(let i=1;i<=4;i++){const gx=PLOT.x+PLOT.size*i/5, gy=PLOT.y+PLOT.size*i/5;
    g+=L(gx,PLOT.y,gx,Ey,'var(--grid)',1);g+=L(PLOT.x,gy,Ex,gy,'var(--grid)',1);}

  g+=L(PLOT.x,Ey,Ex+14,Ey,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=L(PLOT.x,Ey,PLOT.x,PLOT.y-14,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=T(PLOT.x-8,PLOT.y-18,'E,AE',getCss('--ink'),14,'end',700);

  g+=T(Ex+18,Ey+5,'Y',getCss('--ink'),16,'start',700,true);
  g+=T(Ex+18,Ey+20,'收入/产出',getCss('--ink-soft'),11,'start',600);
  g+=T(PLOT.x-10,Ey+18,'O',getCss('--ink'),14,'end',700);
  // 45 line

  }
  // AE line (AE1)
  if(sh.lae){
    g+=L(sx(0,M),sy(a,M),sx(M,M),sy(a+beta*M,M),getCss('--lineAE'),3);
    const lbl=sh.multi?'AE₁=C+I':'E=C+I';
    g+=T(sx(M,M)+6,sy(a+beta*M,M),lbl,getCss('--lineAE'),14,'start',800,true);
    // intercept marker
    g+=`<circle cx=&quot;${sx(0,M)}&quot; cy=&quot;${sy(a,M)}&quot; r=&quot;3&quot; fill=&quot;${getCss('--lineAE')}&quot;/>`;

  }
  // equilibrium
  if(sh.eq){
    const ex=sx(ystar,M), ey=sy(ystar,M);
    g+=L(ex,ey,ex,Ey,'#192233',1.4,'stroke-dasharray=&quot;5 4&quot;');

      const px=sx(yp,M), aeAt=a+beta*yp;

    const ex=sx(ystar,M);g+=T(ex,Ey+50,'回到 Y*',getCss('--accent')==='#E0A21A'?'#9a6e00':'#9a6e00',12,'middle',700);
  }
  // multiplier (step7)
  if(sh.multi){
    const a2=a+S.dI, y2=a2/(1-beta);
    // AE2
    g+=L(sx(0,M),sy(a2,M),sx(M,M),sy(a2+beta*M,M),getCss('--lineAE'),3,'opacity=&quot;0.85&quot; stroke-dasharray=&quot;1 0&quot;');
    g+=T(sx(M,M)+6,sy(a2+beta*M,M),'AE₂',getCss('--lineAE'),14,'start',800,true);
    // ΔI vertical arrow
    const xv=ystar*0.62, xvp=sx(xv,M);
    g+=L(xvp,sy(a+beta*xv,M),xvp,sy(a2+beta*xv,M),getCss('--violet'),3,'marker-end=&quot;url(#arV)&quot;');
    g+=T(xvp-6,(sy(a+beta*xv,M)+sy(a2+beta*xv,M))/2+4,'ΔI',getCss('--violet'),13,'end',800,true);
    // new equilibrium
    const e2x=sx(y2,M),e2y=sy(y2,M);
    g+=L(e2x,e2y,e2x,Ey,'#192233',1.2,'stroke-dasharray=&quot;5 4&quot;');
    g+=`<circle cx=&quot;${e2x}&quot; cy=&quot;${e2y}&quot; r=&quot;6&quot; fill=&quot;${getCss('--violet')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
    g+=T(e2x,Ey+20,'Y₂',getCss('--violet'),14,'middle',800,true);
    g+=T(sx(ystar,M),Ey+20,'Y₁',getCss('--accent')==='#E0A21A'?'#9a6e00':'#9a6e00',14,'middle',800,true);
    // ΔY horizontal arrow

      g+=`<path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;${getCss('--violet')}&quot; stroke-width=&quot;2&quot; opacity=&quot;0.9&quot;/>`;

  }
  g+='</svg>';
  return g;

let _cssCache={};

/* ============ C–S 小图 ============ */
function buildCS(){
  const beta=S.beta, alpha=S.alpha, M=niceMax(Math.max((alpha/(1-beta))*1.9, alpha*2.4, 1));
  const x0=58,y0=24,size=300, Ex=x0+size, Ey=y0+size*0.62; // 横轴抬高，给负储蓄留空间
  const total=size; const zeroY=y0+size*0.62;
  function sxx(Y){return x0+(Y/M)*size;}
  function syy(E){return zeroY-(E/M)*size;}
  const y1=alpha/(1-beta);
  let g=`<svg class=&quot;fig&quot; viewBox=&quot;0 0 ${Ex+70} ${y0+size+40}&quot; role=&quot;img&quot; aria-label=&quot;消费与储蓄函数&quot;>`;
  g+=`<defs><marker id=&quot;ar2&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;#192233&quot;/></marker></defs>`;
  // axes
  g+=L(x0,zeroY,Ex+14,zeroY,'#192233',2,'marker-end=&quot;url(#ar2)&quot;');
  g+=L(x0,y0+size+6,x0,y0-14,'#192233',2,'marker-end=&quot;url(#ar2)&quot;');
  g+=T(x0-8,y0-18,'C,S',getCss('--ink'),13,'end',700);
  g+=T(Ex+18,zeroY+5,'Y',getCss('--ink'),15,'start',700,true);
  g+=T(x0-10,zeroY+16,'O',getCss('--ink'),13,'end',700);
  // 45 line
  g+=L(x0,zeroY,sxx(M),syy(M),getCss('--line45'),2.4);
  g+=T(sxx(M)-2,syy(M)+4,'C=Y',getCss('--line45'),12,'end',700,true);
  // C line
  g+=L(sxx(0),syy(alpha),sxx(M),syy(alpha+beta*M),getCss('--lineAE'),2.8);
  g+=T(sxx(M)+4,syy(alpha+beta*M),'C',getCss('--lineAE'),14,'start',800,true);
  g+=`<circle cx=&quot;${sxx(0)}&quot; cy=&quot;${syy(alpha)}&quot; r=&quot;3&quot; fill=&quot;${getCss('--lineAE')}&quot;/>`;
  g+=T(sxx(0)-6,syy(alpha)-4,'α',getCss('--lineAE'),12,'end',700,true);
  // S line
  g+=L(sxx(0),syy(-alpha),sxx(M),syy(-alpha+(1-beta)*M),getCss('--lineSave'),2.8);
  g+=T(sxx(M)+4,syy(-alpha+(1-beta)*M),'S',getCss('--lineSave'),14,'start',800,true);
  g+=`<circle cx=&quot;${sxx(0)}&quot; cy=&quot;${syy(-alpha)}&quot; r=&quot;3&quot; fill=&quot;${getCss('--lineSave')}&quot;/>`;
  g+=T(sxx(0)-6,syy(-alpha)+12,'−α',getCss('--lineSave'),12,'end',700,true);
  // break-even Y1
  const bx=sxx(y1);
  g+=L(bx,syy(y1),bx,zeroY,'#192233',1.3,'stroke-dasharray=&quot;5 4&quot;');
  g+=`<circle cx=&quot;${bx}&quot; cy=&quot;${syy(y1)}&quot; r=&quot;5.5&quot; fill=&quot;${getCss('--accent')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
  g+=`<circle cx=&quot;${bx}&quot; cy=&quot;${zeroY}&quot; r=&quot;4&quot; fill=&quot;${getCss('--lineSave')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.5&quot;/>`;
  g+=T(bx,zeroY+18,'Y₁',getCss('--ink'),13,'middle',800,true);
  g+=T(bx+8,syy(y1)-8,'A · S=0',getCss('--ink-soft'),11,'start',700);
  g+='</svg>';
  return g;
}

/* ============ 乘数轮次 ============ */
function buildRounds(){
  const beta=S.beta, dI=S.dI; let rows='', cum=0;
  const labels=['第0轮·投资本身','第1轮·引致消费','第2轮·引致消费','第3轮·引致消费','第4轮·引致消费'];
  let html=`<table style=&quot;width:100%;border-collapse:collapse;font-size:13.5px&quot;>
    <tr style=&quot;color:var(--ink-faint);font-size:12px&quot;><th style=&quot;text-align:left;padding:4px&quot;>轮次</th><th style=&quot;text-align:right&quot;>本轮 ΔY</th><th style=&quot;text-align:right&quot;>累计 ΔY</th></tr>`;
  for(let k=0;k<5;k++){const v=dI*Math.pow(beta,k);cum+=v;
    html+=`<tr style=&quot;border-top:1px solid var(--border)&quot;><td style=&quot;padding:6px 4px&quot;>${labels[k]} <span class=&quot;math&quot; style=&quot;color:var(--lineAE)&quot;>ΔI·β${k===0?'⁰':'<sup>'+k+'</sup>'}</span></td>
    <td style=&quot;text-align:right;font-family:Georgia;font-style:italic&quot;>${fmt(v)}</td>
    <td style=&quot;text-align:right;font-family:Georgia;font-style:italic;color:var(--violet)&quot;>${fmt(cum)}</td></tr>`;}
  const total=dI/(1-beta);
  html+=`<tr style=&quot;border-top:2px solid var(--ink)&quot;><td style=&quot;padding:7px 4px;font-weight:800&quot;>⋯ 无穷轮 加总</td>
    <td></td><td style=&quot;text-align:right;font-family:Georgia;font-style:italic;font-weight:800;color:var(--line45);font-size:16px&quot;>${fmt(total)}</td></tr></table>
    <p style=&quot;font-size:12.5px;color:var(--ink-soft);margin-top:8px&quot;>当前 β=${S.beta.toFixed(2)} ⇒ 乘数 = 1/(1−β) = <span class=&quot;math&quot; style=&quot;color:var(--line45)&quot;>${(1/(1-beta)).toFixed(2)}</span>，故 ΔI=${dI} 最终撬动 ΔY≈${fmt(total)}。</p>`;
  return html;
}

/* ============ 渲染 &amp; 读数 ============ */
function render(){
  document.getElementById('figHost').innerHTML=buildMain();
  document.getElementById('csHost').innerHTML=buildCS();
  document.getElementById('roundsHost').innerHTML=buildRounds();
  // step text
  const st=STEPS[S.step];
  document.getElementById('stepTag').textContent=`${st.tag} （第 ${S.step+1} / ${STEPS.length} 步）`;
  document.getElementById('stepTitle').textContent=st.title;
  document.getElementById('stepBody').innerHTML=st.body;
  document.getElementById('prevBtn').disabled=S.step===0;
  // next button becomes demo trigger on last step
  const nb=document.getElementById('nextBtn');
  if(S.step===STEPS.length-1){nb.textContent='▶ 演示乘数收敛';nb.classList.add('primary');}
  else{nb.textContent='下一步 ›';nb.disabled=false;}
  // dots
  document.getElementById('dots').innerHTML=STEPS.map((_,i)=>`<i class=&quot;${i===S.step?'on':''}&quot; data-i=&quot;${i}&quot;></i>`).join('');
  document.querySelectorAll('#dots i').forEach(d=>d.onclick=()=>{S.step=+d.dataset.i;S.anim=0;stopAnim();render();});
  document.getElementById('diWrap').style.display=S.step===STEPS.length-1?'block':'none';
  // sliders + readouts
  document.getElementById('aVal').textContent=' = '+S.alpha;
  document.getElementById('bVal').textContent=' = '+S.beta.toFixed(2);
  document.getElementById('iVal').textContent=' = '+S.I;
  document.getElementById('diVal').textContent=' = '+S.dI;
  const a=S.alpha+S.I, k=1/(1-S.beta), ystar=a/(1-S.beta);
  document.getElementById('roA').textContent=fmt(a);
  document.getElementById('roK').textContent=k.toFixed(2);
  document.getElementById('roY').textContent=fmt(ystar);
  const apc=ystar>0?(S.alpha+S.beta*ystar)/ystar:NaN;
  document.getElementById('roX').textContent=isFinite(apc)?apc.toFixed(2):'—';
  document.getElementById('roXk').innerHTML='APC @ Y* ＝ '+ (isFinite(apc)&amp;&amp;apc>S.beta?'<span style=&quot;color:var(--line45)&quot;>&amp;gt;β</span>':'');
  // CS readouts
  document.getElementById('csMPC').textContent=S.beta.toFixed(2);
  document.getElementById('csMPS').textContent=(1-S.beta).toFixed(2);
  const y1=S.alpha/(1-S.beta);
  document.getElementById('csY1').textContent=fmt(y1);
  document.getElementById('csAPC').textContent='1.00';
}
function stopAnim(){if(S.timer){clearInterval(S.timer);S.timer=null;}}
function playMultiplier(){
  S.anim=0;stopAnim();
  S.timer=setInterval(()=>{S.anim+=0.06; if(S.anim>=1){S.anim=1;stopAnim();} render();},45);
}

/* ============ 事件 ============ */
document.getElementById('nextBtn').onclick=()=>{
  if(S.step<STEPS.length-1){S.step++;S.anim=0;stopAnim();render();}
  else{playMultiplier();}
};
document.getElementById('prevBtn').onclick=()=>{if(S.step>0){S.step--;S.anim=0;stopAnim();render();}};
function bind(id,key,parse){document.getElementById(id).addEventListener('input',e=>{
  S[key]=parse(e.target.value); if(key!=='dI'){S.anim=0;stopAnim();} render();});}
bind('aRange','alpha',v=>+v); bind('bRange','beta',v=>+v); bind('iRange','I',v=>+v); bind('diRange','dI',v=>+v);
// init slider positions
document.getElementById('aRange').value=S.alpha;
document.getElementById('bRange').value=S.beta;
document.getElementById('iRange').value=S.I;
document.getElementById('diRange').value=S.dI;
render();
</script>

<body>

<header class=&quot;hero&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;eyebrow&quot;>宏观四大核心图 · 第二张</div>
  <h1>推导 <em>IS-LM 模型图</em><br>产品市场 × 货币市场，同时出清</h1>
  <p class=&quot;lead&quot;>一条向下的 <b style=&quot;color:var(--is)&quot;>IS</b>（产品市场 Y=AD）、一条向上的 <b style=&quot;color:var(--lm)&quot;>LM</b>（货币市场 M=L），交点 <b class=&quot;math&quot;>E(Y₀, r₀)</b> 同时决定均衡收入和利率。拖滑块改斜率、点场景看政策怎么移动曲线——财政、货币、挤出、政策配合,一次看懂。</p>
  <svg class=&quot;mini&quot; viewBox=&quot;0 0 240 200&quot;>
    <line x1=&quot;22&quot; y1=&quot;178&quot; x2=&quot;232&quot; y2=&quot;178&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot;/>
    <line x1=&quot;22&quot; y1=&quot;178&quot; x2=&quot;22&quot; y2=&quot;14&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot;/>
    <line x1=&quot;40&quot; y1=&quot;30&quot; x2=&quot;210&quot; y2=&quot;150&quot; stroke=&quot;#B3123A&quot; stroke-width=&quot;3&quot;/>
    <line x1=&quot;40&quot; y1=&quot;160&quot; x2=&quot;210&quot; y2=&quot;40&quot; stroke=&quot;#1B3A8C&quot; stroke-width=&quot;3&quot;/>
    <circle cx=&quot;125&quot; cy=&quot;90&quot; r=&quot;6&quot; fill=&quot;#E0A21A&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>
  </svg>
</div></header>

<nav class=&quot;toc&quot;><div class=&quot;wrap&quot;>
  <a href=&quot;#gloss&quot;>① 字母词典</a>

<!-- 1 GLOSSARY -->
<section id=&quot;gloss&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>01</span><h2>字母词典：IS-LM 的符号表</h2></div>
  <p class=&quot;sub&quot;>两条曲线各自代表一个市场的均衡：<b style=&quot;color:var(--is)&quot;>IS</b> 管产品市场，<b style=&quot;color:var(--lm)&quot;>LM</b> 管货币市场。坐标轴换成了 <span class=&quot;math&quot;>r</span>（纵）与 <span class=&quot;math&quot;>Y</span>（横）。先认全符号,再看推导。</p>
  <div class=&quot;gloss&quot; id=&quot;glossGrid&quot;></div>
  <div class=&quot;note&quot;><b>记号说明：</b>讲义里 MPC 有时写 <span class=&quot;math&quot;>β</span>、有时写 <span class=&quot;math&quot;>c</span>，指同一个东西（边际消费倾向）。货币供给 <span class=&quot;math&quot;>M</span> 在图里默认是<b>实际</b>货币供给 <span class=&quot;math&quot;>M/P</span>（价格 P 暂时固定）。</p>
</div></section>

<!-- 2 THEATER -->
<section id=&quot;theater&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>02</span><h2>分步推导剧场</h2></div>
  <p class=&quot;sub&quot;>点 <b>下一步</b> 让 IS、LM 依次长出来，到均衡 E，再到失衡时如何调整回 E。任何时候拖动 <span class=&quot;math&quot;>β、d、k、h</span> 看斜率怎么变、<span class=&quot;math&quot;>Ā、M</span> 看曲线怎么平移。</p>
  <div class=&quot;legend&quot;>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--is)&quot;></i>IS（产品市场 Y=AD）</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--lm)&quot;></i>LM（货币市场 M=L）</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--accent)&quot;></i>均衡点 E</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--green)&quot;></i>失衡调整箭头</span>
  </div>
  <div class=&quot;stage&quot;>
    <div class=&quot;figbox&quot;><div id=&quot;coreHost&quot;></div></div>
    <div class=&quot;controls&quot;>
      <div class=&quot;stepwrap&quot;>
        <div class=&quot;step-tag&quot; id=&quot;cTag&quot;></div>
        <div class=&quot;step-title&quot; id=&quot;cTitle&quot;></div>
        <div class=&quot;step-body&quot; id=&quot;cBody&quot;></div>
        <div class=&quot;preset&quot; id=&quot;presetWrap&quot; style=&quot;display:none&quot;>
          <span style=&quot;font-size:12.5px;color:var(--ink-faint);font-weight:600;align-self:center&quot;>放一个失衡点：</span>
          <button class=&quot;btn&quot; data-r=&quot;A&quot;>A</button><button class=&quot;btn&quot; data-r=&quot;B&quot;>B</button>
          <button class=&quot;btn&quot; data-r=&quot;C&quot;>C</button><button class=&quot;btn&quot; data-r=&quot;D&quot;>D</button>
          <button class=&quot;btn&quot; data-r=&quot;clear&quot;>清除</button>
        </div>
      </div>
      <div class=&quot;stepnav&quot;>
        <button class=&quot;btn&quot; id=&quot;prevBtn&quot;>‹ 上一步</button>
        <button class=&quot;btn primary&quot; id=&quot;nextBtn&quot;>下一步 ›</button>
        <div class=&quot;dots&quot; id=&quot;dots&quot;></div>
      </div>
      <div class=&quot;sliders&quot;>
        <div class=&quot;slider&quot;><label>自发支出 <span class=&quot;math&quot;>Ā</span>（移动 IS）<span class=&quot;v&quot; id=&quot;vA&quot;></span></label><input type=&quot;range&quot; id=&quot;rA&quot; min=&quot;120&quot; max=&quot;480&quot; step=&quot;10&quot;></div>
        <div class=&quot;slider&quot;><label>实际货币供给 <span class=&quot;math&quot;>M</span>（移动 LM）<span class=&quot;v&quot; id=&quot;vM&quot;></span></label><input type=&quot;range&quot; id=&quot;rM&quot; min=&quot;80&quot; max=&quot;360&quot; step=&quot;10&quot;></div>
        <details class=&quot;adv&quot;><summary>斜率与敏感度（高级）</summary>
          <div style=&quot;margin-top:10px&quot;>
            <div class=&quot;slider&quot;><label>边际消费倾向 <span class=&quot;math&quot;>β = c</span><span class=&quot;v&quot; id=&quot;vB&quot;></span></label><input type=&quot;range&quot; id=&quot;rB&quot; min=&quot;0.4&quot; max=&quot;0.85&quot; step=&quot;0.05&quot;></div>
            <div class=&quot;slider&quot;><label>投资对利率敏感度 <span class=&quot;math&quot;>d</span><span class=&quot;v&quot; id=&quot;vD&quot;></span></label><input type=&quot;range&quot; id=&quot;rD&quot; min=&quot;8&quot; max=&quot;40&quot; step=&quot;2&quot;></div>
            <div class=&quot;slider&quot;><label>货币需求·收入敏感度 <span class=&quot;math&quot;>k</span><span class=&quot;v&quot; id=&quot;vK&quot;></span></label><input type=&quot;range&quot; id=&quot;rK&quot; min=&quot;0.3&quot; max=&quot;1.2&quot; step=&quot;0.05&quot;></div>
            <div class=&quot;slider&quot;><label>货币需求·利率敏感度 <span class=&quot;math&quot;>h</span><span class=&quot;v&quot; id=&quot;vH&quot;></span></label><input type=&quot;range&quot; id=&quot;rH&quot; min=&quot;10&quot; max=&quot;45&quot; step=&quot;2&quot;></div>
          </div>
        </details>
        <div class=&quot;readout&quot;>
          <div class=&quot;ro eqY&quot;><div class=&quot;k&quot;>均衡收入 Y₀</div><div class=&quot;val&quot; id=&quot;oY&quot;></div></div>
          <div class=&quot;ro eqR&quot;><div class=&quot;k&quot;>均衡利率 r₀</div><div class=&quot;val&quot; id=&quot;oR&quot;></div></div>
          <div class=&quot;ro&quot;><div class=&quot;k&quot;>IS 斜率 −(1−β)/d</div><div class=&quot;val&quot; id=&quot;oIS&quot;></div></div>
          <div class=&quot;ro&quot;><div class=&quot;k&quot;>LM 斜率 k/h</div><div class=&quot;val&quot; id=&quot;oLM&quot;></div></div>
        </div>
      </div>
      <div class=&quot;eqcards&quot;>
        <div class=&quot;eqc is&quot;><h4 style=&quot;color:var(--is)&quot;>IS · 产品市场 Y=AD</h4>
          <div class=&quot;f&quot;>Y = Ā/(1−β) − [d/(1−β)]·r</div>
          <p>由 AE=C+I+G+NX、C=α+β(Y−T)、I=e−dr，令 Y=AE 解出。<b>下倾</b>：r↓→I↑→Y↑。</p></div>
        <div class=&quot;eqc lm&quot;><h4 style=&quot;color:var(--lm)&quot;>LM · 货币市场 M=L</h4>
          <div class=&quot;f&quot;>M = kY − hr ⇒ r = (k/h)Y − M/h</div>
          <p>实际货币需求 L=kY−hr，令 M/P=L 解出。<b>上倾</b>：Y↑→货币需求↑→r↑。</p></div>
      </div>
    </div>
  </div>
</div></section>

<!-- 3 LAB -->
<section id=&quot;lab&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>03</span><h2>政策实验室：让曲线动起来</h2></div>
  <p class=&quot;sub&quot;>选一个冲击/政策，看曲线从 <b>1</b> 移到 <b>2</b>、均衡从 E 走到新点，右侧按步骤标注 ΔY、Δr 与传导链。结构参数沿用上面的滑块。</p>
  <div class=&quot;stage&quot;>
    <div class=&quot;figbox&quot;><div id=&quot;labHost&quot;></div></div>
    <div class=&quot;controls&quot;>
      <div class=&quot;scenarios&quot;>
        <div class=&quot;scn&quot; data-s=&quot;fiscalG&quot;><div class=&quot;t&quot;>扩张性财政 · ΔG↑</div><div class=&quot;d&quot;>IS 右移 ΔG/(1−c)，Y↑、r↑（挤出）</div></div>
        <div class=&quot;scn&quot; data-s=&quot;investDown&quot;><div class=&quot;t&quot;>投资下降 · ΔI↓</div><div class=&quot;d&quot;>IS 左移，Y↓、r↓</div></div>
        <div class=&quot;scn&quot; data-s=&quot;money&quot;><div class=&quot;t&quot;>扩张性货币 · ΔM↑</div><div class=&quot;d&quot;>LM 右移/下移，Y↑、r↓</div></div>
        <div class=&quot;scn&quot; data-s=&quot;mix&quot;><div class=&quot;t&quot;>政策配合 · 增税+扩货币</div><div class=&quot;d&quot;>IS 左移 + LM 右移，Y 不变、r↓</div></div>
      </div>
      <div class=&quot;stepnav&quot;>
        <button class=&quot;btn primary&quot; id=&quot;playBtn&quot; disabled>▶ 演示移动</button>
        <button class=&quot;btn&quot; id=&quot;resetBtn&quot; disabled>重置</button>
      </div>
      <div class=&quot;chainbox&quot; id=&quot;chainBox&quot;><div class=&quot;ttl&quot;>选一个场景</div><div style=&quot;font-size:13.5px;color:var(--ink-soft)&quot;>点上方任一卡片，这里会显示该政策的传导步骤与图形变化。</div></div>
      <div class=&quot;readout&quot;>
        <div class=&quot;ro eqY&quot;><div class=&quot;k&quot;>收入变化 ΔY</div><div class=&quot;val&quot; id=&quot;dY&quot;>—</div></div>
        <div class=&quot;ro eqR&quot;><div class=&quot;k&quot;>利率变化 Δr</div><div class=&quot;val&quot; id=&quot;dR&quot;>—</div></div>
      </div>
    </div>
  </div>
</div></section>

<!-- 4 TRANSMISSION + TABLE -->
<section id=&quot;trans&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>04</span><h2>传导机制 · 政策组合表</h2></div>
  <div class=&quot;duo&quot;>
    <div class=&quot;panel&quot;>
      <h3>两条传导链（务必背熟）</h3>
      <p><b>财政（走产品市场）：</b></p>
      <p class=&quot;chain&quot;>ΔG↑ → IS 右移 → Y↑ → 货币交易需求↑ → r↑ → 私人投资 I↓</p>
      <p>利率上升挤掉一部分私人投资，故实际 <span class=&quot;math&quot;>ΔY &amp;lt; ΔG/(1−c)</span>——这就是<b>挤出效应</b>。</p>
      <p style=&quot;margin-top:14px&quot;><b>货币（走货币市场）：</b></p>
      <p class=&quot;chain&quot;>ΔM↑ → r↓ → I↑ → Y↑</p>
      <p>货币政策不直接进入产品市场，而是<b>先压低利率</b>、再带动投资和收入，<b>无挤出</b>，且利率下降。</p>
      <div class=&quot;note&quot;><b>挤出大小取决于：</b>支出乘数越大、k 越大、h 越小、d 越大 ⇒ 挤出越强（LM 越陡、投资越敏感，财政越容易被挤出）。</div>
    </div>
    <div class=&quot;panel&quot;>
      <h3>四种财政—货币组合</h3>
      <table class=&quot;tbl&quot;>
        <tr><th>政策组合</th><th>IS</th><th>LM</th><th>Y</th><th>r</th></tr>
        <tr><td class=&quot;l&quot;>扩张财政 G↑</td><td>右移</td><td>—</td><td class=&quot;up&quot;>↑</td><td class=&quot;up&quot;>↑</td></tr>
        <tr><td class=&quot;l&quot;>扩张货币 M↑</td><td>—</td><td>右移</td><td class=&quot;up&quot;>↑</td><td class=&quot;dn&quot;>↓</td></tr>
        <tr><td class=&quot;l&quot;>扩财政 + 扩货币</td><td>右移</td><td>右移</td><td class=&quot;up&quot;>↑↑</td><td class=&quot;nc&quot;>不确定</td></tr>
        <tr><td class=&quot;l&quot;>紧财政 + 扩货币</td><td>左移</td><td>右移</td><td class=&quot;nc&quot;>可不变</td><td class=&quot;dn&quot;>↓</td></tr>
        <tr><td class=&quot;l&quot;>扩财政 + 紧货币</td><td>右移</td><td>左移</td><td class=&quot;nc&quot;>不确定</td><td class=&quot;up&quot;>↑</td></tr>
      </table>
      <p style=&quot;font-size:13px;color:var(--ink-soft);margin-top:10px&quot;>配合的妙处：扩财政推高利率、扩货币压低利率，两者对冲 ⇒ <b>收入大增而利率基本不变</b>，避免挤出。这正是&quot;政策配合&quot;场景演示的内容。</p>
    </div>
  </div>
</div></section>

<!-- 5 MAP -->
<section id=&quot;map&quot; style=&quot;border-bottom:none&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>05</span><h2>它从哪来、到哪去</h2></div>
  <div class=&quot;duo&quot;>
    <div class=&quot;panel&quot;>
      <h3>IS 从 45°线模型来</h3>
      <p>上一张图（45°线/收入-支出模型）在<b>利率固定</b>下求一个均衡 Y。现在让利率 <span class=&quot;math&quot;>r</span> 变动：每给一个 r，投资 I=e−dr 不同，45°线模型就解出一个不同的均衡 Y——把这些 <span class=&quot;math&quot;>(Y, r)</span> 点连起来，就是 <b style=&quot;color:var(--is)&quot;>IS 曲线</b>。</p>
      <p>所以 IS 的<b>水平移动距离 = 乘数 × 自发支出变动 = ΔĀ/(1−c)</b>，乘数效应在这里&quot;复活&quot;为 IS 的位移。</p>
    </div>
    <div class=&quot;panel&quot;>
      <h3>IS-LM 往 AD-AS 去</h3>
      <p>目前价格 <span class=&quot;math&quot;>P</span> 固定。若让 P 变动：P↓ ⇒ 实际货币供给 M/P↑ ⇒ LM 右移 ⇒ 均衡 Y↑。把不同 P 对应的均衡 <span class=&quot;math&quot;>(Y, P)</span> 连起来，就得到<b>总需求曲线 AD</b>（向右下倾斜）。</p>
      <p>于是顺序是：<b>消费函数 → 45°线均衡 → IS-LM 共同均衡 → AD-AS</b>，层层向上嵌套，构成宏观四大核心图的主线。</p>
    </div>
  </div>
</div></section>

<footer><div class=&quot;wrap&quot;>交互推导工具 · 依《经济学原理（宏观部分）》课程口径编制。IS=Y/AD 产品市场，LM=M/L 货币市场，所有曲线随参数实时联动。</div></footer>

<script>
/* ===== 词典 ===== */
const GLOSS=[
 [&quot;r&quot;,&quot;利率&quot;,&quot;Interest rate&quot;,&quot;纵轴。资金的价格，连接投资与货币需求。&quot;,&quot;p-is&quot;],
 [&quot;Y&quot;,&quot;收入/产出&quot;,&quot;Output / National income&quot;,&quot;横轴。总收入＝总产出（GDP）。&quot;,&quot;p-is&quot;],
 [&quot;IS&quot;,&quot;产品市场均衡曲线&quot;,&quot;IS curve · Investment = Saving&quot;,&quot;满足 Y=AD（即 I=S）的 (r,Y) 组合，<b>向下倾斜</b>。&quot;,&quot;p-is&quot;],
 [&quot;LM&quot;,&quot;货币市场均衡曲线&quot;,&quot;LM curve · Liquidity = Money&quot;,&quot;满足 M=L 的 (r,Y) 组合，<b>向上倾斜</b>。&quot;,&quot;p-lm&quot;],
 [&quot;E&quot;,&quot;共同均衡点&quot;,&quot;General equilibrium&quot;,&quot;IS∩LM＝(Y₀,r₀)，两市场<b>同时</b>出清。&quot;,&quot;p-par&quot;],
 [&quot;M&quot;,&quot;实际货币供给&quot;,&quot;Real money supply&quot;,&quot;M/P，央行可调。M↑ ⇒ LM 右移。&quot;,&quot;p-lm&quot;],
 [&quot;L&quot;,&quot;货币需求&quot;,&quot;Money demand (liquidity preference)&quot;,&quot;流动性偏好 L=kY−hr，与 Y 正相关、与 r 负相关。&quot;,&quot;p-lm&quot;],
 [&quot;k&quot;,&quot;货币需求·收入敏感度&quot;,&quot;Income sensitivity of money demand&quot;,&quot;k 越大，LM <b>越陡</b>（收入升一点就要大涨利率）。&quot;,&quot;p-lm&quot;],
 [&quot;h&quot;,&quot;货币需求·利率敏感度&quot;,&quot;Interest sensitivity of money demand&quot;,&quot;h 越大，LM <b>越平</b>。h→∞ 即流动性陷阱。&quot;,&quot;p-lm&quot;],
 [&quot;d&quot;,&quot;投资·利率敏感度&quot;,&quot;Interest sensitivity of investment&quot;,&quot;I=e−dr。d 越大，IS <b>越平</b>。&quot;,&quot;p-is&quot;],
 [&quot;β / c&quot;,&quot;边际消费倾向 MPC&quot;,&quot;Marginal propensity to consume&quot;,&quot;决定乘数 1/(1−β)。β 越大，IS <b>越平</b>。&quot;,&quot;p-par&quot;],
 [&quot;Ā&quot;,&quot;自发支出&quot;,&quot;Autonomous spending&quot;,&quot;α+e+G+NX−βT 等自发部分。Ā↑ ⇒ IS 右移。&quot;,&quot;p-par&quot;],
 [&quot;AD&quot;,&quot;总需求&quot;,&quot;Aggregate demand&quot;,&quot;计划总支出 C+I+G+NX。IS 上 Y=AD。&quot;,&quot;p-is&quot;],
 [&quot;挤出效应&quot;,&quot;挤出效应&quot;,&quot;Crowding-out effect&quot;,&quot;G↑ 抬高利率、压低私人投资，使 ΔY&amp;lt;ΔG/(1−c)。&quot;,&quot;p-pol&quot;],
 [&quot;流动性陷阱&quot;,&quot;流动性陷阱&quot;,&quot;Liquidity trap&quot;,&quot;利率极低、LM 近水平，货币政策近乎失效、财政最有效。&quot;,&quot;p-pol&quot;],
 [&quot;ΔG/ΔM&quot;,&quot;政策工具&quot;,&quot;Policy instruments&quot;,&quot;ΔG 移动 IS、ΔM 移动 LM，是两类政策的抓手。&quot;,&quot;p-pol&quot;],
];
(function(){const g=document.getElementById('glossGrid');
 GLOSS.forEach(([s,cn,en,d,p])=>{const e=document.createElement('div');e.className='card';
  const col=p==='p-is'?'var(--is)':p==='p-lm'?'var(--lm)':p==='p-pol'?'var(--violet)':'#9a6e00';
  e.innerHTML=`<span class=&quot;sym&quot; style=&quot;color:${col}&quot;>${s}</span><span class=&quot;cn&quot;>${cn}</span><div class=&quot;en&quot;>${en}</div><div class=&quot;desc&quot;>${d}</div><span class=&quot;pill ${p}&quot;>${p==='p-is'?'产品市场/IS':p==='p-lm'?'货币市场/LM':p==='p-pol'?'政策概念':'行为参数'}</span>`;
  g.appendChild(e);});})();

/* ===== 共享状态 ===== */
const P={Abar:300,M:200,beta:0.6,d:20,k:0.75,h:25};
const CORE={step:0,pt:null,frame:null};
const LAB={scn:null,t:0,timer:null};

/* ===== 经济学计算 ===== */
function eqm(p){const denom=(p.k/p.h)+(1-p.beta)/p.d;const Y=(p.Abar/p.d+p.M/p.h)/denom;const r=(p.k/p.h)*Y-p.M/p.h;return {Y,r};}
function isR(Y,p){return p.Abar/p.d-((1-p.beta)/p.d)*Y;}
function lmR(Y,p){return (p.k/p.h)*Y-p.M/p.h;}
function niceMax(v){const pw=Math.pow(10,Math.floor(Math.log10(Math.max(v,1))));const n=v/pw;const st=[1,1.25,1.5,2,2.5,3,4,5,6,8,10];let x=10;for(const s of st){if(n<=s){x=s;break;}}return x*pw;}
function frame(sets){let ymax=1;sets.forEach(p=>{const e=eqm(p);ymax=Math.max(ymax,p.Abar/(1-p.beta),e.Y);});const Ymax=niceMax(ymax*1.1);
 let rmax=1;sets.forEach(p=>{const e=eqm(p);rmax=Math.max(rmax,p.Abar/p.d,e.r);});return {Ymax,Rmax:niceMax(rmax*1.15)};}

/* ===== 绘图基元 ===== */
const VB={w:600,h:520},PL={x:70,y:30,w:470,h:430};
function _css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function L(x1,y1,x2,y2,c,w,ex=''){return `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; ${ex}/>`;}
function T(x,y,t,c,s=14,a='start',w=600,it=false){return `<text x=&quot;${x}&quot; y=&quot;${y}&quot; fill=&quot;${c}&quot; font-size=&quot;${s}&quot; text-anchor=&quot;${a}&quot; font-weight=&quot;${w}&quot; ${it?'font-style=&quot;italic&quot; font-family=&quot;Georgia,serif&quot;':'font-family=&quot;PingFang SC,sans-serif&quot;'}>${t}</text>`;}
function sx(Y,f){return PL.x+(Y/f.Ymax)*PL.w;}
function sy(r,f){return PL.y+PL.h-(r/f.Rmax)*PL.h;}
function clampY(Y,f){return Math.max(0,Math.min(f.Ymax,Y));}
function clampR(r,f){return Math.max(0,Math.min(f.Rmax,r));}
/* 画一条直线（按斜率），裁剪到画布内 */
function curve(p,fn,f,col,wd,ex=''){
  // sample endpoints at Y=0 and Y=Ymax, then clip r into [0,Rmax]
  let pts=[];const N=40;
  for(let i=0;i<=N;i++){const Y=f.Ymax*i/N;const r=fn(Y,p);if(r>=-0.5&amp;&amp;r<=f.Rmax*1.02){pts.push([sx(clampY(Y,f),f),sy(clampR(r,f),f)]);}}
  if(pts.length<2)return '';
  let d='M'+pts[0][0]+' '+pts[0][1];for(let i=1;i<pts.length;i++)d+=' L'+pts[i][0]+' '+pts[i][1];
  return `<path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;${col}&quot; stroke-width=&quot;${wd}&quot; ${ex}/>`;
}
function axes(f,title){
  const Ey=PL.y+PL.h,Ex=PL.x+PL.w;
  let g=`<svg class=&quot;fig&quot; viewBox=&quot;0 0 ${VB.w} ${VB.h}&quot; role=&quot;img&quot; aria-label=&quot;${title||'IS-LM 图'}&quot;>`;
  g+=`<defs>
   <marker id=&quot;ax&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;#192233&quot;/></marker>
   <marker id=&quot;vio&quot; markerWidth=&quot;10&quot; markerHeight=&quot;10&quot; refX=&quot;7&quot; refY=&quot;5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;#7A3FB0&quot;/></marker>
   <marker id=&quot;grn&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;#178A49&quot;/></marker>
   <clipPath id=&quot;pc&quot;><rect x=&quot;${PL.x}&quot; y=&quot;${PL.y-2}&quot; width=&quot;${PL.w}&quot; height=&quot;${PL.h+2}&quot;/></clipPath></defs>`;
  for(let i=1;i<=4;i++){const gx=PL.x+PL.w*i/5,gy=PL.y+PL.h*i/5;g+=L(gx,PL.y,gx,Ey,'var(--grid)',1);g+=L(PL.x,gy,Ex,gy,'var(--grid)',1);}
  g+=L(PL.x,Ey,Ex+14,Ey,'#192233',2,'marker-end=&quot;url(#ax)&quot;');
  g+=L(PL.x,Ey,PL.x,PL.y-14,'#192233',2,'marker-end=&quot;url(#ax)&quot;');
  g+=T(PL.x-8,PL.y-16,'r',_css('--ink'),16,'end',800,true);g+=T(PL.x-8,PL.y-2,'利率',_css('--ink-soft'),11,'end',600);
  g+=T(Ex+18,Ey+5,'Y',_css('--ink'),16,'start',800,true);g+=T(Ex+18,Ey+20,'收入/产出',_css('--ink-soft'),11,'start',600);
  g+=T(PL.x-10,Ey+18,'O',_css('--ink'),14,'end',700);
  return g;
}
function eqDot(p,f,label,col,subY,subR){
  const e=eqm(p);const ex=sx(e.Y,f),ey=sy(e.r,f);let g='';
  g+=L(ex,ey,ex,PL.y+PL.h,'#192233',1.3,'stroke-dasharray=&quot;5 4&quot;');
  g+=L(ex,ey,PL.x,ey,'#192233',1.3,'stroke-dasharray=&quot;5 4&quot;');
  g+=`<circle cx=&quot;${ex}&quot; cy=&quot;${ey}&quot; r=&quot;6.5&quot; fill=&quot;${col}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
  g+=T(ex+11,ey-9,label,col,15,'start',800);
  if(subY)g+=T(ex,PL.y+PL.h+19,subY,_css('--ink'),13,'middle',700,true);
  if(subR)g+=T(PL.x-7,ey+4,subR,_css('--ink'),13,'end',700,true);
  return g;
}

/* ===== 推导步骤 ===== */
const STEPS=[
 {tag:&quot;第 1 步 · 坐标系&quot;,title:&quot;换了坐标：纵 r，横 Y&quot;,
  body:`<b>前提：</b>价格 P 暂时固定，研究短期。<br><b>变量：</b>纵轴是<span class=&quot;math&quot;>利率 r</span>，横轴是<span class=&quot;math&quot;>收入/产出 Y</span>。<br><b>关键：</b>这张图要把<span class=&quot;key&quot;>产品市场和货币市场画在一起</span>，所以需要一个两者都含的变量——利率 r 正是桥梁。`,
  flags:{}},
 {tag:&quot;第 2 步 · IS 曲线&quot;,title:&quot;IS：产品市场均衡，向下倾斜&quot;,
  body:`<b>含义：</b>线上每点都满足 <span class=&quot;math&quot;>Y=AD（I=S）</span>，产品市场出清。<br><b>推导：</b>AE=C+I+G+NX，代入 C=α+β(Y−T)、I=e−dr，令 Y=AE ⇒ <span class=&quot;math&quot;>Y=Ā/(1−β)−[d/(1−β)]r</span>。<br><b>为何下倾：</b><span class=&quot;key&quot;>r↓→投资 I↑→经乘数 Y↑</span>。β 大或 d 大 ⇒ IS 越平。`,
  flags:{is:1}},
 {tag:&quot;第 3 步 · LM 曲线&quot;,title:&quot;LM：货币市场均衡，向上倾斜&quot;,
  body:`<b>含义：</b>线上每点都满足 <span class=&quot;math&quot;>M=L</span>，货币市场出清。<br><b>推导：</b>货币需求 L=kY−hr，令 M/P=L ⇒ <span class=&quot;math&quot;>r=(k/h)Y−M/h</span>。<br><b>为何上倾：</b><span class=&quot;key&quot;>Y↑→交易性货币需求↑→在 M 固定下 r 必须↑</span>才能让人少持币。k 大 ⇒ LM 陡；h 大 ⇒ LM 平。`,
  flags:{is:.4,lm:1}},
 {tag:&quot;第 4 步 · 共同均衡 E&quot;,title:&quot;交点 E(Y₀, r₀)：两市场同时出清&quot;,
  body:`<b>关系：</b>只有 IS 与 LM 的交点，才<span class=&quot;key&quot;>同时</span>满足 Y=AD 和 M=L。<br>它<b>唯一</b>地定出均衡收入 Y₀ 和均衡利率 r₀。<br>右侧两个黄框就是解出 E 的方程组——把 IS 与 LM 联立即可。拖动 Ā、M 看 E 怎么移动。`,
  flags:{is:1,lm:1,eq:1}},
 {tag:&quot;第 5 步 · 失衡四区域&quot;,title:&quot;偏离 E 时，两市场各管一个方向&quot;,
  body:`<b>产品市场（横向）：</b>点在 IS <b>右</b>侧 ⇒ Y&amp;gt;AD ⇒ 减产（←）；<b>左</b>侧 ⇒ Y&amp;lt;AD ⇒ 增产（→）。<br><b>货币市场（纵向）：</b>点在 LM <b>上</b>方 ⇒ M&amp;gt;L ⇒ 利率↓；<b>下</b>方 ⇒ M&amp;lt;L ⇒ 利率↑。<br>两个箭头合成，<span class=&quot;key&quot;>无论从哪出发都收敛到 E</span>。点图任意位置，或试 A/B/C/D。`,
  flags:{is:1,lm:1,eq:1,region:1}},
];

function buildCore(){
  const f=frame([P]);CORE.frame=f;const fl=STEPS[CORE.step].flags;
  let g=axes(f,'IS-LM 推导');
  g+=`<g clip-path=&quot;url(#pc)&quot;>`;
  if(fl.is){const op=fl.is===true?1:fl.is;g+=curve(P,isR,f,_css('--is'),3,`opacity=&quot;${op}&quot;`);}
  if(fl.lm){g+=curve(P,lmR,f,_css('--lm'),3);}
  g+=`</g>`;
  // labels
  if(fl.is){const Yl=f.Ymax*0.8,rl=isR(Yl,P);if(rl>0.05*f.Rmax)g+=T(sx(Yl,f),sy(rl,f)+16,'IS',_css('--is'),15,'middle',800,true);else{const Yl2=clampY((P.Abar-0.12*f.Rmax*P.d)/(1-P.beta),f);g+=T(sx(Yl2,f)+8,sy(0.12*f.Rmax,f),'IS',_css('--is'),15,'start',800,true);}}
  if(fl.lm){const Yl=f.Ymax*0.82;let rl=lmR(Yl,P);if(rl>f.Rmax*0.95){rl=f.Rmax*0.9;}g+=T(sx(clampY((rl+P.M/P.h)*P.h/P.k,f),f)+6,sy(rl,f),'LM',_css('--lm'),15,'start',800,true);}
  if(fl.eq){g+=eqDot(P,f,'E',_css('--accent'),'Y₀','r₀');}
  if(fl.region){
    const e=eqm(P),ex=sx(e.Y,f),ey=sy(e.r,f);
    // preset or clicked point
    let pt=CORE.pt;
    if(pt){
      const px=sx(clampY(pt.Y,f),f),py=sy(clampR(pt.r,f),f);
      const Yis=(P.Abar-P.d*pt.r)/(1-P.beta);     // goods-eq Y at this r
      const Ylm=(P.M+P.h*pt.r)/P.k;               // money-eq Y at this r
      const goodsLeft = pt.Y>Yis;                 // Y>AD -> arrow left
      const moneyUp   = pt.Y>Ylm;                 // M<L -> arrow up
      // horizontal arrow (goods)
      const hx=goodsLeft?px-46:px+46;
      g+=L(px,py,hx,py,_css('--green'),2.6,'marker-end=&quot;url(#grn)&quot;');
      // vertical arrow (money)
      const vy=moneyUp?py-46:py+46;
      g+=L(px,py,px,vy,_css('--green'),2.6,'marker-end=&quot;url(#grn)&quot;');
      g+=`<circle cx=&quot;${px}&quot; cy=&quot;${py}&quot; r=&quot;5.5&quot; fill=&quot;#cfe0ff&quot; stroke=&quot;${_css('--lm')}&quot; stroke-width=&quot;2&quot;/>`;
      const lab=`${moneyUp?'M&amp;lt;L':'M&amp;gt;L'} · ${goodsLeft?'Y&amp;gt;AD':'Y&amp;lt;AD'}`;
      g+=T(px+(goodsLeft?8:-8),py-12,lab,_css('--ink'),12,goodsLeft?'start':'end',700,true);
    }
  }
  document.getElementById('coreHost').innerHTML=g;

/* ===== 政策实验 ===== */
function scenParams(s){
  const base={...P};let p2={...P},shiftIS=false,shiftLM=false,dA=120,dM=100;
  if(s==='fiscalG'){p2.Abar=base.Abar+dA;shiftIS=true;}
  else if(s==='investDown'){p2.Abar=base.Abar-dA;shiftIS=true;}
  else if(s==='money'){p2.M=base.M+dM;shiftLM=true;}
  else if(s==='mix'){const e0=eqm(base);p2.Abar=base.Abar-80;const denom=(base.k/base.h)+(1-base.beta)/base.d;
    p2.M=base.h*(e0.Y*denom-p2.Abar/base.d);shiftIS=true;shiftLM=true;}
  return {base,p2,shiftIS,shiftLM};
}
function lerpP(a,b,t){return {Abar:a.Abar+(b.Abar-a.Abar)*t,M:a.M+(b.M-a.M)*t,beta:a.beta,d:a.d,k:a.k,h:a.h};}
function buildLab(){
  if(!LAB.scn){
    const f=frame([P]);let g=axes(f,'政策实验');g+=`<g clip-path=&quot;url(#pc)&quot;>`+curve(P,isR,f,_css('--is'),3)+curve(P,lmR,f,_css('--lm'),3)+`</g>`;
    g+=eqDot(P,f,'E',_css('--accent'),'Y₀','r₀');
    g+=T(sx(f.Ymax*0.82,f),sy(Math.max(isR(f.Ymax*0.82,P),0.12*f.Rmax),f)+16,'IS',_css('--is'),15,'middle',800,true);
    g+=T(sx(f.Ymax*0.84,f),sy(Math.min(lmR(f.Ymax*0.84,P),f.Rmax*0.92),f),'LM',_css('--lm'),15,'start',800,true);
    g+='</svg>';document.getElementById('labHost').innerHTML=g;return;}
  const {base,p2,shiftIS,shiftLM}=scenParams(LAB.scn);
  const cur=lerpP(base,p2,LAB.t);
  const f=frame([base,p2]);
  let g=axes(f,'政策实验');
  g+=`<g clip-path=&quot;url(#pc)&quot;>`;
  // baseline curves (faded if shifting that one)
  g+=curve(base,isR,f,_css('--is'),shiftIS?2.2:3,shiftIS?'opacity=&quot;0.32&quot;':'');
  g+=curve(base,lmR,f,_css('--lm'),shiftLM?2.2:3,shiftLM?'opacity=&quot;0.32&quot;':'');
  // shifted curves (current interpolation)
  if(shiftIS)g+=curve(cur,isR,f,_css('--is'),3);
  if(shiftLM)g+=curve(cur,lmR,f,_css('--lm'),3);
  g+=`</g>`;
  // labels for which moved
  if(shiftIS){g+=T(sx(f.Ymax*0.9,f),sy(Math.max(isR(f.Ymax*0.9,base),0.1*f.Rmax),f)+15,'IS₁',_css('--is'),13,'middle',800,true);
    g+=T(sx(f.Ymax*0.9,f),sy(Math.max(isR(f.Ymax*0.9,p2),0.1*f.Rmax),f)-8,'IS₂',_css('--is'),13,'middle',800,true);}
  else g+=T(sx(f.Ymax*0.86,f),sy(Math.max(isR(f.Ymax*0.86,base),0.12*f.Rmax),f)+15,'IS',_css('--is'),15,'middle',800,true);
  if(shiftLM){g+=T(sx(f.Ymax*0.8,f),sy(Math.min(lmR(f.Ymax*0.8,base),f.Rmax*0.9),f)-6,'LM₁',_css('--lm'),13,'end',800,true);
    g+=T(sx(f.Ymax*0.86,f),sy(Math.min(lmR(f.Ymax*0.86,p2),f.Rmax*0.9),f),'LM₂',_css('--lm'),13,'start',800,true);}
  else g+=T(sx(f.Ymax*0.84,f),sy(Math.min(lmR(f.Ymax*0.84,base),f.Rmax*0.92),f),'LM',_css('--lm'),15,'start',800,true);
  // equilibria
  const e0=eqm(base),e2=eqm(p2),ecur=eqm(cur);
  // old E faded
  g+=`<circle cx=&quot;${sx(e0.Y,f)}&quot; cy=&quot;${sy(e0.r,f)}&quot; r=&quot;5.5&quot; fill=&quot;${_css('--accent')}&quot; opacity=&quot;0.4&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
  g+=T(sx(e0.Y,f)-6,sy(e0.r,f)-8,'E',_css('--accent'),13,'end',800);
  // moving E
  g+=L(sx(ecur.Y,f),sy(ecur.r,f),sx(ecur.Y,f),PL.y+PL.h,'#192233',1.2,'stroke-dasharray=&quot;5 4&quot;');
  g+=L(sx(ecur.Y,f),sy(ecur.r,f),PL.x,sy(ecur.r,f),'#192233',1.2,'stroke-dasharray=&quot;5 4&quot;');
  g+=`<circle cx=&quot;${sx(ecur.Y,f)}&quot; cy=&quot;${sy(ecur.r,f)}&quot; r=&quot;6.5&quot; fill=&quot;${_css('--violet')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
  g+=T(sx(ecur.Y,f)+10,sy(ecur.r,f)-8,&quot;E'&quot;,_css('--violet'),14,'start',800);
  // ΔY / Δr brackets when settled
  if(LAB.t>0.98){
    const ay=PL.y+PL.h-12;
    if(Math.abs(e2.Y-e0.Y)>1){g+=L(sx(e0.Y,f),ay,sx(e2.Y,f),ay,_css('--violet'),2.5,'marker-end=&quot;url(#vio)&quot;');
      g+=T((sx(e0.Y,f)+sx(e2.Y,f))/2,ay-6,'ΔY',_css('--violet'),13,'middle',800,true);}
    if(Math.abs(e2.r-e0.r)>0.05){const ax2=PL.x+10;g+=L(ax2,sy(e0.r,f),ax2,sy(e2.r,f),_css('--violet'),2.5,'marker-end=&quot;url(#vio)&quot;');
      g+=T(ax2+6,(sy(e0.r,f)+sy(e2.r,f))/2,'Δr',_css('--violet'),13,'start',800,true);}
  }
  g+='</svg>';
  document.getElementById('labHost').innerHTML=g;
  // readouts
  document.getElementById('dY').textContent=(e2.Y-e0.Y>=0?'+':'')+Math.round(e2.Y-e0.Y);
  document.getElementById('dR').textContent=(e2.r-e0.r>=0?'+':'')+(e2.r-e0.r).toFixed(1);
}
const CHAINS={
 fiscalG:{ttl:'扩张性财政 G↑（IS 右移）',html:`

/* ===== 渲染推导面板 ===== */
function renderCore(){
  const st=STEPS[CORE.step];
  document.getElementById('cTag').textContent=`${st.tag} （第 ${CORE.step+1} / ${STEPS.length} 步）`;
  document.getElementById('cTitle').textContent=st.title;
  document.getElementById('cBody').innerHTML=st.body;
  document.getElementById('prevBtn').disabled=CORE.step===0;
  document.getElementById('nextBtn').disabled=CORE.step===STEPS.length-1;
  document.getElementById('presetWrap').style.display=CORE.step===STEPS.length-1?'flex':'none';
  document.getElementById('dots').innerHTML=STEPS.map((_,i)=>`<i class=&quot;${i===CORE.step?'on':''}&quot; data-i=&quot;${i}&quot;></i>`).join('');
  document.querySelectorAll('#dots i').forEach(d=>d.onclick=()=>{CORE.step=+d.dataset.i;if(CORE.step!==STEPS.length-1)CORE.pt=null;renderCore();});
  buildCore();
}
function renderReadouts(){
  const e=eqm(P);
  document.getElementById('vA').textContent=' = '+P.Abar;document.getElementById('vM').textContent=' = '+P.M;
  document.getElementById('vB').textContent=' = '+P.beta.toFixed(2);document.getElementById('vD').textContent=' = '+P.d;
  document.getElementById('vK').textContent=' = '+P.k.toFixed(2);document.getElementById('vH').textContent=' = '+P.h;
  document.getElementById('oY').textContent=Math.round(e.Y);document.getElementById('oR').textContent=e.r.toFixed(1);
  document.getElementById('oIS').textContent=(-(1-P.beta)/P.d).toFixed(3);
  document.getElementById('oLM').textContent=(P.k/P.h).toFixed(3);
}

document.getElementById('nextBtn').onclick=()=>{if(CORE.step<STEPS.length-1){CORE.step++;renderCore();}};
document.getElementById('prevBtn').onclick=()=>{if(CORE.step>0){CORE.step--;if(CORE.step!==STEPS.length-1)CORE.pt=null;renderCore();}};
function bindSlider(id,key,parse){document.getElementById(id).addEventListener('input',e=>{P[key]=parse(e.target.value);renderReadouts();buildCore();if(LAB.scn){LAB.t=1;buildLab();}else buildLab();});}
bindSlider('rA','Abar',v=>+v);bindSlider('rM','M',v=>+v);bindSlider('rB','beta',v=>+v);
bindSlider('rD','d',v=>+v);bindSlider('rK','k',v=>+v);bindSlider('rH','h',v=>+v);

document.getElementById('coreHost').addEventListener('click',ev=>{
  if(CORE.step!==STEPS.length-1)return;const svg=document.querySelector('#coreHost svg');if(!svg)return;
  const rect=svg.getBoundingClientRect();const vx=(ev.clientX-rect.left)/rect.width*VB.w;const vy=(ev.clientY-rect.top)/rect.height*VB.h;

document.querySelectorAll('.scn').forEach(c=>c.onclick=()=>{

    <circle cx=&quot;150&quot; cy=&quot;92&quot; r=&quot;6&quot; fill=&quot;#E0A21A&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>

<!-- 1 GLOSSARY -->
<section id=&quot;gloss&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>01</span><h2>字母词典：中英文全称 + 经济含义</h2></div>
  <p class=&quot;sub&quot;>AD-AS 把整张宏观经济压缩到 <span class=&quot;math&quot;>(Y, P)</span> 平面：横轴产出、纵轴<b>一般价格水平</b>。AD 是需求侧（由 IS-LM 推出）,AS 是供给侧（三种形态）。</p>
  <div class=&quot;gloss&quot; id=&quot;glossGrid&quot;></div>
</div></section>

<!-- 2 AD DERIVATION -->
<section id=&quot;derive&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>02</span><h2>AD 从哪来：IS-LM 在不同 P 下的均衡轨迹</h2></div>
  <p class=&quot;sub&quot;>AD 不是凭空画的。固定 IS,让<b>价格 P 变动</b>：P↓ ⇒ 实际货币供给 M/P↑ ⇒ LM 右移 ⇒ 均衡产出 Y↑。把每个 P 对应的均衡 <span class=&quot;math&quot;>(Y, P)</span> 描到右图,连起来就是 <b style=&quot;color:var(--ad)&quot;>AD 曲线</b>。下面用你讲义的例子：<span class=&quot;math&quot;>IS: 0.5Y+100r=3000</span>、<span class=&quot;math&quot;>LM: 0.5Y−200r=1200/P</span>。</p>
  <div class=&quot;stage&quot;>
    <div class=&quot;figbox&quot;><div class=&quot;duofig&quot;><div id=&quot;islmHost&quot;></div><div id=&quot;adHost&quot;></div></div></div>
    <div class=&quot;controls&quot;>
      <div class=&quot;step-tag&quot;>拖动价格 P,看两图联动</div>
      <div class=&quot;step-title&quot;>P 变 → LM 移 → Y 变 → 描一个 AD 点</div>
      <div class=&quot;step-body&quot;>
        <b>左图（IS-LM）：</b>蓝色 LM 随 P 上下平移,与红色 IS 的交点给出该 P 下的均衡 <span class=&quot;math&quot;>(Y, r)</span>。<br>
        <b>右图（AD 平面）：</b>把 <span class=&quot;math&quot;>(Y, P)</span> 描点,移动 P 就描出整条 <b style=&quot;color:var(--ad)&quot;>AD</b>。<br>
        <b>为何下倾：</b><span class=&quot;key&quot;>财富效应 + 利率效应</span>——P↓ 提高实际货币/财富 ⇒ r↓、消费↑ ⇒ 需求 Y↑。
      </div>
      <div class=&quot;sliders&quot;>
        <div class=&quot;slider&quot;><label>价格水平 <span class=&quot;math&quot;>P</span><span class=&quot;v&quot; id=&quot;vP&quot;></span></label><input type=&quot;range&quot; id=&quot;rP&quot; min=&quot;0.4&quot; max=&quot;4&quot; step=&quot;0.05&quot;></div>
        <div class=&quot;readout&quot;>
          <div class=&quot;ro y&quot;><div class=&quot;k&quot;>均衡产出 Y</div><div class=&quot;val&quot; id=&quot;oY2&quot;></div></div>
          <div class=&quot;ro p&quot;><div class=&quot;k&quot;>均衡利率 r</div><div class=&quot;val&quot; id=&quot;oR2&quot;></div></div>
        </div>
      </div>
      <div class=&quot;eqcard&quot;>
        <div style=&quot;font-weight:700;font-size:13.5px;margin-bottom:4px&quot;>联立 IS 与 LM,消去 r：</div>
        <div class=&quot;f&quot;>IS: r = 30 − 0.005Y　|　LM: r = 0.0025Y − 6/P</div>
        <div class=&quot;f&quot;>⇒ 30 + 6/P = 0.0075Y</div>
        <div class=&quot;res&quot;>⇒ AD: Y = 4000 + 800/P</div>
        <p style=&quot;font-size:12.5px;color:var(--ink-soft);margin:6px 0 0&quot;>P→∞ 时 Y→4000（垂直渐近线）；P 越低 Y 越大,故 AD 向右下倾斜。</p>
      </div>
    </div>
  </div>
</div></section>

<!-- 3 AS x AD LAB -->
<section id=&quot;lab&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>03</span><h2>三段式 AS × 可拖动 AD（核心实验室）</h2></div>
  <p class=&quot;sub&quot;>总供给 AS 有<b style=&quot;color:var(--keynes)&quot;>水平（凯恩斯/萧条）</b>、<b style=&quot;color:var(--inter)&quot;>上倾（短期）</b>、<b style=&quot;color:var(--classic)&quot;>垂直（古典/充分就业）</b>三段。拖动 <span class=&quot;math&quot;>AD</span> 位置,看均衡落在哪一段——同样的需求扩张,效果完全不同。再拖&quot;供给冲击&quot;让 AS 整体上移,体会<b>滞胀</b>。</p>
  <div class=&quot;legend&quot;>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--keynes)&quot;></i>水平段 价格刚性</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--inter)&quot;></i>上倾段 P、Y 同升</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--classic)&quot;></i>垂直段 Y=Y*</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--ad)&quot;></i>AD 总需求</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--eq)&quot;></i>均衡 E</span>
  </div>
  <div class=&quot;stage&quot;>
    <div class=&quot;figbox&quot;><div id=&quot;labHost&quot;></div></div>
    <div class=&quot;controls&quot;>
      <div class=&quot;step-tag&quot;>当前均衡落在</div>
      <div id=&quot;rangeBadge&quot; class=&quot;rangebadge rb-i&quot;>—</div>
      <div class=&quot;interp&quot; id=&quot;interp&quot;></div>
      <div class=&quot;preset&quot;>
        <span style=&quot;font-size:12.5px;color:var(--ink-faint);font-weight:600;align-self:center&quot;>把 AD 推到：</span>
        <button class=&quot;btn&quot; data-p=&quot;k&quot;>萧条区</button>
        <button class=&quot;btn&quot; data-p=&quot;i&quot;>短期区</button>
        <button class=&quot;btn&quot; data-p=&quot;c&quot;>充分就业区</button>
      </div>
      <div class=&quot;sliders&quot;>
        <div class=&quot;slider&quot;><label>AD 位置（需求强弱 Ā）<span class=&quot;v&quot; id=&quot;vAad&quot;></span></label><input type=&quot;range&quot; id=&quot;rAad&quot; min=&quot;500&quot; max=&quot;1400&quot; step=&quot;10&quot;></div>
        <div class=&quot;slider&quot;><label>供给冲击（AS 整体上移）<span class=&quot;v&quot; id=&quot;vSup&quot;></span></label><input type=&quot;range&quot; id=&quot;rSup&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.1&quot;></div>
        <div class=&quot;readout&quot;>
          <div class=&quot;ro y&quot;><div class=&quot;k&quot;>均衡产出 Y*</div><div class=&quot;val&quot; id=&quot;oYstar&quot;></div></div>
          <div class=&quot;ro p&quot;><div class=&quot;k&quot;>均衡价格 P*</div><div class=&quot;val&quot; id=&quot;oPstar&quot;></div></div>
        </div>
        <p class=&quot;hint&quot; id=&quot;supHint&quot; style=&quot;display:none&quot;>⚠ 供给冲击下：在上倾/垂直段会出现 <b>P↑ 且 Y↓</b> —— 这就是滞胀。</p>
      </div>
    </div>
  </div>
</div></section>

<!-- 4 SHOCK + TABLE -->
<section id=&quot;shock&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>04</span><h2>供给冲击 · 政策有效性总表</h2></div>
  <div class=&quot;duo&quot;>
    <div class=&quot;panel&quot;>
      <h3>需求扩张：三段 AS 的不同结局</h3>
      <p>同样让 AD 右移一格,落在不同 AS 段,产出与价格效果完全不同——这是 AD-AS 最核心的考点。</p>
      <table class=&quot;tbl&quot;>
        <tr><th>AS 形态</th><th>产出 Y</th><th>价格 P</th><th>政策含义</th></tr>
        <tr><td class=&quot;l&quot; style=&quot;color:var(--keynes)&quot;>凯恩斯水平</td><td class=&quot;up&quot;>大升↑↑</td><td class=&quot;nc&quot;>不变</td><td>需求政策对产出<b>最有效</b></td></tr>
        <tr><td class=&quot;l&quot; style=&quot;color:var(--inter)&quot;>短期上倾</td><td class=&quot;up&quot;>升↑</td><td class=&quot;pu&quot;>升↑</td><td>部分转化为<b>通胀</b></td></tr>
        <tr><td class=&quot;l&quot; style=&quot;color:var(--classic)&quot;>古典垂直</td><td class=&quot;nc&quot;>不变</td><td class=&quot;pu&quot;>大升↑↑</td><td>只涨价,<b>需求中性</b></td></tr>
      </table>
      <div class=&quot;note&quot;><b>一句话规律：</b>随 AS 由平到陡,需求政策的<b>产出效应递减、价格效应递增</b>。萧条时刺激需求最划算,充分就业时刺激只会通胀。</div>
    </div>
    <div class=&quot;panel&quot;>
      <h3>供给冲击与滞胀</h3>
      <p><b>不利供给冲击</b>（如油价大涨）⇒ 成本上升 ⇒ AS 曲线<b>左上移</b>（AS₀→AS₁）。</p>
      <p>在上倾/垂直段,新均衡 <b style=&quot;color:var(--classic)&quot;>价格 P↑、产出 Y↓</b> 同时发生 —— 这就是 <b>滞胀（stagflation）</b>：停滞 + 通胀并存。</p>
      <p><b>政策两难：</b>用扩张需求保增长会进一步推高物价；用紧缩抑通胀又加剧失业。需求管理只能二选一,<b>根本出路在供给侧</b>。</p>
      <div class=&quot;note&quot; style=&quot;background:#F4F7FF;border-color:#CBD8F2;color:#274690&quot;><b>对照通胀类型：</b>需求拉上型 = AD 右移（P↑Y↑）；成本推动型 = AS 左移（P↑Y↓,滞胀）。</div>
    </div>
  </div>
</div></section>

<!-- 5 MAP -->
<section id=&quot;map&quot; style=&quot;border-bottom:none&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>05</span><h2>关系全景：四大核心图的最后一环</h2></div>
  <div class=&quot;duo&quot;>
    <div class=&quot;panel&quot;>
      <h3>它从哪来</h3>
      <p><b>消费函数 → 45°线均衡 → IS-LM → AD-AS</b>：层层向上。</p>
      <p>· <b>AD</b> 来自 IS-LM：放开价格 P,LM 随 M/P 移动,均衡 Y 随 P 反向变动 → 连成向右下倾的 AD（即第②节做的事）。</p>
      <p>· <b>AS</b> 来自劳动市场/生产：短期价格黏性给出上倾段,长期充分就业给出 Y* 处的垂直段。</p>
    </div>
    <div class=&quot;panel&quot;>
      <h3>它到哪去</h3>
      <p>AD-AS 决定 <span class=&quot;math&quot;>(Y, P)</span> 后,再连接<b>第四张核心图——菲利普斯曲线</b>：</p>
      <p>· AS 上倾 ⇒ 产出缺口与通胀正相关；经<b>奥肯定律</b>把产出缺口换成失业缺口,就得到通胀–失业的<b>菲利普斯曲线</b>。</p>
      <p>· 供给冲击使 AS 左移 ⇒ 菲利普斯曲线整体右上移 ⇒ <b>滞胀</b>,两张图在这里对上号。</p>
    </div>
  </div>
</div></section>

<footer><div class=&quot;wrap&quot;>交互推导工具 · 依《经济学原理（宏观部分）》课程口径编制。AD 由 IS-LM 推出,AS 取三段式,均衡随参数实时联动。</div></footer>

<script>
/* ===== 词典（中英文） ===== */
const GLOSS=[
 [&quot;AD&quot;,&quot;总需求曲线&quot;,&quot;Aggregate Demand&quot;,&quot;各价格水平下产品+货币市场<b>共同均衡</b>的总产出需求,<b>向右下倾</b>。由 IS-LM 推出。&quot;,&quot;p-ad&quot;],
 [&quot;AS&quot;,&quot;总供给曲线&quot;,&quot;Aggregate Supply&quot;,&quot;各价格水平下企业愿意提供的总产出。短期上倾、长期垂直。&quot;,&quot;p-as&quot;],
 [&quot;P&quot;,&quot;价格水平&quot;,&quot;Price level&quot;,&quot;一般物价总水平（如 GDP 平减指数）。纵轴。&quot;,&quot;p-eq&quot;],
 [&quot;Y&quot;,&quot;总产出/总收入&quot;,&quot;Output / National income&quot;,&quot;实际 GDP。横轴。&quot;,&quot;p-eq&quot;],
 [&quot;Y* / Yf&quot;,&quot;潜在/充分就业产出&quot;,&quot;Potential / Full-employment output&quot;,&quot;资源充分利用时的产出,<b>古典垂直 AS</b> 的位置,不受 P 影响。&quot;,&quot;p-as&quot;],
 [&quot;E&quot;,&quot;均衡点&quot;,&quot;Equilibrium&quot;,&quot;AD∩AS,定出 P* 与 Y*。&quot;,&quot;p-eq&quot;],
 [&quot;凯恩斯区&quot;,&quot;水平段&quot;,&quot;Keynesian / depression range&quot;,&quot;萧条、闲置资源多,<b>价格刚性</b>,AS 水平。需求决定产出。&quot;,&quot;p-as&quot;],
 [&quot;中间区&quot;,&quot;上倾段&quot;,&quot;Intermediate / short-run range&quot;,&quot;接近产能,价格有黏性但可变,P 与 Y <b>同向上升</b>。&quot;,&quot;p-as&quot;],
 [&quot;古典区&quot;,&quot;垂直段&quot;,&quot;Classical / long-run range&quot;,&quot;充分就业,产出锁定 Y*,需求变动<b>只动价格</b>。&quot;,&quot;p-as&quot;],
 [&quot;财富效应&quot;,&quot;实际余额/庇古效应&quot;,&quot;Wealth / Pigou effect&quot;,&quot;P↓→实际财富↑→消费↑→AD↑。AD 下倾原因之一。&quot;,&quot;p-ad&quot;],
 [&quot;利率效应&quot;,&quot;凯恩斯效应&quot;,&quot;Interest-rate / Keynes effect&quot;,&quot;P↓→实际货币供给↑→r↓→投资↑→AD↑。AD 下倾另一原因。&quot;,&quot;p-ad&quot;],
 [&quot;需求冲击&quot;,&quot;demand shock&quot;,&quot;Demand shock&quot;,&quot;来自消费/投资/政策,<b>移动 AD</b>。&quot;,&quot;p-sh&quot;],
 [&quot;供给冲击&quot;,&quot;supply shock&quot;,&quot;Supply shock&quot;,&quot;来自要素价格/生产率,<b>移动 AS</b>。不利冲击→AS 左上移。&quot;,&quot;p-sh&quot;],
 [&quot;滞胀&quot;,&quot;停滞膨胀&quot;,&quot;Stagflation&quot;,&quot;产出↓ + 物价↑ 并存,多由不利供给冲击引起。&quot;,&quot;p-sh&quot;],
 [&quot;货币中性&quot;,&quot;neutrality of money&quot;,&quot;Neutrality of money&quot;,&quot;长期（古典垂直 AS）名义货币只改变 P、不改变实际产出。&quot;,&quot;p-as&quot;],
 [&quot;M/P&quot;,&quot;实际货币供给&quot;,&quot;Real money supply&quot;,&quot;名义货币 ÷ 价格。P 变动经它把 IS-LM 与 AD 连起来。&quot;,&quot;p-ad&quot;],
];
(function(){const g=document.getElementById('glossGrid');
 GLOSS.forEach(([s,cn,en,d,p])=>{const e=document.createElement('div');e.className='card';
  const col=p==='p-ad'?'var(--ad)':p==='p-as'?'var(--as)':p==='p-sh'?'var(--violet)':'#9a6e00';
  e.innerHTML=`<span class=&quot;sym&quot; style=&quot;color:${col}&quot;>${s}</span><span class=&quot;cn&quot;>${cn}</span><div class=&quot;en&quot;>${en}</div><div class=&quot;desc&quot;>${d}</div><span class=&quot;pill ${p}&quot;>${p==='p-ad'?'需求侧':p==='p-as'?'供给侧':p==='p-sh'?'冲击概念':'坐标/均衡'}</span>`;
  g.appendChild(e);});})();

/* ===== 绘图基元（按 plot 域映射） ===== */
function _css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function mx(v,P){return P.px+(v-P.xMin)/(P.xMax-P.xMin)*P.pw;}
function my(v,P){return P.py+P.ph-(v-P.yMin)/(P.yMax-P.yMin)*P.ph;}
function L(x1,y1,x2,y2,c,w,ex=''){return `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; ${ex}/>`;}
function T(x,y,t,c,s=13,a='start',w=600,it=false){return `<text x=&quot;${x}&quot; y=&quot;${y}&quot; fill=&quot;${c}&quot; font-size=&quot;${s}&quot; text-anchor=&quot;${a}&quot; font-weight=&quot;${w}&quot; ${it?'font-style=&quot;italic&quot; font-family=&quot;Georgia,serif&quot;':'font-family=&quot;PingFang SC,sans-serif&quot;'}>${t}</text>`;}
function axesG(P,xlab,ylab){
  const Ey=P.py+P.ph,Ex=P.px+P.pw;let g='';
  for(let i=1;i<=4;i++){const gx=P.px+P.pw*i/5,gy=P.py+P.ph*i/5;g+=L(gx,P.py,gx,Ey,'var(--grid)',1);g+=L(P.px,gy,Ex,gy,'var(--grid)',1);}
  g+=L(P.px,Ey,Ex+12,Ey,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=L(P.px,Ey,P.px,P.py-12,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=T(P.px-6,P.py-14,ylab,_css('--ink'),15,'end',800,true);
  g+=T(Ex+16,Ey+5,xlab,_css('--ink'),15,'start',800,true);
  g+=T(P.px-9,Ey+16,'O',_css('--ink'),13,'end',700);

}
function svgOpen(vbw,vbh,label){return `<svg class=&quot;fig&quot; viewBox=&quot;0 0 ${vbw} ${vbh}&quot; role=&quot;img&quot; aria-label=&quot;${label}&quot;><defs>

  <marker id=&quot;vio&quot; markerWidth=&quot;10&quot; markerHeight=&quot;10&quot; refX=&quot;7&quot; refY=&quot;5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L10,5 L0,10 z&quot; fill=&quot;#7A3FB0&quot;/></marker></defs>`;}

/* ===== 第二节：AD 推导（联动两图） ===== */
const D={P:1};
function isR(Y){return 30-0.005*Y;}
function lmR(Y,Pv){return 0.0025*Y-6/Pv;}
function eqY(Pv){return 4000+800/Pv;}
function buildDerive(){
  const Pv=D.P, Ye=eqY(Pv), re=isR(Ye);
  // IS-LM plot
  const PI={px:54,py:22,pw:360,ph:288,xMin:3800,xMax:6200,yMin:0,yMax:16};
  let g=svgOpen(450,350,'IS-LM');g+=axesG(PI,'Y','r');
  g+=`<text x=&quot;${PI.px-6}&quot; y=&quot;${PI.py-1}&quot; fill=&quot;${_css('--ink-soft')}&quot; font-size=&quot;10&quot; text-anchor=&quot;end&quot;>利率</text>`;
  // IS
  g+=L(mx(3800,PI),my(isR(3800),PI),mx(6000,PI),my(isR(6000),PI),_css('--ad'),2.6);
  g+=T(mx(5400,PI),my(isR(5400),PI)+15,'IS',_css('--ad'),13,'middle',800,true);
  // LM (current P), clip via sampling within r in [0,16]
  let lmpts=[];for(let Y=3800;Y<=6200;Y+=60){const r=lmR(Y,Pv);if(r>=0&amp;&amp;r<=16)lmpts.push([mx(Y,PI),my(r,PI)]);}
  if(lmpts.length>1){let d='M'+lmpts[0][0]+' '+lmpts[0][1];for(let i=1;i<lmpts.length;i++)d+=' L'+lmpts[i][0]+' '+lmpts[i][1];g+=`<path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--as')}&quot; stroke-width=&quot;2.6&quot;/>`;}
  const lmLast=lmpts[lmpts.length-1];if(lmLast)g+=T(lmLast[0]+4,lmLast[1],'LM(P)',_css('--as'),12,'start',800,true);
  // eq
  if(re>=0&amp;&amp;re<=16){const ex=mx(Ye,PI),ey=my(re,PI);
    g+=L(ex,ey,ex,PI.py+PI.ph,'#192233',1.2,'stroke-dasharray=&quot;5 4&quot;');g+=L(ex,ey,PI.px,ey,'#192233',1.2,'stroke-dasharray=&quot;5 4&quot;');
    g+=`<circle cx=&quot;${ex}&quot; cy=&quot;${ey}&quot; r=&quot;6&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
    g+=T(ex,PI.py+PI.ph+15,'Y',_css('--ink'),12,'middle',700,true);}
  g+='</svg>';
  document.getElementById('islmHost').innerHTML=g;
  // AD plot
  const PA={px:54,py:22,pw:360,ph:288,xMin:3800,xMax:6200,yMin:0,yMax:4.2};
  let g2=svgOpen(450,350,'AD 平面');g2+=axesG(PA,'Y','P');
  g2+=`<text x=&quot;${PA.px-6}&quot; y=&quot;${PA.py-1}&quot; fill=&quot;${_css('--ink-soft')}&quot; font-size=&quot;10&quot; text-anchor=&quot;end&quot;>价格</text>`;
  // full AD curve
  let adpts=[];for(let p=0.4;p<=4.0001;p+=0.05){const Y=eqY(p);if(Y>=3800&amp;&amp;Y<=6200)adpts.push([mx(Y,PA),my(p,PA)]);}
  let dd='M'+adpts[0][0]+' '+adpts[0][1];for(let i=1;i<adpts.length;i++)dd+=' L'+adpts[i][0]+' '+adpts[i][1];
  g2+=`<path d=&quot;${dd}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--ad')}&quot; stroke-width=&quot;3&quot;/>`;
  g2+=T(adpts[adpts.length-1][0]-4,adpts[adpts.length-1][1]+6,'AD',_css('--ad'),14,'end',800,true);
  // moving point
  const px=mx(Ye,PA),py=my(Pv,PA);
  g2+=L(px,py,px,PA.py+PA.ph,_css('--guide'),1.4,'stroke-dasharray=&quot;4 3&quot;');g2+=L(px,py,PA.px,py,_css('--guide'),1.4,'stroke-dasharray=&quot;4 3&quot;');
  g2+=`<circle cx=&quot;${px}&quot; cy=&quot;${py}&quot; r=&quot;6.5&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
  g2+=T(PA.px-7,py+4,'P',_css('--guide'),12,'end',700,true);g2+=T(px,PA.py+PA.ph+15,'Y',_css('--guide'),12,'middle',700,true);
  g2+='</svg>';
  document.getElementById('adHost').innerHTML=g2;
  // readouts
  document.getElementById('vP').textContent=' = '+Pv.toFixed(2);
  document.getElementById('oY2').textContent=Math.round(Ye);

/* ===== 第三节：AS×AD 实验室 ===== */
const A={Aad:950,e:60,sup:0,P0:2.5,Yk:380,Ystar:900,Pmax:7,q:2.3};
function asP(Y){const p0=A.P0+A.sup,pm=A.Pmax+A.sup;
  if(Y<=A.Yk)return p0; if(Y>=A.Ystar)return pm;
  const t=(Y-A.Yk)/(A.Ystar-A.Yk);return p0+(pm-p0)*Math.pow(t,A.q);}
function adP(Y){return (A.Aad-Y)/A.e;}
function eqADAS(){
  const pm=A.Pmax+A.sup, p0=A.P0+A.sup;
  if(adP(A.Ystar)>=pm){const P=adP(A.Ystar);return {Y:A.Ystar,P:P,range:'c'};}
  const f=Y=>adP(Y)-asP(Y);
  if(f(0)<0){const Y=Math.max(0,A.Aad-A.e*p0);return {Y,P:p0,range:'k'};}
  let lo=0,hi=A.Ystar;for(let i=0;i<60;i++){const m=(lo+hi)/2;if(f(m)>0)lo=m;else hi=m;}
  const Y=(lo+hi)/2,P=asP(Y);

function buildLab(){

  // Y* tick
  g+=L(mx(A.Ystar,PL),PL.py+PL.ph,mx(A.Ystar,PL),PL.py+PL.ph+5,_css('--classic'),1.5);
  // AD line: from P高 to P低 -> Y low to high; draw between P in [0.3, topP] clipped to plot &amp; Y>=0

  if(ad.length>1){let adp='M'+ad[0][0]+' '+ad[0][1];for(let i=1;i<ad.length;i++)adp+=' L'+ad[i][0]+' '+ad[i][1];g+=`<path d=&quot;${adp}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--ad')}&quot; stroke-width=&quot;3&quot;/>`;
    g+=T(ad[ad.length-1][0]+4,ad[ad.length-1][1],'AD',_css('--ad'),15,'start',800,true);}

  g+=`<circle cx=&quot;${ex}&quot; cy=&quot;${ey}&quot; r=&quot;7&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
  g+=T(ex+11,ey-9,'E',_css('--eq')==='#E0A21A'?'#9a6e00':_css('--eq'),14,'start',800);

  document.getElementById('labHost').innerHTML=g;
  // readouts + badge + interp
  document.getElementById('oYstar').textContent=Math.round(e.Y);
  document.getElementById('oPstar').textContent=e.P.toFixed(2);

  document.getElementById('vSup').textContent=' = '+A.sup.toFixed(1);

}

<section id=&quot;map&quot; style=&quot;border-bottom:none&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>04</span><h2>政策组合 · 关系全景</h2></div>
  <div class=&quot;duo&quot;>
    <div class=&quot;panel&quot;>
      <h3>财政—货币政策组合效应（IS-LM 速查）</h3>

        <tr><th>政策配合</th><th>收入 Y</th><th>利率 r</th></tr>
        <tr><td class=&quot;l&quot;>扩张财政 + 紧缩货币</td><td class=&quot;nc&quot;>不确定</td><td class=&quot;up&quot;>上升</td></tr>
        <tr><td class=&quot;l&quot;>扩张财政 + 扩张货币</td><td class=&quot;up&quot;>增加</td><td class=&quot;nc&quot;>不确定</td></tr>
        <tr><td class=&quot;l&quot;>紧缩财政 + 紧缩货币</td><td class=&quot;dn&quot;>减少</td><td class=&quot;nc&quot;>不确定</td></tr>
        <tr><td class=&quot;l&quot;>紧缩财政 + 扩张货币</td><td class=&quot;nc&quot;>不确定</td><td class=&quot;dn&quot;>下降</td></tr>
      </table>
      <p style=&quot;font-size:13px;color:var(--ink-soft);margin-top:10px&quot;>两种政策对利率方向相反时,利率方向才确定、收入不确定；对收入方向相反时,反之。这张表是选择/简答的固定考点。</p>
    </div>
    <div class=&quot;panel&quot;>
      <h3>四大核心图：一条主线</h3>
      <div class=&quot;flow&quot;>
        <span class=&quot;fnode&quot; style=&quot;border-color:#1F9E5A&quot;>45°线</span><span class=&quot;farrow&quot;>→</span>
        <span class=&quot;fnode&quot; style=&quot;border-color:#1B3A8C&quot;>IS-LM</span><span class=&quot;farrow&quot;>→</span>
        <span class=&quot;fnode&quot; style=&quot;border-color:#1F9E5A&quot;>AD-AS</span><span class=&quot;farrow&quot;>→</span>
        <span class=&quot;fnode&quot; style=&quot;border-color:#B3123A&quot;>菲利普斯</span>
      </div>
      <p style=&quot;margin-top:12px&quot;>· <b>来路：</b>PC 由 AS 曲线推出（本页第②节）：AS 上倾 ⇒ 产出缺口；经<b>奥肯定律</b>把产出缺口换成失业缺口,就得到通胀–失业的 PC。</p>
      <p>· <b>滞胀对接：</b>AD-AS 里不利供给冲击使 AS 左移；在 PC 里就是 <span class=&quot;math&quot;>μ&amp;gt;0</span> 使曲线<b>整体上移</b>,失业与通胀同升 = 滞胀。</p>
      <div class=&quot;note&quot;><b>NAIRU：</b>极端适应性预期（λ=1）下,只有 u=u* 时通胀才稳定（π=π₋₁）；想长期压低失业必须让通胀<b>不断加速</b>。故 u* 又称&quot;不让通货膨胀加速的失业率&quot;。</div>
