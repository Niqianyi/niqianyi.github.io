<script>
/* ===== 词典 ===== */
const GLOSS=[
 [&quot;垄断&quot;,&quot;monopoly&quot;,&quot;Monopoly&quot;,&quot;独家厂商、产品无近替代、进入障碍高、有定价权。&quot;,&quot;p-str&quot;],
 [&quot;D = AR&quot;,&quot;需求=平均收益&quot;,&quot;Demand = Average revenue&quot;,&quot;垄断者面对<b>向下倾斜</b>的市场需求曲线,即平均收益线。&quot;,&quot;p-str&quot;],
 [&quot;MR&quot;,&quot;边际收益&quot;,&quot;Marginal revenue&quot;,&quot;R=P(Q)·Q ⇒ MR=P+(dP/dQ)·Q &amp;lt; P。线性需求下 MR 斜率是需求的<b>2 倍</b>。&quot;,&quot;p-rev&quot;],
 [&quot;MR<P&quot;,&quot;边际收益小于价格&quot;,&quot;MR < Price&quot;,&quot;多卖 1 单位要降价,且要把之前各单位价也压低 ⇒ MR&amp;lt;P。&quot;,&quot;p-rev&quot;],
 [&quot;垄断均衡&quot;,&quot;monopoly equilibrium&quot;,&quot;Monopoly equilibrium&quot;,&quot;MR=MC 定产量 Q*,再到<b>需求线</b>上索价 P*&amp;gt;MC。&quot;,&quot;p-rev&quot;],
 [&quot;DWL&quot;,&quot;无谓损失&quot;,&quot;Deadweight loss&quot;,&quot;产量低于社会最优,部分愿付&amp;gt;MC 的需求未被满足 ⇒ 福利净损失三角。&quot;,&quot;p-wel&quot;],
 [&quot;CS / PS&quot;,&quot;消费者/生产者剩余&quot;,&quot;Consumer / Producer surplus&quot;,&quot;垄断使 CS 减少、PS 增加、总剩余减少。&quot;,&quot;p-wel&quot;],
 [&quot;价格歧视&quot;,&quot;price discrimination&quot;,&quot;Price discrimination&quot;,&quot;同一产品对不同人/量收不同价。前提:有定价权 + 市场可隔离。&quot;,&quot;p-pd&quot;],
 [&quot;一级歧视&quot;,&quot;first-degree&quot;,&quot;First-degree (perfect)&quot;,&quot;按每单位最高意愿支付定价。CS=0,<b>无 DWL(有效率但不公平)</b>。&quot;,&quot;p-pd&quot;],
 [&quot;二级歧视&quot;,&quot;second-degree&quot;,&quot;Second-degree&quot;,&quot;按购买量分段定价(数量折扣、阶梯价)。&quot;,&quot;p-pd&quot;],
 [&quot;三级歧视&quot;,&quot;third-degree&quot;,&quot;Third-degree&quot;,&quot;按可区分群体定价。<b>弹性小定高价、弹性大定低价</b>,MR_A=MR_B=MC。&quot;,&quot;p-pd&quot;],
 [&quot;勒纳指数&quot;,&quot;Lerner index&quot;,&quot;Lerner index&quot;,&quot;(P−MC)/P=1/E,衡量垄断势力。&quot;,&quot;p-rev&quot;],
];
(function(){const g=document.getElementById('glossGrid');
 GLOSS.forEach(([s,cn,en,d,p])=>{const e=document.createElement('div');e.className='card';
  const col=p==='p-str'?'var(--demand)':p==='p-rev'?'var(--mr)':p==='p-wel'?'var(--ps)':'var(--violet)';
  e.innerHTML=`<span class=&quot;sym&quot; style=&quot;color:${col}&quot;>${s}</span><span class=&quot;cn&quot;>${cn}</span><div class=&quot;en&quot;>${en}</div><div class=&quot;desc&quot;>${d}</div><span class=&quot;pill ${p}&quot;>${p==='p-str'?'市场结构':p==='p-rev'?'收益/定价':p==='p-wel'?'福利':'价格歧视'}</span>`;
  g.appendChild(e);});})();

/* ===== 绘图基元 ===== */
function _css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function mx(v,P){return P.px+(v-P.xMin)/(P.xMax-P.xMin)*P.pw;}
function my(v,P){return P.py+P.ph-(v-P.yMin)/(P.yMax-P.yMin)*P.ph;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function L_(x1,y1,x2,y2,c,w,ex=''){return `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; ${ex}/>`;}
function T(x,y,t,c,s=13,a='start',w=600,it=false){return `<text x=&quot;${x}&quot; y=&quot;${y}&quot; fill=&quot;${c}&quot; font-size=&quot;${s}&quot; text-anchor=&quot;${a}&quot; font-weight=&quot;${w}&quot; ${it?'font-style=&quot;italic&quot; font-family=&quot;Georgia,serif&quot;':'font-family=&quot;PingFang SC,sans-serif&quot;'}>${t}</text>`;}
function POLY(pts,fill,op){return `<polygon points=&quot;${pts.map(p=>p[0]+','+p[1]).join(' ')}&quot; fill=&quot;${fill}&quot; opacity=&quot;${op}&quot;/>`;}
function svgOpen(w,h,label){return `<svg class=&quot;fig&quot; viewBox=&quot;0 0 ${w} ${h}&quot; role=&quot;img&quot; aria-label=&quot;${label}&quot;><defs>
  <marker id=&quot;ar&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;#192233&quot;/></marker></defs>`;}
function axesG(P,xlab,ylab){
  const Ey=P.py+P.ph,Ex=P.px+P.pw;let g='';
  for(let i=1;i<=4;i++){const gx=P.px+P.pw*i/5,gy=P.py+P.ph*i/5;g+=L_(gx,P.py,gx,Ey,'var(--grid)',1);g+=L_(P.px,gy,Ex,gy,'var(--grid)',1);}
  g+=L_(P.px,Ey,Ex+12,Ey,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=`<line x1=&quot;${P.px}&quot; y1=&quot;${Ey}&quot; x2=&quot;${P.px}&quot; y2=&quot;${P.py-12}&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/>`;
  g+=T(P.px-7,P.py-13,ylab,_css('--ink'),14,'end',700);
  g+=T(Ex+16,Ey+5,xlab,_css('--ink'),15,'start',800,true);
  g+=T(P.px-9,Ey+16,'O',_css('--ink'),13,'end',700);
  return g;
}
/* monopoly numbers */
function mon(a,b,c){const Qm=(a-c)/(2*b),Pm=a-b*Qm,Qc=(a-c)/b;
  const CS=0.5*(a-Pm)*Qm, PS=(Pm-c)*Qm, DWL=0.5*(Qc-Qm)*(Pm-c);
  return {Qm,Pm,Qc,CS,PS,DWL,TS:CS+PS, firstPS:0.5*(a-c)*Qc};}

function drawMon(host,a,b,c,opts){
  const P={px:50,py:22,pw:386,ph:320,xMin:0,xMax:a/b*1.04,yMin:0,yMax:a*1.05};
  const m=mon(a,b,c);
  let g=svgOpen(462,378,'垄断均衡');g+=axesG(P,'Q','P');
  // areas
  if(opts.areas&amp;&amp;!opts.first){
    g+=POLY([[mx(0,P),my(a,P)],[mx(0,P),my(m.Pm,P)],[mx(m.Qm,P),my(m.Pm,P)]],_css('--cs'),0.16);
    g+=POLY([[mx(0,P),my(m.Pm,P)],[mx(m.Qm,P),my(m.Pm,P)],[mx(m.Qm,P),my(c,P)],[mx(0,P),my(c,P)]],_css('--ps'),0.16);
    g+=POLY([[mx(m.Qm,P),my(m.Pm,P)],[mx(m.Qm,P),my(c,P)],[mx(m.Qc,P),my(c,P)]],_css('--dwl'),0.3);
  }
  if(opts.first){ // 1st-degree: PS = whole triangle to Qc, CS=0
    g+=POLY([[mx(0,P),my(a,P)],[mx(0,P),my(c,P)],[mx(m.Qc,P),my(c,P)]],_css('--ps'),0.18);
  }
  // demand
  g+=L_(mx(0,P),my(a,P),mx(a/b,P),my(0,P),_css('--demand'),3);
  g+=T(mx(a/b,P)-2,my(0,P)-8,'D=AR',_css('--demand'),12,'end',800,true);
  // MR (slope 2b): MR=a-2bQ, zero at Q=a/(2b)
  if(opts.mr){g+=L_(mx(0,P),my(a,P),mx(a/(2*b),P),my(0,P),_css('--mr'),2.6);g+=T(mx(a/(2*b),P)+2,my(0,P)-8,'MR',_css('--mr'),12,'start',800,true);}
  // MC
  if(opts.mc){g+=L_(mx(0,P),my(c,P),mx(a/b,P),my(c,P),_css('--mc'),2.6);g+=T(mx(a/b,P),my(c,P)-6,'MC',_css('--mc'),12,'end',800,true);}
  // competitive point
  if(opts.comp){g+=`<circle cx=&quot;${mx(m.Qc,P)}&quot; cy=&quot;${my(c,P)}&quot; r=&quot;5&quot; fill=&quot;#fff&quot; stroke=&quot;${_css('--mc')}&quot; stroke-width=&quot;2.5&quot;/>`;
    g+=T(mx(m.Qc,P),P.py+P.ph+15,'Q_c',_css('--mc'),11,'middle',800,true);}
  // monopoly point
  if(opts.mono&amp;&amp;!opts.first){
    const ex=mx(m.Qm,P),ey=my(m.Pm,P);
    g+=L_(ex,ey,ex,P.py+P.ph,_css('--guide'),1.3,'stroke-dasharray=&quot;4 3&quot;');
    g+=L_(ex,ey,P.px,ey,_css('--guide'),1.3,'stroke-dasharray=&quot;4 3&quot;');
    g+=L_(mx(m.Qm,P),my(c,P),mx(m.Qm,P),ey,_css('--mr'),1,'stroke-dasharray=&quot;3 3&quot; opacity=&quot;0.6&quot;'); // MR=MC vertical
    g+=`<circle cx=&quot;${ex}&quot; cy=&quot;${ey}&quot; r=&quot;7&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
    g+=`<circle cx=&quot;${mx(m.Qm,P)}&quot; cy=&quot;${my(c,P)}&quot; r=&quot;4&quot; fill=&quot;${_css('--mr')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;1.6&quot;/>`;
    g+=T(ex,P.py+P.ph+15,'Q_m',_css('--demand'),11,'middle',800,true);
    g+=T(P.px-7,ey+4,'P_m',_css('--mr'),11,'end',800,true);
  }
  if(opts.first){
    g+=`<circle cx=&quot;${mx(m.Qc,P)}&quot; cy=&quot;${my(c,P)}&quot; r=&quot;6&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
    g+=T(mx(m.Qc,P),P.py+P.ph+15,'Q=Q_c',_css('--ps'),11,'middle',800,true);
  }
  g+='</svg>';document.getElementById(host).innerHTML=g;
  return m;
}

/* ===== 第二节：推导剧场 ===== */
const DV={step:0};
const DSTEPS=[
 {tag:&quot;前提 · MR<P&quot;,title:&quot;向下需求 ⇒ 边际收益小于价格&quot;,
  body:`垄断者多卖 1 单位必须降价,还要把<b>之前所有单位</b>都降一点 ⇒ <span class=&quot;key&quot;>MR&amp;lt;P</span>。线性需求下 MR 斜率是需求的 <b>2 倍</b>,与横轴交点在需求的一半处。`,
  deriv:[[&quot;R=P(Q)·Q ⇒ MR=P+(dP/dQ)Q < P&quot;,&quot;P=100−Q ⇒ MR=100−2Q&quot;]],opts:{mr:1}},
 {tag:&quot;第 1 步 · MR=MC 定产量&quot;,title:&quot;利润最大化：MR = MC&quot;,
  body:`和所有厂商一样,垄断者也在 MR=MC 处定产量。<span class=&quot;key&quot;>MR=MC ⇒ Q_m</span>。`,
  deriv:[[&quot;100−2Q = 20 ⇒ Q_m = 40&quot;,&quot;MR=MC 交点&quot;]],opts:{mr:1,mc:1}},
 {tag:&quot;第 2 步 · 需求线定价&quot;,title:&quot;再到需求线上索取高价&quot;,
  body:`产量定在 Q_m,但<b>价格</b>不是 MR、也不是 MC,而是回到<span class=&quot;key&quot;>需求线</span>上消费者愿付的 P_m。所以 <b>P_m &amp;gt; MC</b>。`,
  deriv:[[&quot;P_m = 100 − Q_m = 60&quot;,&quot;P_m=60 > MC=20&quot;],[&quot;对比竞争:P=MC ⇒ Q_c=80&quot;,&quot;&quot;]],opts:{mr:1,mc:1,mono:1,comp:1}},
 {tag:&quot;第 3 步 · 无谓损失&quot;,title:&quot;产量偏低，留下无谓损失&quot;,
  body:`垄断产量 40 &amp;lt; 竞争产量 80。有些消费者愿付的价格高于 MC 却没买到 ⇒ <span class=&quot;key&quot;>无谓损失</span>(粉色三角)。CS 缩小、PS 扩大、总剩余减少。`,
  deriv:[[&quot;DWL = ½(Q_c−Q_m)(P_m−MC)&quot;,&quot;=½·40·40 = 800&quot;],[&quot;CS=800, PS=1600, TS=2400&quot;,&quot;&quot;]],opts:{mr:1,mc:1,mono:1,comp:1,areas:1}},
];
function buildDerive(){
  const st=DSTEPS[DV.step];
  drawMon('dHost',100,1,20,Object.assign({},st.opts));
  document.getElementById('dTag').textContent=`${st.tag}（第 ${DV.step+1}/${DSTEPS.length} 步）`;
  document.getElementById('dTitle').textContent=st.title;
  document.getElementById('dBody').innerHTML=st.body;
  document.getElementById('dDeriv').innerHTML=st.deriv.map(([f,s])=>`<div class=&quot;deriv&quot;>${f}${s?`<small>${s}</small>`:''}</div>`).join('');
  document.getElementById('dPrev').disabled=DV.step===0;document.getElementById('dNext').disabled=DV.step===DSTEPS.length-1;
  document.getElementById('dDots').innerHTML=DSTEPS.map((_,i)=>`<i class=&quot;${i===DV.step?'on':''}&quot; data-i=&quot;${i}&quot;></i>`).join('');
  document.querySelectorAll('#dDots i').forEach(d=>d.onclick=()=>{DV.step=+d.dataset.i;buildDerive();});
}
document.getElementById('dNext').onclick=()=>{if(DV.step<DSTEPS.length-1){DV.step++;buildDerive();}};
document.getElementById('dPrev').onclick=()=>{if(DV.step>0){DV.step--;buildDerive();}};

/* ===== 第三节：实验室 ===== */
const LB={a:100,b:1,c:20,mode:'uni'};
function buildLab(){
  const first=LB.mode==='first';
  const m=drawMon('labHost',LB.a,LB.b,LB.c,{mr:1,mc:1,mono:1,comp:1,areas:1,first:first});
  document.getElementById('vA').textContent=' = '+LB.a;
  document.getElementById('vB').textContent=' = '+LB.b;
  document.getElementById('vC').textContent=' = '+LB.c;
  document.getElementById('oQc').textContent=m.Qc.toFixed(1);
  if(first){
    document.getElementById('oQ').textContent=m.Qc.toFixed(1);
    document.getElementById('oP').textContent='逐单位';
    document.getElementById('oCS').textContent='0';
    document.getElementById('oPS').textContent=m.firstPS.toFixed(0);
    document.getElementById('oDWL').textContent='0';
    document.getElementById('labInterp').innerHTML='<b>一级歧视:</b>产到 P=MC(Q=Q_c),<b>消除无谓损失</b>;但消费者剩余被<b>全部</b>转为生产者剩余(CS=0),效率最高却最不公平。';
  }else{
    document.getElementById('oQ').textContent=m.Qm.toFixed(1);
    document.getElementById('oP').textContent=m.Pm.toFixed(1);
    document.getElementById('oCS').textContent=m.CS.toFixed(0);
    document.getElementById('oPS').textContent=m.PS.toFixed(0);
    document.getElementById('oDWL').textContent=m.DWL.toFixed(0);
    document.getElementById('labInterp').innerHTML=`垄断 Q_m=${m.Qm.toFixed(0)} &amp;lt; 竞争 Q_c=${m.Qc.toFixed(0)},P_m=${m.Pm.toFixed(0)}&amp;gt;MC=${LB.c}。无谓损失 ${m.DWL.toFixed(0)}(粉色三角)。`;
  }
}
document.querySelectorAll('#lab [data-m]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#lab [data-m]').forEach(x=>x.classList.remove('on'));b.classList.add('on');LB.mode=b.dataset.m;buildLab();});
document.getElementById('rA').addEventListener('input',e=>{LB.a=+e.target.value;buildLab();});
document.getElementById('rB').addEventListener('input',e=>{LB.b=+e.target.value;buildLab();});
document.getElementById('rC').addEventListener('input',e=>{LB.c=+e.target.value;buildLab();});
document.getElementById('rA').value=LB.a;document.getElementById('rB').value=LB.b;document.getElementById('rC').value=LB.c;

/* ===== 第四节：三级价格歧视 ===== */
let PDMODE='sep';
// A: PA=20-0.05QA ; B: PB=30-0.05QB ; MC=10
function drawPD(){
  const PA={px:46,py:20,pw:170,ph:250,xMin:0,xMax:420,yMin:0,yMax:22};
  const PB={px:262,py:20,pw:170,ph:250,xMin:0,xMax:620,yMin:0,yMax:32};
  let g=svgOpen(462,310,'三级价格歧视');
  function panel(P,inter,slope,mrslope,label,sep,uni){
    let s='';const Ey=P.py+P.ph,Ex=P.px+P.pw;
    s+=L_(P.px,Ey,Ex+8,Ey,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
    s+=`<line x1=&quot;${P.px}&quot; y1=&quot;${Ey}&quot; x2=&quot;${P.px}&quot; y2=&quot;${P.py-10}&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/>`;
    s+=T(P.px+P.pw/2,P.py-6,label,_css('--ink'),12,'middle',800);
    // demand P=inter+slope*Q
    const Qmax=-inter/slope;
    s+=L_(mx(0,P),my(inter,P),mx(Math.min(Qmax,P.xMax),P),my(Math.max(0,inter+slope*Math.min(Qmax,P.xMax)),P),_css('--demand'),2.6);
    // MR
    s+=L_(mx(0,P),my(inter,P),mx(-inter/mrslope,P),my(0,P),_css('--mr'),2);
    // MC=10
    s+=L_(mx(0,P),my(10,P),Ex,my(10,P),_css('--mc'),2,'stroke-dasharray=&quot;5 4&quot;');
    s+=T(Ex,my(10,P)-4,'MC',_css('--mc'),10,'end',700,true);
    if(PDMODE==='sep'){
      s+=L_(mx(sep.Q,P),my(sep.P,P),mx(sep.Q,P),Ey,_css('--guide'),1.1,'stroke-dasharray=&quot;3 3&quot;');
      s+=L_(P.px,my(sep.P,P),mx(sep.Q,P),my(sep.P,P),_css('--eq'),1.6,'stroke-dasharray=&quot;5 4&quot;');
      s+=`<circle cx=&quot;${mx(sep.Q,P)}&quot; cy=&quot;${my(sep.P,P)}&quot; r=&quot;5&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
      s+=T(P.px+4,my(sep.P,P)-4,'P='+sep.P,_css('--eq')==='#E0A21A'?'#9a6e00':_css('--eq'),11,'start',800);
    }else{
      s+=L_(P.px,my(uni.P,P),Ex,my(uni.P,P),_css('--violet'),1.8,'stroke-dasharray=&quot;5 4&quot;');
      s+=L_(mx(uni.Q,P),my(uni.P,P),mx(uni.Q,P),Ey,_css('--guide'),1.1,'stroke-dasharray=&quot;3 3&quot;');
      s+=`<circle cx=&quot;${mx(uni.Q,P)}&quot; cy=&quot;${my(uni.P,P)}&quot; r=&quot;5&quot; fill=&quot;${_css('--violet')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`;
      s+=T(P.px+4,my(uni.P,P)-4,'P=17.5',_css('--violet'),11,'start',800);
    }
    return s;
  }
  g+=panel(PA,20,-0.05,-0.1,'A 市场(弹性大)',{Q:100,P:15},{Q:50,P:17.5});
  g+=panel(PB,30,-0.05,-0.1,'B 市场(弹性小)',{Q:200,P:20},{Q:250,P:17.5});
  g+='</svg>';document.getElementById('pdHost').innerHTML=g;
  // table
  const sep={pa:15,pb:20,qa:100,qb:200,pia:500,pib:2000,csa:250,csb:1000};
  const uni={pa:17.5,pb:17.5,qa:50,qb:250,pia:375,pib:1875,csa:62.5,csb:1562.5};
  const d=PDMODE==='sep'?sep:uni;
  const pi=d.pia+d.pib, cs=d.csa+d.csb, ts=pi+cs, q=d.qa+d.qb;
  const set=(id,v)=>document.getElementById(id).textContent=v;
  set('t_pa',d.pa);set('t_pb',d.pb);set('t_qa',d.qa);set('t_qb',d.qb);set('t_q',q);
  set('t_pia',d.pia);set('t_pib',d.pib);set('t_pi',pi);
  set('t_csa',d.csa);set('t_csb',d.csb);set('t_cs',cs);
  set('t_ts',ts);set('t_share',(pi/ts*100).toFixed(1)+'%');
  document.getElementById('pdInterp').innerHTML=PDMODE==='sep'
    ?'<b>三级歧视:</b>A 市场(弹性大)定低价 15、卖 100;B 市场(弹性小)定高价 20、卖 200。各市场 MR=MC=10。利润 2500。'
    :'<b>统一定价:</b>合并需求 Q=1000−40P,MR=MC ⇒ P=17.5、总量 300(A 卖 50、B 卖 250)。利润 2250。';
}
document.querySelectorAll('#pd [data-pd]').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('#pd [data-pd]').forEach(x=>x.classList.remove('on'));b.classList.add('on');PDMODE=b.dataset.pd;drawPD();});

buildDerive();buildLab();drawPD();
</script>

  <p class=&quot;lead&quot;>企业雇多少工人?原则和定产量一样:让最后一个工人的<b>边际收益</b>等于<b>边际成本</b>。在要素市场上即 <span class=&quot;math&quot;>MRP=MFC</span>。完全竞争雇主面对水平工资 ⇒ <span class=&quot;math&quot;>VMP=W</span>;买方垄断雇主多雇要全员涨薪 ⇒ <span class=&quot;math&quot;>MFC&amp;gt;W</span>,雇得更少、压得更低。</p>
  <div class=&quot;formula&quot;>完全竞争：VMP = W　·　买方垄断：MRP = MFC</div>

<section id=&quot;lab&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>03</span><h2>最优雇佣实验室：竞争 vs 买方垄断</h2></div>
  <p class=&quot;sub&quot;>要素需求 <span class=&quot;math&quot;>VMP=A−gL</span>(向下倾)。切换雇主类型:完全竞争雇主面对水平工资 W,按 <span class=&quot;math&quot;>VMP=W</span> 雇佣;<b>买方垄断</b>雇主面对向上倾的供给 <span class=&quot;math&quot;>W=w₀+sL</span>,多雇要给全员涨薪 ⇒ <span class=&quot;math&quot;>MFC=w₀+2sL</span>,按 <span class=&quot;math&quot;>VMP=MFC</span> 雇佣、再到供给线上定低工资。</p>
  <div class=&quot;legend&quot;>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--vmp)&quot;></i>VMP 要素需求</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--supply)&quot;></i>劳动供给 W(L)</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--mfc)&quot;></i>MFC 边际要素成本</span>
    <span><i class=&quot;swatch&quot; style=&quot;background:var(--eq)&quot;></i>均衡 L*</span>
  </div>
  <div class=&quot;stage&quot;>
    <div class=&quot;figbox&quot;><div id=&quot;labHost&quot;></div></div>
    <div class=&quot;controls&quot;>
      <div class=&quot;btnrow&quot;><span class=&quot;lab&quot;>雇主类型：</span>
        <button class=&quot;btn on&quot; data-t=&quot;comp&quot;>完全竞争(VMP=W)</button>
        <button class=&quot;btn&quot; data-t=&quot;mono&quot;>买方垄断(VMP=MFC)</button></div>
      <div class=&quot;readout&quot;>
        <div class=&quot;ro l&quot;><div class=&quot;k&quot;>最优雇佣 L*</div><div class=&quot;val&quot; id=&quot;oL&quot;></div></div>
        <div class=&quot;ro w&quot;><div class=&quot;k&quot;>工资 W*</div><div class=&quot;val&quot; id=&quot;oW&quot;></div></div>
        <div class=&quot;ro m&quot;><div class=&quot;k&quot;>此处 VMP</div><div class=&quot;val&quot; id=&quot;oV&quot;></div></div>
        <div class=&quot;ro m&quot;><div class=&quot;k&quot;>此处 MFC</div><div class=&quot;val&quot; id=&quot;oM&quot;></div></div>
      </div>
      <div class=&quot;interp&quot; id=&quot;labInterp&quot;></div>
      <div class=&quot;sliders&quot;>
        <div class=&quot;slider&quot;><label>供给斜率 s（买方垄断市场势力）<span class=&quot;v&quot; id=&quot;vS&quot;></span></label><input type=&quot;range&quot; id=&quot;rS&quot; min=&quot;0&quot; max=&quot;3&quot; step=&quot;0.25&quot;></div>
      </div>
      <div class=&quot;note&quot;><b>买方垄断的代价:</b>因 MFC&amp;gt;W,雇主把雇佣量压到 VMP=MFC,雇得<b>更少</b>、工资压得<b>更低</b>(W 在供给线上,低于 VMP),产生要素市场的福利净损失。s=0 时退化为完全竞争。</div>
    </div>
  </div>
</div></section>

<!-- 4 MAP -->
<section id=&quot;map&quot; style=&quot;border-bottom:none&quot;><div class=&quot;wrap&quot;>
  <div class=&quot;sec-head&quot;><span class=&quot;sec-num&quot;>04</span><h2>计算题模板（练习4 / 6 / 7）</h2></div>
  <div class=&quot;duo&quot;>
    <div class=&quot;panel&quot;>
      <h3>练习5/4：竞争要素市场 VMP=W</h3>
      <p><b>练习5</b>(Q=10L−L², P=5, W=10):</p>
      <p class=&quot;deriv&quot; style=&quot;font-size:13.5px&quot;>VMP=MP·P=(10−2L)·5=W=10 ⇒ L*=4</p>
      <p style=&quot;margin-top:8px&quot;><b>练习4</b>(产品垄断 P=150−3Q, Q*=20, W=600 竞争要素市场):</p>
      <p class=&quot;deriv&quot; style=&quot;font-size:13.5px&quot;>MR=150−6Q=30 (Q=20)；MRP=MR·MP=W<br>30·MP=600 ⇒ MP=20</p>
    </div>
    <div class=&quot;panel&quot;>
      <h3>练习6/7：买方垄断 VMP=MFC</h3>
      <p><b>练习6</b>(Q=2L, P=110−Q, 供给 L=0.5W−20):</p>
      <p class=&quot;deriv&quot; style=&quot;font-size:13px&quot;>MR=110−2Q；TC=WL ⇒ MC=Q+20<br>MR=MC ⇒ Q*=30, L*=15, W*=70, P*=80</p>
      <p style=&quot;margin-top:8px&quot;><b>练习7</b>(P=2, Q=6L+3L²−0.02L³, W=60+3L):</p>
      <p class=&quot;deriv&quot; style=&quot;font-size:13px&quot;>VMP=2(6+6L−0.12L²)；MFC=60+6L<br>VMP=MFC ⇒ L*=40, Q*=3760, W*=180</p>
      <div class=&quot;note&quot;>练习7 有两解(10 与 40),L=10 时边际产出仍在<b>上升段</b>(不合理),取 <b>L*=40</b>。</div>
    </div>
  </div>
</div></section>

<script>
/* ===== 词典 ===== */
const GLOSS=[
 [&quot;MP_L&quot;,&quot;边际产量&quot;,&quot;Marginal product of labor&quot;,&quot;多雇 1 个工人增加的产量,MP=dQ/dL。&quot;,&quot;p-d&quot;],
 [&quot;VMP&quot;,&quot;边际产品价值&quot;,&quot;Value of marginal product&quot;,&quot;VMP=MP·P(产品市场完全竞争时)。完全竞争要素需求曲线。&quot;,&quot;p-d&quot;],
 [&quot;MRP&quot;,&quot;边际收益产品&quot;,&quot;Marginal revenue product&quot;,&quot;MRP=MP·MR。产品市场垄断时用 MR(MR&amp;lt;P)。&quot;,&quot;p-d&quot;],
 [&quot;W(L)&quot;,&quot;劳动供给曲线&quot;,&quot;Labor supply&quot;,&quot;各工资下愿提供的劳动量,通常<b>向右上倾</b>。&quot;,&quot;p-s&quot;],
 [&quot;MFC&quot;,&quot;边际要素成本&quot;,&quot;Marginal factor cost&quot;,&quot;多雇 1 单位要素增加的总成本。买方垄断 MFC=W+L·dW/dL &amp;gt; W。&quot;,&quot;p-m&quot;],
 [&quot;VMP=W&quot;,&quot;竞争雇佣原则&quot;,&quot;VMP = W&quot;,&quot;要素市场完全竞争(水平供给):按 VMP=W 雇佣,要素需求曲线=VMP。&quot;,&quot;p-r&quot;],
 [&quot;MRP=MFC&quot;,&quot;一般雇佣原则&quot;,&quot;MRP = MFC&quot;,&quot;要素的边际收益=边际成本。最优雇佣量的通用条件。&quot;,&quot;p-r&quot;],
 [&quot;买方垄断&quot;,&quot;monopsony&quot;,&quot;Monopsony&quot;,&quot;要素市场上唯一买方。面对向上倾的供给,MFC&amp;gt;W,雇得少、压低工资。&quot;,&quot;p-m&quot;],
 [&quot;卖方垄断要素&quot;,&quot;monopoly in product mkt&quot;,&quot;Product-market monopoly&quot;,&quot;产品市场垄断、要素市场竞争:用 MRP=MR·MP=W。&quot;,&quot;p-d&quot;],
 [&quot;要素需求&quot;,&quot;factor demand&quot;,&quot;Factor demand&quot;,&quot;派生需求:来自产品需求。给定 W,VMP=W 定最优 L。&quot;,&quot;p-d&quot;],
];
(function(){const g=document.getElementById('glossGrid');
 GLOSS.forEach(([s,cn,en,d,p])=>{const e=document.createElement('div');e.className='card';
  const col=p==='p-d'?'var(--vmp)':p==='p-s'?'var(--supply)':p==='p-m'?'var(--violet)':'#9a6e00';
  e.innerHTML=`<span class=&quot;sym&quot; style=&quot;color:${col}&quot;>${s}</span><span class=&quot;cn&quot;>${cn}</span><div class=&quot;en&quot;>${en}</div><div class=&quot;desc&quot;>${d}</div><span class=&quot;pill ${p}&quot;>${p==='p-d'?'要素需求':p==='p-s'?'要素供给':p==='p-m'?'买方垄断':'雇佣原则'}</span>`;
  g.appendChild(e);});})();

/* ===== 绘图基元 ===== */
function _css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function mx(v,P){return P.px+(v-P.xMin)/(P.xMax-P.xMin)*P.pw;}
function my(v,P){return P.py+P.ph-(v-P.yMin)/(P.yMax-P.yMin)*P.ph;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function L_(x1,y1,x2,y2,c,w,ex=''){return `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; ${ex}/>`;}
function T(x,y,t,c,s=13,a='start',w=600,it=false){return `<text x=&quot;${x}&quot; y=&quot;${y}&quot; fill=&quot;${c}&quot; font-size=&quot;${s}&quot; text-anchor=&quot;${a}&quot; font-weight=&quot;${w}&quot; ${it?'font-style=&quot;italic&quot; font-family=&quot;Georgia,serif&quot;':'font-family=&quot;PingFang SC,sans-serif&quot;'}>${t}</text>`;}
function svgOpen(w,h,label){return `<svg class=&quot;fig&quot; viewBox=&quot;0 0 ${w} ${h}&quot; role=&quot;img&quot; aria-label=&quot;${label}&quot;><defs>
  <marker id=&quot;ar&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;#192233&quot;/></marker></defs>`;}
function axesG(P,xlab,ylab){
  const Ey=P.py+P.ph,Ex=P.px+P.pw;let g='';
  for(let i=1;i<=4;i++){const gx=P.px+P.pw*i/5,gy=P.py+P.ph*i/5;g+=L_(gx,P.py,gx,Ey,'var(--grid)',1);g+=L_(P.px,gy,Ex,gy,'var(--grid)',1);}
  g+=L_(P.px,Ey,Ex+12,Ey,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=`<line x1=&quot;${P.px}&quot; y1=&quot;${Ey}&quot; x2=&quot;${P.px}&quot; y2=&quot;${P.py-12}&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/>`;
  g+=T(P.px-7,P.py-13,ylab,_css('--ink'),14,'end',700);
  g+=T(Ex+16,Ey+5,xlab,_css('--ink'),15,'start',800,true);
  g+=T(P.px-9,Ey+16,'O',_css('--ink'),13,'end',700);
  return g;
}
/* VMP = A - g L ; supply W = w0 + s L ; MFC = w0 + 2s L
   comp: W fixed = Wbar -> L: A-gL=Wbar
   mono: VMP=MFC -> A-gL=w0+2sL -> L=(A-w0)/(g+2s); W on supply */
const A=200,g0=10,w0=20; // VMP=200-10L ; supply W=20+sL
function drawFac(host,type,s,Wbar,opts){
  const P={px:50,py:22,pw:386,ph:320,xMin:0,xMax:20,yMin:0,yMax:210};
  let g=svgOpen(462,378,'要素投入');g+=axesG(P,'L 劳动','W, 收益');
  // VMP demand
  g+=L_(mx(0,P),my(A,P),mx(A/g0,P),my(0,P),_css('--vmp'),3);
  g+=T(mx(A/g0,P)-2,my(0,P)-8,'VMP',_css('--vmp'),12,'end',800,true);
  if(type==='comp'){
    g+=L_(P.px,my(Wbar,P),mx(20,P),my(Wbar,P),_css('--supply'),2.6,'stroke-dasharray=&quot;6 4&quot;');
    g+=T(mx(20,P),my(Wbar,P)-6,'W(供给,水平)',_css('--supply'),11,'end',800);
    const Ls=(A-Wbar)/g0;
    g+=L_(mx(Ls,P),my(Wbar,P),mx(Ls,P),P.py+P.ph,_css('--guide'),1.3,'stroke-dasharray=&quot;4 3&quot;');
    g+=`<circle cx=&quot;${mx(Ls,P)}&quot; cy=&quot;${my(Wbar,P)}&quot; r=&quot;7&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
    g+=T(mx(Ls,P),P.py+P.ph+15,'L*',_css('--eq')==='#E0A21A'?'#9a6e00':_css('--eq'),11,'middle',800,true);
    g+=T(P.px-7,my(Wbar,P)+4,'W',_css('--supply'),11,'end',800,true);
    return finish();
  }
  // monopsony
  const Lm=(A-w0)/(g0+2*s);
  const Wm=w0+s*Lm;          // wage from supply
  const supEnd=w0+s*20, mfcEnd=w0+2*s*20;
  g+=L_(mx(0,P),my(w0,P),mx(20,P),my(clamp(supEnd,0,210),P),_css('--supply'),2.8);
  g+=T(mx(19,P),my(clamp(supEnd,0,210),P)+12,'W(L)供给',_css('--supply'),11,'end',800);
  g+=L_(mx(0,P),my(w0,P),mx(20,P),my(clamp(mfcEnd,0,210),P),_css('--mfc'),2.6,'stroke-dasharray=&quot;6 4&quot;');
  g+=T(mx(15,P),my(clamp(w0+2*s*15,0,210),P)-6,'MFC',_css('--mfc'),11,'middle',800,true);
  // VMP=MFC at Lm, height = A-g0*Lm
  const vmpL=A-g0*Lm;
  g+=L_(mx(Lm,P),my(vmpL,P),mx(Lm,P),P.py+P.ph,_css('--guide'),1.3,'stroke-dasharray=&quot;4 3&quot;');
  g+=`<circle cx=&quot;${mx(Lm,P)}&quot; cy=&quot;${my(vmpL,P)}&quot; r=&quot;5.5&quot; fill=&quot;${_css('--mfc')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2&quot;/>`; // VMP=MFC
  g+=`<circle cx=&quot;${mx(Lm,P)}&quot; cy=&quot;${my(Wm,P)}&quot; r=&quot;6.5&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`; // wage on supply
  g+=L_(P.px,my(Wm,P),mx(Lm,P),my(Wm,P),_css('--supply'),1.1,'stroke-dasharray=&quot;3 3&quot; opacity=&quot;0.7&quot;');
  g+=T(mx(Lm,P),P.py+P.ph+15,'L*',_css('--eq')==='#E0A21A'?'#9a6e00':_css('--eq'),11,'middle',800,true);
  g+=T(P.px-7,my(Wm,P)+4,'W',_css('--supply'),11,'end',800,true);
  g+=T(mx(Lm,P)+8,my(vmpL,P),'VMP=MFC',_css('--mfc'),10,'start',800);
  return finish();
  function finish(){g+='</svg>';document.getElementById(host).innerHTML=g;}
}

/* ===== 第二节：推导剧场 ===== */
const DV={step:0};
const DSTEPS=[
 {tag:&quot;前提 · 雇佣原则&quot;,title:&quot;最后一个工人：收益 = 成本&quot;,
  body:`企业从产量决策(MR=MC)推广到要素决策:让最后一单位要素的<b>边际收益</b>等于<b>边际成本</b>。`,
  deriv:[[&quot;MRP_L = MFC_L&quot;,&quot;要素的边际收益 = 边际成本&quot;],[&quot;MRP=MP·MR；MFC=要素边际成本&quot;,&quot;&quot;]],type:'comp',s:0,W:90},
 {tag:&quot;第 1 步 · 完全竞争&quot;,title:&quot;VMP = W&quot;,
  body:`若要素市场完全竞争,雇主面对<b>水平</b>工资 W(想雇多少都按 W)。MFC=W,且产品市场也竞争时 MR=P ⇒ MRP=VMP=MP·P。<span class=&quot;key&quot;>VMP=W</span> 定最优雇佣,VMP 曲线就是要素需求曲线。`,
  deriv:[[&quot;MFC=W, MRP=VMP=MP·P&quot;,&quot;VMP=W ⇒ L*&quot;]],type:'comp',s:0,W:90},
 {tag:&quot;第 2 步 · 买方垄断&quot;,title:&quot;MFC > W：多雇要全员涨薪&quot;,
  body:`买方垄断雇主面对<b>向上倾</b>的供给:多雇 1 人,要给<b>所有人</b>都涨薪 ⇒ <span class=&quot;key&quot;>MFC = W + L·(dW/dL) &amp;gt; W</span>。MFC 曲线在供给线<b>上方</b>。`,
  deriv:[[&quot;MFC = W + L·dW/dL > W&quot;,&quot;供给 W=w₀+sL ⇒ MFC=w₀+2sL&quot;]],type:'mono',s:1.5,W:90},
 {tag:&quot;第 3 步 · 压低雇佣与工资&quot;,title:&quot;VMP = MFC 定雇佣，供给线定工资&quot;,
  body:`按 <span class=&quot;key&quot;>VMP=MFC</span> 定雇佣量 L*(比竞争<b>更少</b>),再到<b>供给线</b>上定工资 W*(比 VMP <b>更低</b>)。买方垄断同时压低了就业和工资。`,
  deriv:[[&quot;VMP = MFC ⇒ L*&quot;,&quot;W* 在供给线上 < VMP&quot;]],type:'mono',s:1.5,W:90},
];
function buildDerive(){
  const st=DSTEPS[DV.step];
  drawFac('dHost',st.type,st.s,st.W);
  document.getElementById('dTag').textContent=`${st.tag}（第 ${DV.step+1}/${DSTEPS.length} 步）`;
  document.getElementById('dTitle').textContent=st.title;
  document.getElementById('dBody').innerHTML=st.body;
  document.getElementById('dDeriv').innerHTML=st.deriv.map(([f,s])=>`<div class=&quot;deriv&quot;>${f}${s?`<small>${s}</small>`:''}</div>`).join('');
  document.getElementById('dPrev').disabled=DV.step===0;document.getElementById('dNext').disabled=DV.step===DSTEPS.length-1;
  document.getElementById('dDots').innerHTML=DSTEPS.map((_,i)=>`<i class=&quot;${i===DV.step?'on':''}&quot; data-i=&quot;${i}&quot;></i>`).join('');
  document.querySelectorAll('#dDots i').forEach(d=>d.onclick=()=>{DV.step=+d.dataset.i;buildDerive();});
}
document.getElementById('dNext').onclick=()=>{if(DV.step<DSTEPS.length-1){DV.step++;buildDerive();}};
document.getElementById('dPrev').onclick=()=>{if(DV.step>0){DV.step--;buildDerive();}};

/* ===== 第三节：实验室 ===== */
const LB={type:'comp',s:1.5,Wbar:90};
function buildLab(){
  drawFac('labHost',LB.type,LB.s,LB.Wbar);
  if(LB.type==='comp'){
    const Ls=(A-LB.Wbar)/g0;
    document.getElementById('oL').textContent=Ls.toFixed(2);
    document.getElementById('oW').textContent=LB.Wbar.toFixed(0);
    document.getElementById('oV').textContent=(A-g0*Ls).toFixed(0);
    document.getElementById('oM').textContent=LB.Wbar.toFixed(0)+' (=W)';
    document.getElementById('labInterp').innerHTML='完全竞争:MFC=W,按 <b>VMP=W</b> 雇佣;此处 VMP 恰等于 W。';
    document.getElementById('vS').parentElement.parentElement.style.opacity='0.4';
  }else{
    const Lm=(A-w0)/(g0+2*LB.s),Wm=w0+LB.s*Lm,vmp=A-g0*Lm,mfc=w0+2*LB.s*Lm;
    document.getElementById('oL').textContent=Lm.toFixed(2);
    document.getElementById('oW').textContent=Wm.toFixed(1);
    document.getElementById('oV').textContent=vmp.toFixed(1);
    document.getElementById('oM').textContent=mfc.toFixed(1);

  <h1>推导 <em>要素供给均衡图</em><br>劳动供给为何会&quot;后弯&quot;</h1>
  <p class=&quot;lead&quot;>人把时间分给<b>劳动</b>(换收入消费)和<b>闲暇</b>。工资是闲暇的<b>机会成本</b>。最优时 <span class=&quot;math&quot;>MRS_{H,C}=W</span>。工资上涨有两股力:<b style=&quot;color:var(--sub)&quot;>替代效应</b>(闲暇变贵→少休假多干活)与<b style=&quot;color:var(--inc)&quot;>收入效应</b>(更有钱→想多休假)。两者拉锯,造就了那条先升后<b>后弯</b>的劳动供给曲线。</p>

      <p>· <b>是消费者均衡的应用:</b>闲暇↔商品1、消费↔商品2,工资 W↔相对价格,<span class=&quot;math&quot;>MRS_{H,C}=W</span> ↔ <span class=&quot;math&quot;>MRS=P₁/P₂</span>。</p>
      <p>· <b>是第⑨张的另一半:</b>第⑨张定企业的要素<b>需求</b>;这张定家庭的要素<b>供给</b>。两者在要素市场相遇,决定工资与就业。</p>
      <p>· <b>把消费的收入/替代效应搬到了闲暇上:</b>和第②张的分解逻辑一致,只是对象换成&quot;闲暇&quot;。</p>

 [&quot;预算约束&quot;,&quot;budget constraint&quot;,&quot;Budget constraint&quot;,&quot;C=W·(L̄−H),斜率 −W;W↑ 时预算线绕端点 L̄ 变陡。&quot;,&quot;p-bu&quot;],
 [&quot;MRS_{H,C}&quot;,&quot;闲暇对消费的边际替代率&quot;,&quot;MRS of leisure for consumption&quot;,&quot;闲暇的边际效用 ÷ 消费的边际效用。最优时 =W。&quot;,&quot;p-pr&quot;],
 [&quot;最优条件&quot;,&quot;MRS=W&quot;,&quot;MRS = W&quot;,&quot;闲暇的边际效用 = 出售时间带来的边际效用 W·(∂U/∂C)。&quot;,&quot;p-pr&quot;],
 [&quot;替代效应&quot;,&quot;substitution effect&quot;,&quot;Substitution effect&quot;,&quot;W↑ ⇒ 闲暇变贵 ⇒ 少休假、多劳动(闲暇↓)。&quot;,&quot;p-ef&quot;],
 [&quot;收入效应&quot;,&quot;income effect&quot;,&quot;Income effect&quot;,&quot;W↑ ⇒ 更富 ⇒ 想多享受闲暇(闲暇↑、劳动↓)。&quot;,&quot;p-ef&quot;],
 [&quot;后弯供给曲线&quot;,&quot;backward-bending supply&quot;,&quot;Backward-bending labor supply&quot;,&quot;低工资段右上倾、高工资段后弯,因收入效应反超替代效应。&quot;,&quot;p-su&quot;],
];
(function(){const g=document.getElementById('glossGrid');
 GLOSS.forEach(([s,cn,en,d,p])=>{const e=document.createElement('div');e.className='card';
  const col=p==='p-pr'?'var(--ic)':p==='p-bu'?'var(--budget)':p==='p-ef'?'var(--inc)':'var(--supply)';
  e.innerHTML=`<span class=&quot;sym&quot; style=&quot;color:${col}&quot;>${s}</span><span class=&quot;cn&quot;>${cn}</span><div class=&quot;en&quot;>${en}</div><div class=&quot;desc&quot;>${d}</div><span class=&quot;pill ${p}&quot;>${p==='p-pr'?'偏好/最优':p==='p-bu'?'预算/时间':p==='p-ef'?'两效应':'供给曲线'}</span>`;
  g.appendChild(e);});})();

/* ===== 模型 =====
   U = C^alpha * H^beta (Cobb-Douglas over consumption &amp; leisure)
   预算: C = W(Lbar - H) -> C + W·H = W·Lbar (full income M=W·Lbar)
   最优: H* = (beta/(alpha+beta)) * M / W = (beta/(alpha+beta))·Lbar  (纯 CD 下 H 与 W 无关 -> 不会后弯)
   为产生后弯,用准线性/带保留闲暇的偏好。这里采用经验后弯供给式:
   L(W) = Lmax * (W/(W+k)) * exp(-W/w2)  形态先升后降
   为教学，直接用一个平滑的后弯函数并保证单调段清晰。
*/
const Lbar=10;
// 劳动供给(后弯)经验式：先升后降，峰值在 W≈Wpeak
const Wpeak=5;
function Lsup(W){ // 0..~ Lbar
  const rise=W/(W+1.2);            // 0->1 递增(替代效应)
  const fall=Math.exp(-Math.pow(Math.max(0,W-Wpeak)/4.2,2)); // 高工资衰减(收入效应)
  return 8.2*rise*fall;
}
function Hopt(W){return Lbar-Lsup(W);}

/* ===== 绘图基元 ===== */
function _css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim();}
function mx(v,P){return P.px+(v-P.xMin)/(P.xMax-P.xMin)*P.pw;}
function my(v,P){return P.py+P.ph-(v-P.yMin)/(P.yMax-P.yMin)*P.ph;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function L_(x1,y1,x2,y2,c,w,ex=''){return `<line x1=&quot;${x1}&quot; y1=&quot;${y1}&quot; x2=&quot;${x2}&quot; y2=&quot;${y2}&quot; stroke=&quot;${c}&quot; stroke-width=&quot;${w}&quot; ${ex}/>`;}
function T(x,y,t,c,s=13,a='start',w=600,it=false){return `<text x=&quot;${x}&quot; y=&quot;${y}&quot; fill=&quot;${c}&quot; font-size=&quot;${s}&quot; text-anchor=&quot;${a}&quot; font-weight=&quot;${w}&quot; ${it?'font-style=&quot;italic&quot; font-family=&quot;Georgia,serif&quot;':'font-family=&quot;PingFang SC,sans-serif&quot;'}>${t}</text>`;}
function svgOpen(w,h,label){return `<svg class=&quot;fig&quot; viewBox=&quot;0 0 ${w} ${h}&quot; role=&quot;img&quot; aria-label=&quot;${label}&quot;><defs>
  <marker id=&quot;ar&quot; markerWidth=&quot;9&quot; markerHeight=&quot;9&quot; refX=&quot;7&quot; refY=&quot;4.5&quot; orient=&quot;auto&quot;><path d=&quot;M0,0 L9,4.5 L0,9 z&quot; fill=&quot;#192233&quot;/></marker></defs>`;}
function axesG(P,xlab,ylab){
  const Ey=P.py+P.ph,Ex=P.px+P.pw;let g='';
  for(let i=1;i<=4;i++){const gx=P.px+P.pw*i/5,gy=P.py+P.ph*i/5;g+=L_(gx,P.py,gx,Ey,'var(--grid)',1);g+=L_(P.px,gy,Ex,gy,'var(--grid)',1);}
  g+=L_(P.px,Ey,Ex+12,Ey,'#192233',2,'marker-end=&quot;url(#ar)&quot;');
  g+=`<line x1=&quot;${P.px}&quot; y1=&quot;${Ey}&quot; x2=&quot;${P.px}&quot; y2=&quot;${P.py-12}&quot; stroke=&quot;#192233&quot; stroke-width=&quot;2&quot; marker-end=&quot;url(#ar)&quot;/>`;
  g+=T(P.px-7,P.py-13,ylab,_css('--ink'),14,'end',700);
  g+=T(Ex+16,Ey+5,xlab,_css('--ink'),14,'start',800,true);
  g+=T(P.px-9,Ey+16,'O',_css('--ink'),13,'end',700);
  return g;
}
/* 左图：闲暇-消费选择 */
function drawCH(host,W,opts){
  const P={px:50,py:22,pw:380,ph:300,xMin:0,xMax:11,yMin:0,yMax:46};
  const H=Hopt(W),C=W*(Lbar-H);
  let g=svgOpen(460,358,'闲暇-消费');g+=axesG(P,'H 闲暇','C 消费');
  // budget line: from (Lbar,0) to (0, W*Lbar)
  g+=L_(mx(Lbar,P),my(0,P),mx(0,P),my(clamp(W*Lbar,0,46),P),_css('--budget'),2.8);
  g+=T(mx(Lbar,P),my(0,P)+15,'L̄',_css('--budget'),12,'middle',800,true);
  if(opts.alt){ // show a second (lower wage) budget faded for comparison
    const W2=opts.alt;g+=L_(mx(Lbar,P),my(0,P),mx(0,P),my(clamp(W2*Lbar,0,46),P),_css('--budget'),1.6,'opacity=&quot;0.3&quot; stroke-dasharray=&quot;5 4&quot;');
  }
  // indifference curve through optimum (Cobb-Douglas-ish): C*H const? use C=k - draw a smooth IC tangent
  // approximate IC: C = U/H form won't tangent generally; draw a representative convex curve through E with slope -W
  const ex=mx(H,P),ey=my(clamp(C,0,46),P);
  // representative IC: hyperbola C=A/(H+0.6) scaled to pass E with slope ~ -W
  (function(){let pts=[];const k=(C)*(H+0.8);for(let i=0;i<=80;i++){const h=0.2+10.6*i/80;const c=k/(h+0.8);if(c<=46)pts.push([mx(h,P),my(c,P)]);}let d='M'+pts[0][0]+' '+pts[0][1];for(let i=1;i<pts.length;i++)d+=' L'+pts[i][0]+' '+pts[i][1];g+=`<path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--ic')}&quot; stroke-width=&quot;2.4&quot;/>`;})();
  g+=T(mx(1.2,P),my(clamp((C)*(H+0.8)/(1.2+0.8),0,46),P)-6,'U',_css('--ic'),12,'start',800,true);
  // optimum
  g+=L_(ex,ey,ex,P.py+P.ph,_css('--guide'),1.3,'stroke-dasharray=&quot;4 3&quot;');
  g+=L_(ex,ey,P.px,ey,_css('--guide'),1.3,'stroke-dasharray=&quot;4 3&quot;');
  g+=`<circle cx=&quot;${ex}&quot; cy=&quot;${ey}&quot; r=&quot;7&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
  g+=T(ex+9,ey-7,'G*',_css('--eq')==='#E0A21A'?'#9a6e00':_css('--eq'),13,'start',800);
  g+=T(ex,P.py+P.ph+15,'H*',_css('--ic'),11,'middle',800,true);
  // labor = Lbar - H bracket
  const yb=P.py+P.ph+25;
  g+=L_(mx(H,P),yb,mx(Lbar,P),yb,_css('--supply'),3);
  g+=T((mx(H,P)+mx(Lbar,P))/2,yb-4,'劳动 L=L̄−H',_css('--supply'),10.5,'middle',700);
  g+='</svg>';document.getElementById(host).innerHTML=g;
}
/* 右图：劳动供给曲线 L(W) */
function drawSupply(host,Wcur){
  const P={px:50,py:22,pw:380,ph:300,xMin:0,xMax:11,yMin:0,yMax:10};
  let g=svgOpen(460,358,'劳动供给');g+=axesG(P,'L 劳动','W 工资');
  // supply curve: x=L(W), y=W  (W on vertical, L on horizontal) -> plot (Lsup(W), W)
  let pts=[];for(let i=0;i<=120;i++){const W=0.2+9.5*i/120;pts.push([mx(Lsup(W),P),my(W,P)]);}
  let d='M'+pts[0][0]+' '+pts[0][1];for(let i=1;i<pts.length;i++)d+=' L'+pts[i][0]+' '+pts[i][1];
  g+=`<path d=&quot;${d}&quot; fill=&quot;none&quot; stroke=&quot;${_css('--supply')}&quot; stroke-width=&quot;3&quot;/>`;
  g+=T(mx(Lsup(9),P)-6,my(9,P),'S(劳动供给)',_css('--supply'),12,'end',800);
  // peak marker (where backward bend begins)
  let peakW=Wpeak,peakL=Lsup(Wpeak);
  g+=L_(mx(peakL,P),P.py,mx(peakL,P),P.py+P.ph,_css('--ink-faint'),1,'stroke-dasharray=&quot;3 3&quot; opacity=&quot;0.5&quot;');
  g+=T(mx(peakL,P),P.py+10,'后弯起点',_css('--ink-faint'),10,'middle',700);
  // current point
  const cx=mx(Lsup(Wcur),P),cy=my(Wcur,P);
  g+=L_(cx,cy,cx,P.py+P.ph,_css('--guide'),1.2,'stroke-dasharray=&quot;4 3&quot;');
  g+=L_(cx,cy,P.px,cy,_css('--guide'),1.2,'stroke-dasharray=&quot;4 3&quot;');
  g+=`<circle cx=&quot;${cx}&quot; cy=&quot;${cy}&quot; r=&quot;7&quot; fill=&quot;${_css('--eq')}&quot; stroke=&quot;#fff&quot; stroke-width=&quot;2.5&quot;/>`;
  g+='</svg>';document.getElementById(host).innerHTML=g;
}

/* ===== 第二节：推导剧场 ===== */
const DV={step:0};
const DSTEPS=[
 {tag:&quot;前提 · 预算约束&quot;,title:&quot;时间分配：闲暇还是消费&quot;,
  body:`总时间 <span class=&quot;math&quot;>L̄</span> 分给闲暇 H 与劳动 L̄−H。劳动换工资买消费:<span class=&quot;math&quot;>C=W(L̄−H)</span>,预算线斜率 <span class=&quot;key&quot;>−W</span>(工资=闲暇的机会成本)。`,
  deriv:[[&quot;C = W·(L̄ − H)&quot;,&quot;斜率 −W;端点在 H=L̄(全休假,C=0)&quot;]],W:3,opts:{}},
 {tag:&quot;第 1 步 · 最优&quot;,title:&quot;无差异曲线与预算线相切&quot;,
  body:`和消费者均衡一样:在预算约束下爬到最高无差异曲线,切点 <span class=&quot;key&quot;>G*</span> 即最优。`,
  deriv:[[&quot;MRS_{H,C} = W&quot;,&quot;闲暇边际效用 ÷ 消费边际效用 = W&quot;]],W:3,opts:{}},
 {tag:&quot;第 2 步 · 工资上涨&quot;,title:&quot;两股相反的力&quot;,
  body:`W↑ ⇒ 预算线绕端点 L̄ <b>变陡</b>。<b style=&quot;color:var(--sub)&quot;>替代效应</b>:闲暇变贵 → 少休假;<b style=&quot;color:var(--inc)&quot;>收入效应</b>:更富 → 想多休假。方向相反。`,
  deriv:[[&quot;替代效应：H↓ (劳动↑)&quot;,&quot;收入效应：H↑ (劳动↓)&quot;]],W:6,opts:{alt:3}},
 {tag:&quot;第 3 步 · 后弯&quot;,title:&quot;两效应拉锯 ⇒ 供给后弯&quot;,
  body:`低工资段替代效应占优 → W↑ 时劳动↑(右上倾);高工资段收入效应反超 → W↑ 时劳动反而↓ ⇒ <span class=&quot;key&quot;>劳动供给曲线后弯</span>(见③)。`,
  deriv:[[&quot;低 W：替代 > 收入 ⇒ L↑&quot;,&quot;高 W：收入 > 替代 ⇒ L↓(后弯)&quot;]],W:7.5,opts:{}},
];
function buildDerive(){
  const st=DSTEPS[DV.step];
  drawCH('dHost',st.W,st.opts);
  document.getElementById('dTag').textContent=`${st.tag}（第 ${DV.step+1}/${DSTEPS.length} 步）`;
  document.getElementById('dTitle').textContent=st.title;
  document.getElementById('dBody').innerHTML=st.body;
  document.getElementById('dDeriv').innerHTML=st.deriv.map(([f,s])=>`<div class=&quot;deriv&quot;>${f}${s?`<small>${s}</small>`:''}</div>`).join('');
  document.getElementById('dPrev').disabled=DV.step===0;document.getElementById('dNext').disabled=DV.step===DSTEPS.length-1;
  document.getElementById('dDots').innerHTML=DSTEPS.map((_,i)=>`<i class=&quot;${i===DV.step?'on':''}&quot; data-i=&quot;${i}&quot;></i>`).join('');
  document.querySelectorAll('#dDots i').forEach(d=>d.onclick=()=>{DV.step=+d.dataset.i;buildDerive();});
}
document.getElementById('dNext').onclick=()=>{if(DV.step<DSTEPS.length-1){DV.step++;buildDerive();}};
document.getElementById('dPrev').onclick=()=>{if(DV.step>0){DV.step--;buildDerive();}};

/* ===== 第三节：实验室 ===== */
const LB={W:3};
function buildLab(){
  drawSupply('labHost',LB.W);
  document.getElementById('vW').textContent=' = '+LB.W.toFixed(1);
  document.getElementById('oW').textContent=LB.W.toFixed(1);
  document.getElementById('oLb').textContent=Lsup(LB.W).toFixed(2);
  const bd=document.getElementById('labBadge'),it=document.getElementById('labInterp');
  // slope of supply: dL/dW
  const dL=Lsup(LB.W+0.05)-Lsup(LB.W-0.05);
  if(dL>0.002){bd.style.background='rgba(46,127,209,.12)';bd.style.color='var(--sub)';bd.textContent='替代效应占优 · 供给右上倾';
    it.innerHTML='低工资段:W↑ ⇒ 闲暇变贵,<b>替代效应</b>主导 ⇒ 少休假、<b>多劳动</b>,供给曲线向右上倾斜。';}
  else if(dL<-0.002){bd.style.background='rgba(31,158,90,.12)';bd.style.color='var(--inc)';bd.textContent='收入效应占优 · 供给后弯';
    it.innerHTML='高工资段:W↑ ⇒ 已经很富,<b>收入效应</b>主导 ⇒ 想多休假、<b>少劳动</b>,供给曲线<b>后弯</b>。';}
  else{bd.style.background='rgba(224,162,26,.16)';bd.style.color='#9a6e00';bd.textContent='两效应相抵 · 供给曲线顶点';
    it.innerHTML='替代效应与收入效应<b>大致抵消</b>,劳动供给达到峰值,曲线在此转向后弯。';}
}
document.getElementById('rW').addEventListener('input',e=>{LB.W=+e.target.value;buildLab();});
document.getElementById('rW').value=LB.W;
buildDerive();buildLab();
</script>
